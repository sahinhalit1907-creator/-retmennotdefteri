    });
    const evs = S.queryEvents({ studentId: s.id, termId: sum.termId, voided: 'no' });
    const hrows = (list) => list.map((e) => [new Date(e.ts), { v: typeLabel(e.type), tone: e.type }, reasonLabel(e)]);
    const hcols = [{ label: 'Tarih / saat', w: 1.6 }, { label: 'Tür', w: 1 }, { label: 'Neden', w: 3 }];
    blocks.push({ t: 'table', sheet: 'İşlemler', title: 'Son işlemler', cols: hcols, rows: hrows(evs.slice(0, 40)), only: ['pdf', 'print'], empty: 'İşlem yok.' });
    blocks.push({ t: 'table', sheet: 'İşlemler', cols: hcols, rows: hrows(evs), only: ['xlsx', 'csv'] });
    return {
      title: 'E+ · Öğrenci Raporu',
      subtitle: `${S.fullName(s)}${s.no ? ' · No ' + s.no : ''} · ${sum.cls ? S.classFull(sum.cls) : ''}`,
      meta: meta([sum.termId === 'all' ? 'Dönem: Tüm dönemler' : 'Dönem: ' + ((S.terms.get(sum.termId === 'current' ? S.cfg.currentTermId : sum.termId) || {}).name || '')]),
      landscape: false,
      filename: U.safeFilename(`Ogrenci_${S.fullName(s)}_${U.isoDay(Date.now())}`),
      sheetTitle: 'Özet',
      blocks,
    };
  };

  /* ---------- Öğrenci listesi (yazdırma) ---------- */
  // mode: 'scores' (+/−/toplam) | 'blank' (boş çizelge)
  D.roster = function (classId, mode, periodKey) {
    const cls = S.classes.get(classId);
    const f = R.listFilter(periodKey || 'term');
    const cs = S.classStats(classId, f);
    const blocks = [];
    if (mode === 'blank') {
      const n = 14;
      const cols = [{ label: 'No', w: 0.9 }, { label: 'Adı Soyadı', w: 3.4 }];
      for (let i = 0; i < n; i++) cols.push({ label: '', w: 0.62, blank: true });
      blocks.push({ t: 'table', sheet: 'Liste', cols, rows: cs.rows.map((r) => [r.student.no || '', S.fullName(r.student)].concat(new Array(n).fill(''))), rowHeight: 1.7, grid: true });
    } else {
      blocks.push({
        t: 'kpis',
        items: [
          { label: 'Öğrenci', value: String(cs.totals.students) },
          { label: 'Toplam artı', value: String(cs.totals.plus), tone: 'plus' },
          { label: 'Toplam eksi', value: String(cs.totals.minus), tone: 'minus' },
          { label: 'Sınıf ortalaması', value: sg(cs.totals.avgNet), tone: tone(cs.totals.avgNet) },
        ],
      });
      blocks.push({
        t: 'table',
        sheet: 'Liste',
        cols: [{ label: 'No', w: 1 }, { label: 'Öğrenci', w: 4 }, { label: '+', align: 'right', w: 1 }, { label: '−', align: 'right', w: 1 }, { label: 'Toplam', align: 'right', w: 1.2 }],
        rows: cs.rows.map((r) => [r.student.no || '', S.fullName(r.student), { v: r.plus, tone: 'plus' }, { v: r.minus, tone: 'minus' }, { v: r.net, tone: tone(r.net), signed: true, bold: true }]),
        empty: 'Bu sınıfta öğrenci yok.',
      });
    }
    return {
      title: 'E+ · ' + (mode === 'blank' ? 'Sınıf Çizelgesi' : 'Öğrenci Listesi'),
      subtitle: `${S.classTitle(cls)}${cls.label ? ' · ' + cls.label : ''}${mode === 'blank' ? '' : ' · ' + R.periodLabel(periodKey || 'term')}`,
      meta: meta([]),
      landscape: mode === 'blank',
      filename: U.safeFilename(`Liste_${S.className(cls)}_${mode === 'blank' ? 'cizelge' : 'puanli'}_${U.isoDay(Date.now())}`),
      sheetTitle: 'Liste',
      blocks,
    };
  };

  /* ---------- Excel / CSV için satırlar ---------- */
  const cellV = (c) => (c && typeof c === 'object' && !(c instanceof Date) ? c.v : c);
  D.toSheets = function (doc) {
    const sheets = new Map();
    const getSheet = (name) => {
      if (!sheets.has(name)) sheets.set(name, { name, rows: [], colWidths: [], landscape: !!doc.landscape });
      return sheets.get(name);
    };
    const first = doc.sheetTitle || 'Rapor';
    const head = getSheet(first);
    head.rows.push([{ v: doc.title, s: 'title' }]);
    head.rows.push([{ v: doc.subtitle, s: 'subtitle' }]);
    doc.meta.forEach((m) => head.rows.push([{ v: m, s: 'muted' }]));
    head.rows.push([]);
    for (const b of doc.blocks) {
      if (b.only && !b.only.includes('xlsx')) continue;
      const sh = getSheet(b.sheet || first);
      if (b.t === 'kpis') {
        sh.rows.push(b.items.map((i) => ({ v: i.label, s: 'header' })));
        sh.rows.push(b.items.map((i) => ({ v: i.value, s: i.tone === 'plus' ? 'plus' : i.tone === 'minus' ? 'minus' : 'bold' })));
        sh.rows.push([]);
      } else if (b.t === 'heading') {
        // başlıklar tablo başlığı olarak kullanılır
      } else if (b.t === 'table') {
        if (b.title) sh.rows.push([{ v: b.title, s: 'bold' }]);
        const hdrIndex = sh.rows.length;
        sh.rows.push(b.cols.map((c) => ({ v: c.label, s: 'header' })));
        if (!b.rows.length && b.empty) sh.rows.push([{ v: b.empty, s: 'muted' }]);
        for (const r of b.rows) {
          sh.rows.push(
            r.map((c) => {
              if (c instanceof Date) return { v: c, s: 'datetime' };
              if (c && typeof c === 'object') {
                let s = c.tone === 'plus' ? 'plus' : c.tone === 'minus' ? 'minus' : c.bold ? 'bold' : undefined;
                if (c.tone === 'muted') s = undefined;
                if (c.dec) return { v: c.v, s: s === 'plus' || s === 'minus' ? s : 'dec1' };
                return { v: c.v, s };
              }
              return c;
            })
          );
        }
        sh.rows.push([]);
        sh._hdr = sh._hdr == null ? hdrIndex : sh._hdr;
        b.cols.forEach((c, i) => {
          const w = Math.max(10, Math.round((c.w || 1) * 12));
          sh.colWidths[i] = Math.max(sh.colWidths[i] || 0, Math.min(w, 48));
        });
      }
    }
    const out = [];
    for (const sh of sheets.values()) {
      if (sh.rows.length <= 1 && sh.name !== first) continue;
      const hdr = sh._hdr;
      out.push({ name: sh.name, rows: sh.rows, colWidths: sh.colWidths.map((w) => w || 12), landscape: sh.landscape, freezeRows: sh.name === 'İşlemler' && hdr != null ? hdr + 1 : 0, autoFilter: sh.name === 'İşlemler' && hdr != null });
    }
    return out;
  };
  // CSV: ilk uygun tablo (ya da belirtilen sayfa)
  D.toCsvRows = function (doc, sheetName) {
    const t = doc.blocks.find((b) => b.t === 'table' && (!sheetName || b.sheet === sheetName) && !(b.only && !b.only.includes('csv') && !b.only.includes('xlsx')));
    if (!t) return [];
    const rows = [t.cols.map((c) => c.label)];
    for (const r of t.rows) rows.push(r.map((c) => { const v = cellV(c); return v instanceof Date ? v : v; }));
    return rows;
  };

  OGR.docs = D;
})();

/* js/core/demo.js */
/* E+ · Örnek veri üretici ("Örnek verilerle dene"). Gerçek öğrenci verisi içermez. */
(function () {
  'use strict';
  const G = typeof globalThis !== 'undefined' ? globalThis : window;
  const OGR = (G.OGR = G.OGR || {});
  const U = OGR.util;

  const FIRST_F = ['Ayşe', 'Zeynep', 'Elif', 'Defne', 'Ecrin', 'Nehir', 'Asya', 'İpek', 'Selin', 'Melis', 'Yağmur', 'Beren', 'Sude', 'Azra', 'Duru', 'Lale', 'Nisa', 'Irmak', 'Ela', 'Hira', 'Mina', 'Eylül'];
  const FIRST_M = ['Ahmet', 'Mehmet', 'Mustafa', 'Emir', 'Yusuf', 'Kerem', 'Arda', 'Alperen', 'Eymen', 'Ömer', 'Burak', 'Can', 'Deniz', 'Efe', 'Mert', 'Kaan', 'Berk', 'Çınar', 'Ege', 'Ozan', 'Poyraz', 'Tuna'];
  const LAST = ['Yılmaz', 'Kaya', 'Demir', 'Şahin', 'Çelik', 'Yıldız', 'Yıldırım', 'Öztürk', 'Aydın', 'Özdemir', 'Arslan', 'Doğan', 'Kılıç', 'Aslan', 'Çetin', 'Kara', 'Koç', 'Kurt', 'Özkan', 'Şimşek', 'Polat', 'Erdoğan', 'Güneş', 'Acar', 'Bulut', 'Tekin', 'Aksoy', 'Karaca', 'Taş', 'Uçar'];
  const NOTES = [
    'Velisiyle görüşüldü; ödev takibi için haftalık bilgilendirme yapılacak.',
    'Grup çalışmalarında liderlik yapıyor, arkadaşlarına destek oluyor.',
    'Derste dikkat dağınıklığı yaşıyor; ön sıraya alındı.',
    'Okuma hızı gelişti, sesli okuma etkinliklerine gönüllü katılıyor.',
    'Kazanım testinde zorlandığı konular: kesirler ve ondalık gösterim.',
    'Sınıf temsilcisi adayı oldu.',
  ];

  function prevTermName(name) {
    const m = /^(\d{4})-(\d{4}) · ([12])\. Dönem$/.exec(name);
    if (!m) return 'Önceki Dönem';
    const a = +m[1], b = +m[2];
    return m[3] === '2' ? `${a}-${b} · 1. Dönem` : `${a - 1}-${b - 1} · 2. Dönem`;
  }

  async function create() {
    const store = OGR.store;
    const { account } = await OGR.auth.create({ name: 'Örnek Öğretmen', email: 'ornek@eplus.local', password: 'Ornek-2026-demo', school: 'Örnek Ortaokulu', demo: true });
    await store.open(account);
    const rnd = U.rng(20261109);
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    const now = Date.now();
    const DAY = 86400000;

    // Dönemler: bir arşivlenmiş, bir güncel
    const curName = U.suggestTermName(now);
    const termNew = { id: U.uid(), name: curName, startedAt: now - 42 * DAY, endedAt: null };
    const termOld = { id: U.uid(), name: prevTermName(curName), startedAt: now - 190 * DAY, endedAt: termNew.startedAt };
    store.batch(() => {
      for (const t of Array.from(store.terms.values())) store._del('terms', t.id);
      store._put('terms', termOld);
      store._put('terms', termNew);
      store.cfg.currentTermId = termNew.id;
      store._putCfg();
    });

    const specs = [
      { grade: 5, section: 'A', label: 'Matematik', n: 22, base: 100 },
      { grade: 5, section: 'B', label: 'Matematik', n: 20, base: 200 },
      { grade: 7, section: 'C', label: 'Fen Bilimleri', n: 24, base: 300 },
    ];
    const plusR = store.sortedReasons('plus');
    const minusR = store.sortedReasons('minus');
    const students = [];
    for (const sp of specs) {
      const cls = store.addClass({ grade: sp.grade, section: sp.section, label: sp.label });
      const used = new Set();
      for (let i = 0; i < sp.n; i++) {
        let first, last, key;
        do {
          first = rnd() < 0.5 ? pick(FIRST_F) : pick(FIRST_M);
          last = pick(LAST);
          key = first + ' ' + last;
        } while (used.has(key));
        used.add(key);
        const s = store.addStudent(cls.id, { first, last, no: String(sp.base + i + 1) });
        students.push({ s, trait: rnd() * 1.5 - 0.5, active: 0.15 + rnd() * 0.35 });
      }
    }

    function fill(term, from, to, scale) {
      for (let day = U.startOfDay(from); day < to; day = U.addDays(day, 1)) {
        const wd = (new Date(day).getDay() + 6) % 7;
        if (wd > 4) continue;
        for (const st of students) {
          if (rnd() > st.active * scale) continue;
          const k = rnd() < 0.25 ? 2 : 1;
          for (let j = 0; j < k; j++) {
            const pPlus = U.clamp(0.55 + st.trait * 0.3, 0.1, 0.95);
            const type = rnd() < pPlus ? 'plus' : 'minus';
            const ts = day + (8 * 60 + 30 + Math.floor(rnd() * 400)) * 60000;
            if (ts > now || ts < term.startedAt) continue;
            const withReason = rnd() < 0.75;
            const r = withReason ? pick(type === 'plus' ? plusR : minusR) : null;
            const ev = store.giveEvent(st.s.id, type, { reasonId: r ? r.id : null, ts });
            ev.termId = term.id;
          }
        }
      }
    }
    store.batch(() => {
      fill(termOld, termOld.startedAt, termOld.endedAt, 0.8);
      fill(termNew, termNew.startedAt, now + DAY, 1);
      // not örnekleri
      for (let i = 0; i < NOTES.length; i++) {
        const st = students[(i * 7 + 3) % students.length].s;
        const n = store.addNote(st.id, NOTES[i]);
        n.ts = n.uts = now - (i * 3 + 1) * DAY;
        store._put('notes', n);
      }
      // davranış notları + devamsızlık örnekleri
      const GR = ['Derse aktif katıldı', 'Arkadaşlarına yardım etti', 'Ders sırasında konuştu', 'Ödevini eksiksiz yaptı', 'Sınıf kurallarına uydu', 'Dikkati dağıldı'];
      for (const st of students) {
        const cnt = 1 + Math.floor(rnd() * 3);
        for (let j = 0; j < cnt; j++) {
          const ts = now - Math.floor(rnd() * 40) * DAY - 3600000;
          if (ts < termNew.startedAt) continue;
          store.addGrade(st.s.id, { score: Math.round(U.clamp(78 + st.trait * 12 + (rnd() * 20 - 10), 30, 100)), reason: pick(GR), ts });
        }
        const nAbs = Math.floor(rnd() * 3.2);
        for (let j = 0; j < nAbs; j++) {
          const d = U.addDays(U.startOfDay(now), -(1 + Math.floor(rnd() * 30)));
          if (d < termNew.startedAt || (new Date(d).getDay() + 6) % 7 > 4) continue;
          const type = ['unexcused', 'excused', 'excused', 'late'][Math.floor(rnd() * 4)];
          store.setAbsence(st.s.id, U.isoDay(d), type, type === 'excused' ? 'Raporlu' : '');
        }
      }
    });
    store.session.undo = [];
    store.setCfg({ hintDismissed: false });
    await store.flush();
    return account;
  }

  OGR.demo = { create };
})();

/* js/ui/ui.js */
/* E+ · Arayüz araç takımı: güvenli HTML şablonu, simgeler, pencere, menü, bildirim. */
(function () {
  'use strict';
  const G = window;
  const OGR = (G.OGR = G.OGR || {});
  const U = OGR.util;
  const ui = {};

  /* ---------- Güvenli şablon ---------- */
  class Raw {
    constructor(s) { this.s = s; }
    toString() { return this.s; }
  }
  const raw = (s) => new Raw(String(s));
  const part = (v) => {
    if (v == null || v === false || v === true) return '';
    if (v instanceof Raw) return v.s;
    if (Array.isArray(v)) return v.map(part).join('');
    return U.esc(String(v));
  };
  const h = (strings, ...vals) => {
    let out = strings[0];
    for (let i = 0; i < vals.length; i++) out += part(vals[i]) + strings[i + 1];
    return new Raw(out);
  };
  ui.h = h;
  ui.raw = raw;
  ui.str = (v) => part(v);

  /* ---------- Simgeler (24x24, çizgi) ---------- */
  const P = {
    plus: '<path d="M12 5v14M5 12h14"/>',

  ui.icon = (name, cls) => raw(`<svg class="i${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${P[name] || ''}</svg>`);

  const LOGO = `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#11213f"/><g stroke="#ffffff" stroke-opacity=".09" stroke-width="1"><path d="M16 0v64M32 0v64M48 0v64M0 16h64M0 32h64M0 48h64"/></g><path d="M22 16v22M11 27h22" stroke="#2fd3a8" stroke-width="7" stroke-linecap="round"/><path d="M39 46h15" stroke="#ff7a62" stroke-width="7" stroke-linecap="round"/></svg>`;
  ui.logo = raw(LOGO);

  /* ---------- DOM kısayolları ---------- */
  ui.$ = (sel, root) => (root || document).querySelector(sel);
  ui.$$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  ui.set = (el, html) => { el.innerHTML = String(html); return el; };
  ui.frag = (html) => { const t = document.createElement('template'); t.innerHTML = String(html).trim(); return t.content.firstElementChild; };

  // Temsilci olay: root içinde [data-act] tıklamaları
  ui.delegate = function (root, handlers) {
    // Aynı kök için tek dinleyici; işleyiciler güncellenir (yinelenen tıklama olmaz)
    if (root.__acts) { Object.assign(root.__acts, handlers); return; }
    root.__acts = Object.assign({}, handlers);
    root.addEventListener('click', (ev) => {
      const el = ev.target.closest('[data-act]');
      if (!el || !root.contains(el)) return;
      const fn = root.__acts[el.dataset.act];
      if (fn) { ev.preventDefault(); fn(el, ev); }
    });
  };

  ui.vibrate = (ms) => {
    try {
      const s = OGR.store;
      if (s && s.cfg && s.cfg.vibrate && navigator.vibrate) navigator.vibrate(ms || 12);
    } catch (e) { /* yoksay */ }
  };

  /* ---------- Bildirim ---------- */
  let toastTimer = null;
  ui.toast = function (msg, o) {
    o = o || {};
    const host = ui.$('#toasts');
    if (!host) return;
    host.textContent = '';
    clearTimeout(toastTimer);
    const el = document.createElement('div');
    el.className = 'toast' + (o.kind ? ' ' + o.kind : '');
    el.setAttribute('role', o.kind === 'error' ? 'alert' : 'status');
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = msg;
    el.appendChild(t);
    if (o.action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = o.action.label;
      b.addEventListener('click', () => { host.textContent = ''; clearTimeout(toastTimer); o.action.fn(); });
      el.appendChild(b);
    }
    host.appendChild(el);
    toastTimer = setTimeout(() => { if (el.parentNode) el.remove(); }, o.ms || (o.action ? 6000 : 3200));
  };

  /* ---------- Pencere ---------- */
  const stack = [];
  let lastFocus = null;
  ui.modal = function (o) {
    const layer = ui.$('#layer');
    const id = 'dlg' + Math.random().toString(36).slice(2, 7);
    const ov = document.createElement('div');
    ov.className = 'overlay' + (o.sheet === false ? '' : ' sheet');
    ov.innerHTML = String(h`<div class="dialog ${o.size || ''}" role="dialog" aria-modal="true" aria-labelledby="${id}">
      <div class="dialog-h"><h2 id="${id}">${o.title}</h2><button type="button" class="icon-btn" data-close aria-label="Kapat">${ui.icon('x')}</button></div>
      <div class="dialog-b">${o.body || ''}</div>
      ${o.footer ? h`<div class="dialog-f">${o.footer}</div>` : ''}
    </div>`);
    if (!stack.length) lastFocus = document.activeElement;
    layer.appendChild(ov);
    document.body.classList.add('modal-open');
    const api = {
      el: ov,
      body: ui.$('.dialog-b', ov),
      close(result) {
        const i = stack.indexOf(api);
        if (i < 0) return;
        stack.splice(i, 1);
        ov.remove();
        if (!stack.length) {
          document.body.classList.remove('modal-open');
          try { lastFocus && lastFocus.focus && lastFocus.focus(); } catch (e) { /* yoksay */ }
        }
        if (o.onClose) o.onClose(result);
      },
      $: (sel) => ui.$(sel, ov),
      $$: (sel) => ui.$$(sel, ov),
      setBody(html) { api.body.innerHTML = String(html); },
      error(msg) { const e = ui.$('[data-error]', ov); if (e) e.textContent = msg || ''; },
    };
    stack.push(api);
    ov.addEventListener('mousedown', (ev) => { if (ev.target === ov && !o.persistent) api.close(); });
    ov.addEventListener('click', (ev) => { if (ev.target.closest('[data-close]')) api.close(); });
    ov.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && !o.persistent) { ev.stopPropagation(); api.close(); }
      if (ev.key === 'Tab') {
        const f = ui.$$('button:not([disabled]),input:not([disabled]),select,textarea,a[href],[tabindex]:not([tabindex="-1"])', ov).filter((x) => x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
        else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
      }
    });
    if (o.onMount) o.onMount(api);
    if (o.autofocus !== false) {
      const f = ui.$('[data-autofocus]', ov) || ui.$('input:not([type=hidden]):not([type=checkbox]),textarea,select', ov);
      if (f && !(matchMedia('(pointer:coarse)').matches && f.type === 'file')) setTimeout(() => { const a = document.activeElement; if (!a || a === document.body || !ov.contains(a)) f.focus(); }, 30);
    }
    return api;
  };
  ui.closeAllModals = () => stack.slice().forEach((m) => m.close());
  ui.hasModal = () => stack.length > 0;

  ui.confirm = function (o) {
    return new Promise((resolve) => {
      let done = false;
      const m = ui.modal({
        title: o.title,
        size: '',
        body: h`<p>${o.text}</p>${o.extra ? raw(o.extra) : ''}`,
        footer: h`<button type="button" class="btn" data-close>${o.cancel || 'Vazgeç'}</button><button type="button" class="btn ${o.danger ? 'btn-danger' : 'btn-primary'}" data-ok>${o.ok || 'Tamam'}</button>`,
        onClose: () => { if (!done) resolve(false); },
        onMount: (api) => {
          api.$('[data-ok]').addEventListener('click', () => { done = true; api.close(); resolve(true); });
        },
      });
      return m;
    });
  };

  // Tek alanlı soru
  ui.prompt = function (o) {
    return new Promise((resolve) => {
      let done = false;
      ui.modal({
        title: o.title,
        body: h`<form data-f class="stack"><div class="field"><label for="pr_i">${o.label}</label><input id="pr_i" class="input" name="v" value="${o.value || ''}" maxlength="${o.max || 80}" ${o.type ? raw(`type="${o.type}"`) : ''} autocomplete="off" required></div>${o.help ? h`<p class="field-help">${o.help}</p>` : ''}<p class="form-error" data-error role="alert"></p></form>`,
        footer: h`<button type="button" class="btn" data-close>Vazgeç</button><button type="button" class="btn btn-primary" data-ok>${o.ok || 'Kaydet'}</button>`,
        onClose: () => { if (!done) resolve(null); },
        onMount: (api) => {
          const go = () => {
            const v = api.$('[name=v]').value.trim();
            if (!v) { api.error('Boş bırakılamaz.'); return; }
            done = true;
            api.close();
            resolve(v);
          };
          api.$('[data-ok]').addEventListener('click', go);
          api.$('form').addEventListener('submit', (e) => { e.preventDefault(); go(); });
        },
      });
    });
  };

  /* ---------- Menü ---------- */
  let openMenu = null;
  ui.closeMenu = function () {
    if (openMenu) { openMenu.el.remove(); openMenu.scrim.remove(); document.removeEventListener('keydown', openMenu.key, true); openMenu = null; }
  };
  // items: [{label, icon, act:fn, danger, disabled, tick, header, sep}]
  ui.menu = function (anchor, items) {
    ui.closeMenu();
    const scrim = document.createElement('div');
    const el = document.createElement('div');
    const narrow = matchMedia('(max-width: 699px)').matches;
    scrim.className = 'menu-scrim' + (narrow ? ' as-sheet' : '');
    el.className = 'menu' + (narrow ? ' as-sheet' : '');
    el.setAttribute('role', 'menu');
    el.innerHTML = items
      .map((it, i) => {
        if (it.sep) return '<div class="menu-sep" role="separator"></div>';
        if (it.header) return `<div class="menu-h">${U.esc(it.header)}</div>`;
        return `<button type="button" role="menuitem" class="menu-i${it.danger ? ' danger' : ''}" data-i="${i}"${it.disabled ? ' disabled' : ''}>${it.icon ? String(ui.icon(it.icon)) : ''}<span>${U.esc(it.label)}</span>${it.tick ? String(ui.icon('check', 'tick')) : ''}</button>`;
      })
      .join('');
    document.body.appendChild(scrim);
    document.body.appendChild(el);
    if (!narrow) {
      const r = anchor.getBoundingClientRect();
      const w = el.offsetWidth, hgt = el.offsetHeight;
      let left = Math.min(Math.max(12, r.right - w), innerWidth - w - 12);
      let top = r.bottom + 6;
      if (top + hgt > innerHeight - 12) top = Math.max(12, r.top - hgt - 6);
      el.style.left = left + 'px';
      el.style.top = top + 'px';
    }
    const close = () => ui.closeMenu();
    scrim.addEventListener('mousedown', close);
    scrim.addEventListener('touchstart', close, { passive: true });
    el.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-i]');
      if (!b) return;
      const it = items[+b.dataset.i];
      close();
      if (it && it.act) setTimeout(it.act, 0);
    });
    const key = (ev) => {
      if (ev.key === 'Escape') { ev.stopPropagation(); close(); try { anchor.focus(); } catch (e) { /* */ } }
      else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const b = ui.$$('.menu-i:not([disabled])', el);
        const i = b.indexOf(document.activeElement);
        b[(i + (ev.key === 'ArrowDown' ? 1 : -1) + b.length) % b.length].focus();
      }
    };
    document.addEventListener('keydown', key, true);
    openMenu = { el, scrim, key };
    const f = ui.$('.menu-i:not([disabled])', el);
    if (f && !narrow) f.focus();
  };

  /* ---------- Form yardımcıları ---------- */
  ui.formData = (form) => {
    const o = {};
    new FormData(form).forEach((v, k) => { o[k] = typeof v === 'string' ? v : ''; });
    ui.$$('input[type=checkbox]', form).forEach((c) => { o[c.name] = c.checked; });
    return o;
  };
  ui.field = (o) => h`<div class="field"><label for="${o.id}">${o.label}</label><input id="${o.id}" class="input" name="${o.name || o.id}" type="${o.type || 'text'}" value="${o.value == null ? '' : o.value}" ${o.max ? raw(`maxlength="${o.max}"`) : ''} ${o.ph ? raw(`placeholder="${U.esc(o.ph)}"`) : ''} ${o.ac ? raw(`autocomplete="${o.ac}"`) : ''} ${o.inputmode ? raw(`inputmode="${o.inputmode}"`) : ''} ${o.required ? 'required' : ''} ${o.af ? 'data-autofocus' : ''}>${o.help ? h`<span class="field-help">${o.help}</span>` : ''}</div>`;
  ui.busy = async function (btn, fn) {
    if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
    try { return await fn(); } finally { if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); } }
  };

  /* ---------- Sınıf rengi / etiketler ---------- */
  ui.coverVar = (c) => `--cc:var(--cover-${(c && c.color) | 0})`;
  ui.avatarBg = (n) => `var(--cover-${(n | 0) % 8})`;
  ui.signed = (n, d) => U.fmtSigned(n, d == null ? 1 : d);
  ui.tone = (n) => (n > 0 ? 't-plus' : n < 0 ? 't-minus' : '');

  OGR.ui = ui;
})();

/* E+ · Grafikler (SVG dizgesi). Ekranda CSS değişkenleri, dışa aktarmada gömülü açık tema renkleri kullanılır. */
(function () {
  'use strict';
  const G = typeof globalThis !== 'undefined' ? globalThis : window;
  const OGR = (G.OGR = G.OGR || {});
  const U = OGR.util;
  const esc = U.esc;
  const C = {};

  const LIGHT_CSS =
    '.ch-grid{stroke:#e3e8f0;stroke-width:1}.ch-axis{stroke:#c5cedd;stroke-width:1}' +
    '.ch-text{fill:#46546a;font-size:11.5px;font-family:Figtree,Arial,sans-serif}.ch-muted{fill:#6b788d;font-size:11px;font-family:Figtree,Arial,sans-serif}' +
    '.ch-plus{fill:#0a9b7a}.ch-minus{fill:#e0533d}.ch-net-line{fill:none;stroke:#2a78d6;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}' +
    '.ch-net-dot{fill:#2a78d6;stroke:#fff;stroke-width:2}.ch-label-strong{fill:#0f1b2d;font-weight:700;font-size:12px;font-family:Figtree,Arial,sans-serif}.ch-hit,.ch-cross{display:none}';

  function niceMax(v) {
    if (v <= 4) return 4;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * p) return m * p;
    return 10 * p;
  }
  const fmt = (n) => U.fmtNum(n, 1).replace('-', '−');
  const rr = (x, y, w, h, r, top) => {
    // yalnız veri ucu yuvarlak (top=true → üst uç, false → alt uç)
    r = Math.min(r, w / 2, h);
    if (h <= 0) return '';
    if (top) return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
    return `M${x},${y}V${y + h - r}Q${x},${y + h} ${x + r},${y + h}H${x + w - r}Q${x + w},${y + h} ${x + w},${y + h - r}V${y}Z`;
  };

  /* ---------- Sütun: üstte artı, altta eksi, net çizgisi ---------- */
  function columns(spec, o) {
    const b = spec.buckets || [];
    const W = o.width || 640, H = o.height || 230;
    const m = { l: 34, r: 10, t: 12, b: 28 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const maxP = Math.max(0, ...b.map((x) => x.plus));
    const maxM = Math.max(0, ...b.map((x) => x.minus));
    const pTop = niceMax(Math.max(maxP, 1));
    const mTop = maxM ? niceMax(maxM) : 0;
    const span = pTop + mTop;
    const y = (v) => m.t + (ih * (pTop - v)) / span;
    const y0 = y(0);
    const n = Math.max(1, b.length);
    const step = iw / n;
    const bw = Math.max(3, Math.min(24, step * 0.62));
    let g = '';
    // ızgara
    const ticks = [];
    const tp = pTop / 2;
    for (let v = 0; v <= pTop; v += tp) ticks.push(v);
    if (mTop) for (let v = -mTop / 2; v >= -mTop; v -= mTop / 2) ticks.push(v);
    for (const v of ticks) {
      g += `<line class="${v === 0 ? 'ch-axis' : 'ch-grid'}" x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`;
      g += `<text class="ch-muted" x="${m.l - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmt(Math.abs(v))}${v > 0 ? '' : ''}</text>`;
    }
    const every = Math.ceil(n / Math.floor(iw / 44));
    const pts = [];
    b.forEach((x, i) => {
      const cx = m.l + step * i + step / 2;
      const bx = cx - bw / 2;
      if (x.plus > 0) g += `<path class="ch-bar ch-plus" d="${rr(bx, y(x.plus), bw, y0 - y(x.plus) - 1, 4, true)}"/>`;
      if (x.minus > 0) g += `<path class="ch-bar ch-minus" d="${rr(bx, y0 + 1, bw, y(-x.minus) - y0 - 1, 4, false)}"/>`;
      if (i % every === 0 || i === n - 1 && every === 1) g += `<text class="ch-muted" x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(x.label)}</text>`;
      pts.push([cx, y(Math.max(-mTop, Math.min(pTop, x.net)))]);
    });
    if (b.length > 1 && b.some((x) => x.plus || x.minus)) {
      g += `<polyline class="ch-net-line" points="${pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`;
      if (b.length <= 20) g += pts.map((p) => `<circle class="ch-net-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/>`).join('');
    }
    if (!b.some((x) => x.plus || x.minus)) g += `<text class="ch-muted" x="${W / 2}" y="${m.t + ih / 2}" text-anchor="middle">Bu aralıkta kayıt yok</text>`;
    if (!o.static) {
      b.forEach((x, i) => {
        g += `<rect class="ch-hit" data-i="${i}" x="${(m.l + step * i).toFixed(1)}" y="${m.t}" width="${step.toFixed(1)}" height="${ih}"/>`;
      });
    }
    return g ? { svg: g, W, H } : null;
  }

  /* ---------- Sapmalı yatay çubuk: sıralama ---------- */
  function diverge(spec, o) {
    const rows = spec.rows || [];
    const W = o.width || 640;
    const rowH = 26;
    const m = { l: 150, r: 44, t: 8, b: 22 };
    const H = m.t + m.b + rows.length * rowH;
    const iw = W - m.l - m.r;
    const maxP = Math.max(1, ...rows.map((r) => r.plus));
    const maxM = Math.max(0, ...rows.map((r) => r.minus));
    const span = maxP + maxM;
    const x = (v) => m.l + (iw * (maxM + v)) / span;
    const x0 = x(0);
    let g = `<line class="ch-axis" x1="${x0.toFixed(1)}" x2="${x0.toFixed(1)}" y1="${m.t}" y2="${H - m.b}"/>`;
    rows.forEach((r, i) => {
      const yy = m.t + i * rowH;
      const bh = 14, by = yy + (rowH - bh) / 2;
      const name = r.label.length > 22 ? r.label.slice(0, 21) + '…' : r.label;
      g += `<text class="ch-text" x="${m.l - 8}" y="${(yy + rowH / 2 + 4).toFixed(1)}" text-anchor="end">${esc(name)}</text>`;
      if (r.plus) g += `<rect class="ch-bar ch-plus" x="${(x0 + 1).toFixed(1)}" y="${by}" width="${Math.max(2, x(r.plus) - x0 - 1).toFixed(1)}" height="${bh}" rx="3"/>`;
      if (r.minus) g += `<rect class="ch-bar ch-minus" x="${x(-r.minus).toFixed(1)}" y="${by}" width="${Math.max(2, x0 - x(-r.minus) - 1).toFixed(1)}" height="${bh}" rx="3"/>`;
      g += `<text class="ch-label-strong" x="${W - m.r + 6}" y="${(yy + rowH / 2 + 4).toFixed(1)}">${esc(fmt(r.net))}</text>`;
    });
    g += `<text class="ch-muted" x="${x0.toFixed(1)}" y="${H - 6}" text-anchor="middle">0</text>`;
    return { svg: g, W, H };
  }

  // spec: {type:'columns'|'diverge', ...}; o: {standalone, width, height, static, label}
  C.svg = function (spec, o) {
    o = o || {};
    const r = spec.type === 'diverge' ? diverge(spec, o) : columns(spec, o);
    if (!r) return '';
    const style = o.standalone ? `<style>${LIGHT_CSS}</style>` : '';
    const bg = o.standalone ? `<rect width="${r.W}" height="${r.H}" fill="#ffffff"/>` : '';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${r.W} ${r.H}" width="${r.W}" height="${r.H}" role="img" aria-label="${esc(o.label || 'Grafik')}">${style}${bg}${r.svg}</svg>`;
  };
  C.size = (spec, o) => {
    if (spec.type === 'diverge') return { W: (o && o.width) || 640, H: 30 + (spec.rows || []).length * 26 };
    return { W: (o && o.width) || 640, H: (o && o.height) || 230 };
  };

  /* ---------- Tablo ikizi (erişilebilir alternatif) ---------- */
  C.table = function (spec) {
    if (spec.type === 'diverge') {
      return `<table class="rt"><thead><tr><th>Öğrenci</th><th class="r">+</th><th class="r">−</th><th class="r">Net</th></tr></thead><tbody>${spec.rows.map((r) => `<tr><td>${esc(r.label)}</td><td class="r t-plus">${r.plus}</td><td class="r t-minus">${r.minus}</td><td class="r"><b>${esc(fmt(r.net))}</b></td></tr>`).join('')}</tbody></table>`;
    }
    return `<table class="rt"><thead><tr><th>Aralık</th><th class="r">+</th><th class="r">−</th><th class="r">Net</th></tr></thead><tbody>${spec.buckets.map((b) => `<tr><td>${esc(b.title || b.label)}</td><td class="r t-plus">${b.plus}</td><td class="r t-minus">${b.minus}</td><td class="r"><b>${esc(fmt(b.net))}</b></td></tr>`).join('')}</tbody></table>`;
  };

  /* ---------- Ekranda kart: başlık + grafik + gösterge + tablo anahtarı ---------- */
  C._specs = {};
  C.card = function (title, spec, sub) {
    const id = 'ch' + Math.random().toString(36).slice(2, 7);
    C._specs[id] = spec;
    const legend = spec.type === 'diverge'
      ? '<span><i style="background:var(--chart-plus)"></i>Artı</span><span><i style="background:var(--chart-minus)"></i>Eksi</span>'
      : '<span><i style="background:var(--chart-plus)"></i>Artı</span><span><i style="background:var(--chart-minus)"></i>Eksi</span><span><i class="line" style="background:var(--chart-net)"></i>Net</span>';
    return `<figure class="chart" id="${id}" data-spec-id="${id}"><div class="chart-h"><h3>${esc(title)}</h3><button type="button" class="btn btn-ghost btn-sm" data-chart-toggle aria-pressed="false">Tablo olarak gör</button></div>${sub ? `<p class="faint" style="font-size:13px;margin-bottom:6px">${esc(sub)}</p>` : ''}<div class="chart-host" tabindex="0">${C.svg(spec, { label: title })}</div><div class="legend">${legend}</div><div class="chart-table"><div class="tablewrap">${C.table(spec)}</div></div></figure>`;
  };

  // Kart etkileşimleri: ipucu kutusu ve tablo anahtarı. specs: {id → spec}
  C.wire = function (root, specs) {
    let tip = document.querySelector('.chart-tip');
    if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; tip.setAttribute('aria-hidden', 'true'); document.body.appendChild(tip); }
    root.querySelectorAll('.chart').forEach((fig) => {
      const spec = (specs || C._specs)[fig.dataset.specId];
      const host = fig.querySelector('.chart-host');
      const btn = fig.querySelector('[data-chart-toggle]');
      btn.addEventListener('click', () => {
        const on = fig.classList.toggle('show-table');
        btn.setAttribute('aria-pressed', String(on));
        btn.textContent = on ? 'Grafik olarak gör' : 'Tablo olarak gör';
      });
      if (!spec || spec.type === 'diverge') return;
      const show = (i, ev) => {
        const b = spec.buckets[i];
        if (!b) return;
        tip.textContent = '';
        const t = document.createElement('b');
        t.textContent = b.title || b.label;
        tip.appendChild(t);
        [['Artı', b.plus, 'var(--chart-plus)'], ['Eksi', b.minus, 'var(--chart-minus)'], ['Net', fmt(b.net), 'var(--chart-net)']].forEach(([l, v, c]) => {
          const r = document.createElement('div');
          r.className = 'tr';
          const s = document.createElement('span');
          const sw = document.createElement('i');
          sw.style.background = c;
          s.appendChild(sw);
          s.appendChild(document.createTextNode(l));
          const st = document.createElement('strong');
          st.textContent = String(v);
          r.appendChild(s);
          r.appendChild(st);
          tip.appendChild(r);
        });
        tip.classList.add('on');
        const w = tip.offsetWidth, hh = tip.offsetHeight;
        const x = ev.clientX, y = ev.clientY;
        tip.style.left = Math.min(Math.max(8, x - w / 2), innerWidth - w - 8) + 'px';
        tip.style.top = Math.max(8, y - hh - 14) + 'px';
      };
      const hide = () => tip.classList.remove('on');
      host.addEventListener('pointermove', (ev) => { const r = ev.target.closest('.ch-hit'); if (r) show(+r.dataset.i, ev); else hide(); });
      host.addEventListener('pointerleave', hide);
      host.addEventListener('pointerdown', (ev) => { const r = ev.target.closest('.ch-hit'); if (r) show(+r.dataset.i, ev); });
      document.addEventListener('pointerdown', (ev) => { if (!host.contains(ev.target)) hide(); }, { passive: true });
    });
  };

  OGR.charts = C;
})();

/* js/ui/export.js */
/* E+ · Dışa aktarma: PDF (tuval → JPEG sayfalar), Excel, CSV, yazdırma, dosya kaydetme. */
(function () {
  'use strict';
  const G = window;
  const OGR = (G.OGR = G.OGR || {});
  const U = OGR.util;
  const E = {};

  /* ---------- Dosya kaydetme ---------- */
  // E.saver: ortam özel kaydedici (örn. gömülü önizleme) tarafından değiştirilebilir. (bytes, filename, mime) → Promise
  E.saver = null;
  E.save = async function (data, filename, mime) {
    const bytes = data instanceof Uint8Array ? data : typeof data === 'string' ? new TextEncoder().encode(data) : new Uint8Array(data);
    if (E.saver) return E.saver(bytes, filename, mime);
    const blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  };
  const MIME = {
    xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    csv: 'text/csv;charset=utf-8',
    pdf: 'application/pdf',
    json: 'application/json',
    zip: 'application/zip',
  };
  E.MIME = MIME;

  /* ---------- Excel / CSV ---------- */
  E.xlsx = async function (doc) {
    const sheets = OGR.docs.toSheets(doc);
    const bytes = await OGR.xlsx.write({ sheets, title: doc.title, creator: 'E+' });
    await E.save(bytes, doc.filename + '.xlsx', MIME.xlsx);
  };
  E.csv = async function (doc, sheetName) {
    const rows = OGR.docs.toCsvRows(doc, sheetName);
    const text = OGR.csv.stringify(rows.map((r) => r.map((c) => (c instanceof Date ? U.fmtDateTime(c.getTime()) : c))), { delimiter: ';', bom: true, eol: '\r\n', decimal: ',' });
    await E.save(text, doc.filename + '.csv', MIME.csv);
  };

  /* ---------- PDF ---------- */
  const PT = { w: 595.28, h: 841.89 };
  const SC = 2.2;
  const INK = '#0f1b2d', MUTED = '#5f6c82', LINE = '#d5dcea', PLUS = '#067a60', MINUS = '#b3321f', HEAD = '#1f2a44';
  const FONT = 'Figtree, "Segoe UI", Arial, Helvetica, sans-serif';

  function cellInfo(c) {
    if (c instanceof Date) return { text: U.fmtDateTime(c.getTime()), tone: '' };
    if (c && typeof c === 'object') {
      let t = c.v;
      if (typeof t === 'number') t = c.signed ? U.fmtSigned(t, c.dec ? 1 : 0) : U.fmtNum(t, c.dec ? 1 : 0);
      return { text: String(t == null ? '' : t), tone: c.tone || '', bold: !!c.bold };
    }
    return { text: typeof c === 'number' ? U.fmtNum(c, 1) : String(c == null ? '' : c), tone: '' };
  }
  const toneColor = (t) => (t === 'plus' ? PLUS : t === 'minus' ? MINUS : t === 'muted' ? MUTED : INK);

  function loadSvg(svg) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));

      img.onload = () => { URL.revokeObjectURL(url); res(img); };

  E.renderPages = async function (doc, kind) {

    const ensure = (h) => { if (y + h > ph - M.b) newPage(); };
    const fit = (txt, w) => {
      if (cx.measureText(txt).width <= w) return txt;
      let s = txt;

      return s + '…';
    };

      const words = String(txt).split(/\s+/);
      const lines = [];
      let cur = '';
      for (const wd of words) {
        const t = cur ? cur + ' ' + wd : wd;

      }

    // Başlık bloğu
    font(20, 800); cx.fillStyle = INK; cx.fillText(doc.title, M.l, y + 16); y += 26;
    font(12.5, 600); cx.fillStyle = '#2b3850';
    for (const l of wrap(doc.subtitle, cw)) { cx.fillText(l, M.l, y + 12); y += 16; }
    font(9, 400); cx.fillStyle = MUTED;
    y += 2;
    for (const m of doc.meta) { cx.fillText(m, M.l, y + 9); y += 12; }
    y += 4;
    cx.strokeStyle = LINE; cx.lineWidth = 0.8; cx.beginPath(); cx.moveTo(M.l, y); cx.lineTo(pw - M.r, y); cx.stroke();

    for (const b of doc.blocks) {
      if (b.only && !b.only.includes(kind || 'pdf')) continue;
      if (b.t === 'heading') {
        prevH = b.text;
        ensure(40);
        y += 6;
        font(13, 800); cx.fillStyle = INK; cx.fillText(b.text, M.l, y + 12);
        y += 20;
      } else if (b.t === 'kpis') {
        ensure(52);
        const n = b.items.length, gap = 8, w = (cw - gap * (n - 1)) / n;
        b.items.forEach((k, i) => {
          const x = M.l + i * (w + gap);
          cx.strokeStyle = LINE; cx.lineWidth = 0.8;
          cx.beginPath(); cx.roundRect(x, y, w, 44, 6); cx.stroke();
          font(8, 700); cx.fillStyle = MUTED; cx.fillText(String(k.label).toLocaleUpperCase('tr-TR'), x + 8, y + 14);
          font(18, 800); cx.fillStyle = toneColor(k.tone); cx.fillText(String(k.value), x + 8, y + 35);
        });
        y += 56;
      } else if (b.t === 'chart') {
        const sz = OGR.charts.size(b.spec, { width: 640 });
        const w = cw, h = (w * sz.H) / sz.W;
        ensure(Math.min(h, ph - M.t - M.b) + 6);

          cx.fillStyle = HEAD; cx.fillRect(M.l, y, cw, 17);
          font(8.5, 700); cx.fillStyle = '#fff';
          let x = M.l;
          b.cols.forEach((c, i) => {

          r.forEach((c, i) => {

            font(9.5, info.bold || info.tone === 'plus' || info.tone === 'minus' ? 700 : 400);
            cx.fillStyle = toneColor(info.tone);

  E.pdf = async function (doc) {

    await E.save(bytes, doc.filename + '.pdf', MIME.pdf);
  };

  /* ---------- Yazdırma ---------- */
  E.printHtml = function (doc) {

    const cls = (t) => (t === 'plus' ? ' class="tplus"' : t === 'minus' ? ' class="tminus"' : t === 'muted' ? ' class="tmuted"' : '');

      else if (b.t === 'kpis') out += `<div class="pkpis">${b.items.map((k) => `<div class="pkpi"><small>${esc(k.label)}</small><b${cls(k.tone)}>${esc(k.value)}</b></div>`).join('')}</div>`;

            const k = cellInfo(c);
            const al = b.cols[i].align;
            return `<td class="${al === 'right' ? 'r' : al === 'center' ? 'c' : ''} ${k.tone ? 't' + k.tone : ''}">${esc(k.text)}</td>`;
          }).join('') + '</tr>';
        }
        out += '</tbody></table>';
      }
    }
    return out + '</div>';
  };
  E.print = function (doc) {
    const root = document.getElementById('printRoot');
    root.innerHTML = E.printHtml(doc);
    let st = document.getElementById('pageOrient');
    if (!st) { st = document.createElement('style'); st.id = 'pageOrient'; document.head.appendChild(st); }
    st.textContent = `@page{size:A4 ${doc.landscape ? 'landscape' : 'portrait'};margin:12mm}`;
    const done = () => { root.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 60);
  };
  // Yazdırma bu ortamda desteklenmiyorsa (gömülü önizleme) PDF'e yönlendirilir
  E.canPrint = true;
  E.printOrPdf = function (doc) {
    if (E.canPrint) return E.print(doc);
    return E.pdf(doc);
  };

  OGR.export = E;
})();

/* js/ui/speech.js */
/* E+ · Sözlü not: konuşmayı metne çevirir (tarayıcı konuşma tanıma ya da önizleme ortamının dikte özelliği). */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const sp = { kind: null, _d: null, _rec: null, active: false };
  OGR.speech = sp;

  // Önceden çağrılır (dikte başlatma tıklamadan önce hiçbir şey beklememeli)
  sp.init = async function () {
    if (sp.kind !== null) return sp.kind;
    try {
      const d = window.claude && (await window.claude.use('dictation'));
      if (d) { sp._d = d; return (sp.kind = 'cap'); }
    } catch (e) { /* yoksay */ }
    sp.kind = Rec ? 'web' : '';
    return sp.kind;
  };
  sp.supported = () => !!sp.kind;

  // h: {partial(text), final(text), state('listening'|'idle'), error(msg)}
  sp.start = function (h) {
    if (sp.active) return;
    sp.active = true;
    const done = (why) => { if (!sp.active) return; sp.active = false; h.state('idle'); if (why) h.error(why); };
    if (sp.kind === 'cap') {
      const d = sp._d;
      const offs = [d.onPartial((e) => h.partial(e.text)), d.onFinal((e) => h.final(e.text)), d.onState((e) => { if (e.state === 'idle') { offs.forEach((f) => f && f()); done(null); } else h.state('listening'); })];
      d.start({ lang: 'tr-TR' }).catch((e) => {
        offs.forEach((f) => f && f());
        done(e && e.code === 'not_granted' ? 'Mikrofon izni verilmedi.' : e && e.code === 'declined' ? null : 'Sesli giriş başlatılamadı.');
      });
      h.state('listening');
      return;
    }
    const r = new Rec();
    sp._rec = r;
    r.lang = 'tr-TR';
    r.continuous = true;
    r.interimResults = true;
    r.onresult = (ev) => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) h.final(t.trim()); else interim += t;
      }
      h.partial(interim);
    };
    r.onerror = (ev) => done(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? 'Mikrofon izni verilmedi.' : ev.error === 'no-speech' || ev.error === 'aborted' ? null : 'Sesli giriş çalışmadı (' + ev.error + ').');
    r.onend = () => done(null);
    try { r.start(); h.state('listening'); } catch (e) { done('Sesli giriş başlatılamadı.'); }
  };
  sp.stop = async function () {
    if (!sp.active) return;
    try { if (sp.kind === 'cap') await sp._d.stop(); else if (sp._rec) sp._rec.stop(); } catch (e) { /* yoksay */ }
  };
})();

/* js/ui/ocr.js */
/* E+ · Kağıt liste fotoğrafından öğrenci listesi okuma.
   Sağlayıcılar (sırayla): Claude görsel okuma (yalnızca Claude içinde yayınlanan sürümde) → tarayıcı TextDetector (varsa).
   Çevrimdışı/kendi barındırılan sürümde bunlardan biri yoksa "desteklenmiyor" döner; elle/Excel aktarımı kullanılır. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const O = {};
  let sample = null, probed = false;

  async function probe() {
    if (probed) return sample;
    probed = true;
    try {
      const c = window.claude && window.claude.use ? await window.claude.use('sample') : null;
      if (c) { const l = await c.limits().catch(() => null); if (l && l.images) sample = c; }
    } catch (e) { sample = null; }
    return sample;
  }
  // 'claude' | 'detector' | ''
  O.kind = async function () {
    if (await probe()) return 'claude';
    if ('TextDetector' in window) return 'detector';
    return '';
  };

  function shrink(file, max = 1800) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        const g = cv.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
        g.drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob((b) => (b ? res({ blob: b, canvas: cv }) : rej(new Error('Fotoğraf işlenemedi.'))), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bu dosya görüntü olarak açılamadı.')); };
      img.src = url;
    });
  }

  // Dönüş: satır dizisi [{no, first, last}]
  O.read = async function (file) {
    const kind = await O.kind();
    if (!kind) { const e = new Error('Bu sürümde fotoğraftan okuma kullanılamıyor.'); e.code = 'unsupported'; throw e; }
    const { blob, canvas } = await shrink(file);
    if (kind === 'claude') {
      const prompt = 'Ekteki fotoğraf, bir okul sınıfının kağıt öğrenci listesi (Türkçe). Listedeki her öğrenciyi oku. ' +
        'Yalnızca şu biçimde bir JSON dizisi döndür: [{"no":"okul numarası ya da boş","first":"ad (birden çok adı varsa hepsi)","last":"soyad"}]. ' +
        'Sıra numaralarını (1, 2, 3…) okul numarası sanma; yalnızca ayrı bir okul numarası sütunu varsa "no" doldur. ' +
        'Başlıkları, imzaları, tarihleri ve öğretmen adını atla. Okuyamadığın veya emin olmadığın yeri uydurma: o öğrenciyi atla. Başka metin yazma.';
      const out = await sample.json(prompt, { images: [blob], modelTier: 'default', cache: false });
      const arr = Array.isArray(out) ? out : out && Array.isArray(out.students) ? out.students : [];
      return arr.map((x) => ({ no: String((x && x.no) || '').trim(), first: String((x && x.first) || '').trim(), last: String((x && x.last) || '').trim() })).filter((x) => x.first || x.last);
    }
    const det = new window.TextDetector();
    const found = await det.detect(canvas);
    found.sort((a, b) => a.boundingBox.y - b.boundingBox.y || a.boundingBox.x - b.boundingBox.x);
    const rows = [];
    for (const f of found) {
      const t = String(f.rawValue || '').replace(/\s+/g, ' ').trim();
      const m = t.match(/^(\d{1,6})?[\s.\-)]*([^\d]+)$/);
      if (!m) continue;
      const words = m[2].trim().split(' ');
      if (words.length < 2) continue;
      rows.push({ no: m[1] || '', first: words.slice(0, -1).join(' '), last: words[words.length - 1] });
    }
    return rows;
  };
  OGR.ocr = O;
})();

  /* ---------- Puan verme ---------- */
  V.give = function (studentId, type, reasonId) {

    if (!s) return null;
    const ev = S.giveEvent(studentId, type, { reasonId });
    ui.vibrate(type === 'plus' ? 12 : [18, 40, 18]);
    if (S.cfg.sound) V.beep(type);
    const a = S.aggregate({ studentIds: [studentId], termId: 'current' }).get(studentId);
    ui.toast(`${S.fullName(s)}  ${type === 'plus' ? '+1' : '−1'}${ev.reason ? ' · ' + ev.reason : ''}  (Toplam ${U.fmtSigned(a.net, 0)})`, {
      kind: type,
      action: { label: 'Geri al', fn: () => { S.voidEvent(ev.id); ui.toast('Puan geri alındı'); } },
      ms: 4500,

  };
  let actx = null;
  V.beep = function (type) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.value = type === 'plus' ? 880 : 220;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.16);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.18);
    } catch (e) { /* ses yoksa sessiz */ }
  };
  // Neden seçerek puan ver

  V.pointFor = (studentId, type) => (S.cfg.askReason ? V.reasonSheet(studentId, type) : V.give(studentId, type, null));

    } catch (e) {
      if (OGR.debug) console.error(e);
      ui.toast('Dışa aktarma başarısız: ' + ((e && e.message) || e), { kind: 'error', ms: 6000 });

  V.exportMenu = function (anchor, getDoc, opts) {
    const items = [

      { label: 'CSV olarak indir', icon: 'download', act: () => V.runExport('csv', getDoc()) },
      { label: OGR.export.canPrint ? 'Yazdır' : 'Yazdırmak için PDF indir', icon: 'print', act: () => V.runExport('print', getDoc()) },
    ];
    if (opts && opts.extra) items.push({ sep: true }, ...opts.extra);
    ui.menu(anchor, items);

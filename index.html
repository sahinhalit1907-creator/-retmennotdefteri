  };
  store.close = async function () {
    if (store.uid) await store.flush();
    clearTimeout(store._autoTimer);
    store.uid = null;
    store.account = null;
    store._reset();
  };
  store._ensureDefaults = function () {
    const had = store.cfg;
    store.cfg = Object.assign({}, DEFAULT_CFG, had || {});
    store.cfg.classPrefs = store.cfg.classPrefs || {};
    let dirty = !had || Object.keys(DEFAULT_CFG).some((k) => !(k in (had || {})));
    if (!store.reasons.size) {
      PLUS_DEFAULT.forEach((label, i) => store._put('reasons', { id: 'p' + (i + 1), type: 'plus', label, order: i, builtin: true, hidden: false }));
      MINUS_DEFAULT.forEach((label, i) => store._put('reasons', { id: 'm' + (i + 1), type: 'minus', label, order: i, builtin: true, hidden: false }));
    }
    if (!store.terms.size) {
      const now = Date.now();
      store._put('terms', { id: U.uid(), name: U.suggestTermName(now), startedAt: now, endedAt: null });
    }
    if (!store.cfg.currentTermId || !store.terms.has(store.cfg.currentTermId)) {
      const open = Array.from(store.terms.values()).filter((t) => !t.endedAt).sort((a, b) => b.startedAt - a.startedAt)[0];
      const last = Array.from(store.terms.values()).sort((a, b) => b.startedAt - a.startedAt)[0];
      store.cfg.currentTermId = (open || last).id;
      dirty = true;
    }
    if (dirty) store._putCfg();
  };

  /* ---------- Dizinler ---------- */
  store.idx = function () {
    if (store._idx && store._idxRev === store.rev) return store._idx;
    const studentsByClass = new Map();
    for (const s of store.students.values()) {
      let a = studentsByClass.get(s.classId);
      if (!a) studentsByClass.set(s.classId, (a = []));
      a.push(s);
    }
    for (const a of studentsByClass.values()) a.sort((x, y) => U.cmp(x.last, y.last) || U.cmp(x.first, y.first) || U.cmp(x.no, y.no));
    const eventsByStudent = new Map();
    for (const e of store.events.values()) {
      let a = eventsByStudent.get(e.studentId);
      if (!a) eventsByStudent.set(e.studentId, (a = []));
      a.push(e);
    }
    for (const a of eventsByStudent.values()) a.sort((x, y) => x.ts - y.ts);
    const notesByStudent = new Map();
    for (const n of store.notes.values()) {
      let a = notesByStudent.get(n.studentId);
      if (!a) notesByStudent.set(n.studentId, (a = []));
      a.push(n);
    }
    for (const a of notesByStudent.values()) a.sort((x, y) => y.ts - x.ts);
    const by = (m) => {
      const out = new Map();
      for (const r of m.values()) {
        let a = out.get(r.studentId);
        if (!a) out.set(r.studentId, (a = []));
        a.push(r);
      }
      return out;
    };
    const gradesByStudent = by(store.grades);
    for (const a of gradesByStudent.values()) a.sort((x, y) => y.ts - x.ts);
    const absencesByStudent = by(store.absences);
    for (const a of absencesByStudent.values()) a.sort((x, y) => (x.day < y.day ? 1 : x.day > y.day ? -1 : 0));
    store._idx = { studentsByClass, eventsByStudent, notesByStudent, gradesByStudent, absencesByStudent };
    store._idxRev = store.rev;
    return store._idx;
  };
  // Sık yol: tek olay eklenince dizini baştan kurma
  store._idxFresh = () => store._idx && store._idxRev === store.rev;

  /* ---------- Okuma yardımcıları ---------- */
  store.sortedClasses = function () {
    return Array.from(store.classes.values()).sort((a, b) => a.grade - b.grade || U.cmp(a.section, b.section) || U.cmp(a.label, b.label));
  };
  store.className = (c) => (c.section ? `${c.grade}-${c.section}` : `${c.grade}. Sınıf`);
  store.classTitle = (c) => (c.section ? `${c.grade}-${c.section} Sınıfı` : `${c.grade}. Sınıf`);
  store.classFull = (c) => store.className(c) + (c.label ? ' · ' + c.label : '');
  store.fullName = (s) => `${s.first} ${s.last}`.trim();
  store.studentsOf = (classId) => store.idx().studentsByClass.get(classId) || [];
  store.eventsOf = (studentId) => store.idx().eventsByStudent.get(studentId) || [];
  store.notesOf = (studentId) => store.idx().notesByStudent.get(studentId) || [];
  store.gradesOf = (studentId) => store.idx().gradesByStudent.get(studentId) || [];
  store.absencesOf = (studentId) => store.idx().absencesByStudent.get(studentId) || [];
  store.currentTerm = () => store.terms.get(store.cfg.currentTermId);
  store.sortedTerms = () => Array.from(store.terms.values()).sort((a, b) => b.startedAt - a.startedAt);
  store.sortedReasons = function (type, includeHidden) {
    return Array.from(store.reasons.values())
      .filter((r) => (!type || r.type === type) && (includeHidden || !r.hidden))
      .sort((a, b) => a.order - b.order || U.cmp(a.label, b.label));
  };
  store.counts = () => ({ classes: store.classes.size, students: store.students.size, events: store.events.size, notes: store.notes.size, grades: store.grades.size, absences: store.absences.size });
  store.classPref = (classId) => Object.assign({ sort: 'name', period: 'term', view: 'list' }, store.cfg.classPrefs[classId] || {});
  store.setClassPref = function (classId, patch) {
    store.cfg.classPrefs[classId] = Object.assign({}, store.cfg.classPrefs[classId] || {}, patch);
    store._putCfg();
  };
  store.setCfg = function (patch) {
    Object.assign(store.cfg, patch);
    store._putCfg();
    store._changed('cfg', { keys: Object.keys(patch) });
  };

  /* ---------- Toplamlar ---------- */
  function termFilter(t) {
    return t === undefined || t === 'current' ? store.cfg.currentTermId : t;
  }
  // opts: {studentIds | classId, termId: 'current'|'all'|id, from, to} → Map(sid → {plus, minus, net, last})
  store.aggregate = function (opts) {
    const ix = store.idx();
    const tid = termFilter(opts.termId);
    const ids = opts.studentIds || (ix.studentsByClass.get(opts.classId) || []).map((s) => s.id);
    const out = new Map();
    const from = opts.from == null ? -Infinity : opts.from;
    const to = opts.to == null ? Infinity : opts.to;
    for (const sid of ids) {
      let plus = 0, minus = 0, last = 0;
      const list = ix.eventsByStudent.get(sid);
      if (list) {
        for (let i = 0; i < list.length; i++) {
          const e = list[i];
          if (e.voided || e.ts < from || e.ts >= to) continue;
          if (tid !== 'all' && e.termId !== tid) continue;
          if (e.type === 'plus') plus++;
          else minus++;
          if (e.ts > last) last = e.ts;
        }
      }
      out.set(sid, { plus, minus, net: plus - minus, last });
    }
    return out;
  };
  store.classStats = function (classId, opts) {
    const students = store.studentsOf(classId);
    const agg = store.aggregate(Object.assign({}, opts, { studentIds: students.map((s) => s.id) }));
    let plus = 0, minus = 0;
    const rows = students.map((s) => {
      const a = agg.get(s.id);
      plus += a.plus;
      minus += a.minus;
      return { student: s, plus: a.plus, minus: a.minus, net: a.net, last: a.last };
    });
    const n = students.length;
    return { rows, totals: { plus, minus, net: plus - minus, students: n, avgNet: n ? (plus - minus) / n : 0, avgPlus: n ? plus / n : 0, avgMinus: n ? minus / n : 0 } };
  };

  /* ---------- Sınıflar ---------- */
  store._nextColor = function () {
    const used = new Array(CLASS_COLORS).fill(0);
    for (const c of store.classes.values()) used[c.color % CLASS_COLORS]++;
    let best = 0;
    for (let i = 1; i < CLASS_COLORS; i++) if (used[i] < used[best]) best = i;
    return best;
  };
  store._findClass = function (grade, section, label, exceptId) {
    const l = U.norm(label);
    for (const c of store.classes.values()) {
      if (c.id !== exceptId && c.grade === grade && c.section === section && U.norm(c.label) === l) return c;
    }
    return null;
  };
  store._cleanClass = function (o, exceptId) {
    const grade = parseInt(o.grade, 10);
    if (!(grade >= 1 && grade <= 12)) throw err('BAD_GRADE', 'Sınıf düzeyi 1 ile 12 arasında olmalı.');
    const section = clean(o.section, 3).toLocaleUpperCase('tr-TR');
    const label = clean(o.label, 40);
    if (store._findClass(grade, section, label, exceptId)) throw err('DUP_CLASS', `${store.className({ grade, section })}${label ? ' · ' + label : ''} sınıfı zaten var.`);
    return { grade, section, label };
  };
  store.addClass = function (o) {
    const base = store._cleanClass(o);
    const cls = Object.assign({ id: U.uid(), color: o.color == null ? store._nextColor() : U.clamp(o.color | 0, 0, CLASS_COLORS - 1), createdAt: Date.now() }, base);
    store._put('classes', cls);
    store._changed('classes', { id: cls.id, op: 'add' });
    return cls;
  };
  store.updateClass = function (id, o) {
    const c = store.classes.get(id);
    if (!c) throw err('NO_CLASS', 'Sınıf bulunamadı.');
    const base = store._cleanClass(Object.assign({}, c, o), id);
    Object.assign(c, base);
    if (o.color != null) c.color = U.clamp(o.color | 0, 0, CLASS_COLORS - 1);
    store._put('classes', c);
    store._changed('classes', { id, op: 'update' });
    return c;
  };
  function takeStudent(sid) {
    const s = store.students.get(sid);
    const ix = store.idx();
    const events = (ix.eventsByStudent.get(sid) || []).slice();
    const notes = (ix.notesByStudent.get(sid) || []).slice();
    const grades = (ix.gradesByStudent.get(sid) || []).slice();
    const absences = (ix.absencesByStudent.get(sid) || []).slice();
    return { student: s, events, notes, grades, absences };
  }
  function dropStudent(pack) {
    for (const e of pack.events) store._del('events', e.id);
    for (const n of pack.notes) store._del('notes', n.id);
    for (const g of pack.grades || []) store._del('grades', g.id);
    for (const a of pack.absences || []) store._del('absences', a.id);
    store._del('students', pack.student.id);
  }
  store.deleteClass = function (id) {
    const c = store.classes.get(id);
    if (!c) return null;
    const packs = store.studentsOf(id).map((s) => takeStudent(s.id));
    store.batch(() => {
      packs.forEach(dropStudent);
      store._del('classes', id);
      if (store.cfg.lastClassId === id) {
        store.cfg.lastClassId = null;
        store._putCfg();
      }
      delete store.cfg.classPrefs[id];
    });
    store._changed('classes', { id, op: 'delete' });
    return { kind: 'class', cls: c, packs };
  };

  /* ---------- Öğrenciler ---------- */
  store._cleanStudent = function (classId, o, exceptId, allowDupNo) {
    const first = clean(o.first, 60);
    const last = clean(o.last, 60);
    const no = clean(o.no, 20);
    if (!first && !last) throw err('NO_NAME', 'Öğrencinin adı ve soyadı gerekli.');
    if (no && !allowDupNo) {
      for (const s of store.studentsOf(classId)) {
        if (s.id !== exceptId && s.no && s.no === no) throw err('DUP_NO', `${no} numaralı öğrenci bu sınıfta zaten var (${store.fullName(s)}).`);
      }
    }
    return { first, last, no };
  };
  store.addStudent = function (classId, o, opts) {
    if (!store.classes.has(classId)) throw err('NO_CLASS', 'Sınıf bulunamadı.');
    const base = store._cleanStudent(classId, o, null, opts && opts.allowDupNo);
    const s = Object.assign({ id: U.uid(), classId, createdAt: Date.now() }, base);
    store._put('students', s);
    store._changed('students', { id: s.id, classId, op: 'add' });
    return s;
  };
  store.updateStudent = function (id, o) {
    const s = store.students.get(id);
    if (!s) throw err('NO_STUDENT', 'Öğrenci bulunamadı.');
    const base = store._cleanStudent(s.classId, Object.assign({}, s, o), id);
    Object.assign(s, base);
    store._put('students', s);
    store._changed('students', { id, classId: s.classId, op: 'update' });
    return s;
  };
  store.moveStudent = function (id, classId) {
    const s = store.students.get(id);
    if (!s || !store.classes.has(classId)) throw err('NO_CLASS', 'Sınıf bulunamadı.');
    if (s.classId === classId) return s;
    for (const o of store.studentsOf(classId)) {
      if (s.no && o.no === s.no) throw err('DUP_NO', `${s.no} numaralı öğrenci hedef sınıfta zaten var (${store.fullName(o)}).`);
    }
    const from = s.classId;
    s.classId = classId;
    store._put('students', s);
    store._changed('students', { id, classId, from, op: 'move' });
    return s;
  };
  store.deleteStudent = function (id) {
    if (!store.students.has(id)) return null;
    const pack = takeStudent(id);
    dropStudent(pack);
    store._changed('students', { id, classId: pack.student.classId, op: 'delete' });
    return { kind: 'student', packs: [pack] };
  };
  // Silinen sınıf/öğrenciyi geri getirir (snapshot: deleteClass/deleteStudent çıktısı)
  store.restoreSnapshot = function (snap) {
    if (!snap) return;
    store.batch(() => {
      if (snap.cls) store._put('classes', snap.cls);
      for (const p of snap.packs) {
        store._put('students', p.student);
        p.events.forEach((e) => store._put('events', e));
        p.notes.forEach((n) => store._put('notes', n));
        (p.grades || []).forEach((g) => store._put('grades', g));
        (p.absences || []).forEach((a) => store._put('absences', a));
      }
    });
    store._changed(snap.kind === 'class' ? 'classes' : 'students', { op: 'restore' });
  };
  // rows: [{first,last,no}] → {added, updated, skipped, errors:[{row,message}]}
  store.importStudents = function (classId, rows, opts) {
    const o = Object.assign({ onDuplicate: 'skip', fixCase: true }, opts || {});
    if (!store.classes.has(classId)) throw err('NO_CLASS', 'Sınıf bulunamadı.');
    const res = { added: 0, updated: 0, skipped: 0, errors: [] };
    // Dosya içindeki yinelenenleri de yakalamak için yerel arama tabloları (dizin toplu işlemde eskir)
    const byNo = new Map();
    const byName = new Map();
    const nameKey = (f, l) => U.norm(f) + '|' + U.norm(l);
    store.studentsOf(classId).forEach((s) => {
      if (s.no) byNo.set(s.no, s);
      if (!byName.has(nameKey(s.first, s.last))) byName.set(nameKey(s.first, s.last), s);
    });
    store.batch(() => {
      rows.forEach((r, i) => {
        let first = clean(r.first, 60);
        let last = clean(r.last, 60);
        const no = clean(r.no, 20);
        if (o.fixCase) {
          first = U.titleCaseTR(first);
          last = U.titleCaseTR(last);
        }
        if (!first && !last) {
          res.errors.push({ row: i, message: 'Ad ve soyad boş' });
          return;
        }
        const key = nameKey(first, last);
        const dup = (no ? byNo.get(no) : byName.get(key)) || null;
        if (dup) {
          if (o.onDuplicate === 'update') {
            dup.first = first || dup.first;
            dup.last = last || dup.last;
            store._put('students', dup);
            res.updated++;
          } else res.skipped++;
          return;
        }
        const s = { id: U.uid(), classId, first, last, no, createdAt: Date.now() };
        store._put('students', s);
        if (no) byNo.set(no, s);
        if (!byName.has(key)) byName.set(key, s);
        res.added++;
      });
    });
    store._changed('students', { classId, op: 'import' });
    return res;
  };

  /* ---------- Artı / eksi olayları ---------- */
  store.giveEvent = function (studentId, type, o) {
    const s = store.students.get(studentId);
    if (!s) throw err('NO_STUDENT', 'Öğrenci bulunamadı.');
    if (type !== 'plus' && type !== 'minus') throw err('BAD_TYPE', 'Geçersiz puan türü.');
    const reason = o && o.reasonId ? store.reasons.get(o.reasonId) : null;
    const ev = {
      id: U.uid(),
      studentId,
      termId: store.cfg.currentTermId,
      type,
      reasonId: reason ? reason.id : null,
      reason: reason ? reason.label : '',
      ts: (o && o.ts) || Date.now(),
      voided: false,
    };
    const fresh = store._idxFresh();
    store._put('events', ev);
    store.rev++;
    if (fresh) {
      const ix = store._idx;
      let a = ix.eventsByStudent.get(studentId);
      if (!a) ix.eventsByStudent.set(studentId, (a = []));
      a.push(ev);
      if (a.length > 1 && a[a.length - 2].ts > ev.ts) a.sort((x, y) => x.ts - y.ts);
      store._idxRev = store.rev;
    }
    store.session.undo.push(ev.id);
    if (store.session.undo.length > 200) store.session.undo.shift();
    store._emit({ kind: 'events', op: 'add', id: ev.id, studentId, classId: s.classId });
    return ev;
  };
  function touchEvent(ev, op) {
    const fresh = store._idxFresh();
    store._put('events', ev);
    store.rev++;
    if (fresh) store._idxRev = store.rev;
    const s = store.students.get(ev.studentId);
    store._emit({ kind: 'events', op, id: ev.id, studentId: ev.studentId, classId: s ? s.classId : null });
  }
  store.voidEvent = function (id) {
    const ev = store.events.get(id);
    if (!ev || ev.voided) return ev || null;
    ev.voided = true;
    ev.voidedAt = Date.now();
    touchEvent(ev, 'void');
    return ev;
  };
  store.restoreEvent = function (id) {
    const ev = store.events.get(id);
    if (!ev || !ev.voided) return ev || null;
    ev.voided = false;
    delete ev.voidedAt;
    touchEvent(ev, 'restore');
    return ev;
  };
  store.setEventReason = function (id, reasonId) {
    const ev = store.events.get(id);
    if (!ev) return null;
    const r = reasonId ? store.reasons.get(reasonId) : null;
    ev.reasonId = r ? r.id : null;
    ev.reason = r ? r.label : '';
    touchEvent(ev, 'reason');
    return ev;
  };
  store.canUndo = function () {
    return store.session.undo.some((id) => {
      const e = store.events.get(id);
      return e && !e.voided;
    });
  };
  store.lastUndoable = function () {
    for (let i = store.session.undo.length - 1; i >= 0; i--) {
      const e = store.events.get(store.session.undo[i]);
      if (e && !e.voided) return e;
    }
    return null;
  };
  store.undoLast = function () {
    const e = store.lastUndoable();
    return e ? store.voidEvent(e.id) : null;
  };
  // filtre: {classId, studentId, type, reasonLabel, from, to, termId, voided: 'no'|'only'|'all', q}
  store.queryEvents = function (f) {
    const ix = store.idx();
    const tid = termFilter(f.termId);
    const from = f.from == null ? -Infinity : f.from;
    const to = f.to == null ? Infinity : f.to;
    const q = f.q ? U.norm(f.q) : '';
    let students;
    if (f.studentId) students = [store.students.get(f.studentId)].filter(Boolean);
    else if (f.classId) students = ix.studentsByClass.get(f.classId) || [];
    else students = Array.from(store.students.values());
    const out = [];
    for (const s of students) {
      if (q && !U.norm(store.fullName(s) + ' ' + s.no).includes(q)) continue;
      const list = ix.eventsByStudent.get(s.id);
      if (!list) continue;
      for (const e of list) {
        if (e.ts < from || e.ts >= to) continue;
        if (tid !== 'all' && e.termId !== tid) continue;
        if (f.type && e.type !== f.type) continue;
        if (f.reasonLabel !== undefined && f.reasonLabel !== null && f.reasonLabel !== '' && (e.reason || '') !== (f.reasonLabel === '__none' ? '' : f.reasonLabel)) continue;
        const v = f.voided || 'no';
        if (v === 'no' && e.voided) continue;
        if (v === 'only' && !e.voided) continue;
        out.push(e);
      }
    }
    out.sort((a, b) => b.ts - a.ts);
    return out;
  };

  /* ---------- Notlar ---------- */
  store.addNote = function (studentId, text) {
    const t = String(text == null ? '' : text).trim().slice(0, 2000);
    if (!store.students.has(studentId)) throw err('NO_STUDENT', 'Öğrenci bulunamadı.');
    if (!t) throw err('EMPTY_NOTE', 'Not boş olamaz.');
    const now = Date.now();
    const n = { id: U.uid(), studentId, text: t, ts: now, uts: now };
    store._put('notes', n);
    store._changed('notes', { id: n.id, studentId, op: 'add' });
    return n;
  };
  store.updateNote = function (id, text) {
    const n = store.notes.get(id);
    const t = String(text == null ? '' : text).trim().slice(0, 2000);
    if (!n) throw err('NO_NOTE', 'Not bulunamadı.');
    if (!t) throw err('EMPTY_NOTE', 'Not boş olamaz.');
    n.text = t;
    n.uts = Date.now();
    store._put('notes', n);
    store._changed('notes', { id, studentId: n.studentId, op: 'update' });
    return n;
  };
  store.deleteNote = function (id) {
    const n = store.notes.get(id);
    if (!n) return null;
    store._del('notes', id);
    store._changed('notes', { id, studentId: n.studentId, op: 'delete' });
    return n;
  };
  store.restoreNote = function (n) {
    store._put('notes', n);
    store._changed('notes', { id: n.id, studentId: n.studentId, op: 'add' });
  };

  /* ---------- Davranış (sözlü) notu: 0-100 puan + sebep ---------- */
  const termForTs = (ts) => {
    for (const t of store.sortedTerms()) if (ts >= t.startedAt && (t.endedAt == null || ts < t.endedAt)) return t.id;
    return store.cfg.currentTermId;
  };
  const scoreOf = (x) => {
    if (x == null || (typeof x === 'string' && !x.trim())) throw err('BAD_SCORE', 'Puan 0 ile 100 arasında olmalı.');
    const sc = typeof x === 'string' ? parseFloat(x.replace(',', '.')) : Number(x);
    if (!Number.isFinite(sc) || sc < 0 || sc > 100) throw err('BAD_SCORE', 'Puan 0 ile 100 arasında olmalı.');
    return Math.round(sc * 10) / 10;
  };
  store.addGrade = function (studentId, o) {
    if (!store.students.has(studentId)) throw err('NO_STUDENT', 'Öğrenci bulunamadı.');
    const ts = o && Number.isFinite(o.ts) ? o.ts : Date.now();
    const g = { id: U.uid(), studentId, termId: termForTs(ts), score: scoreOf(o && o.score), reason: clean(o && o.reason, 200), ts };
    store._put('grades', g);
    store._changed('grades', { id: g.id, studentId, op: 'add' });
    return g;
  };
  store.updateGrade = function (id, o) {
    const g = store.grades.get(id);
    if (!g) throw err('NO_GRADE', 'Not bulunamadı.');
    if (o.score != null) g.score = scoreOf(o.score);
    if (o.reason != null) g.reason = clean(o.reason, 200);
    store._put('grades', g);
    store._changed('grades', { id, studentId: g.studentId, op: 'update' });
    return g;
  };
  store.deleteGrade = function (id) {
    const g = store.grades.get(id);
    if (!g) return null;
    store._del('grades', id);
    store._changed('grades', { id, studentId: g.studentId, op: 'delete' });
    return g;
  };
  store.restoreGrade = function (g) {
    store._put('grades', g);
    store._changed('grades', { id: g.id, studentId: g.studentId, op: 'add' });
  };
  // {count, avg, min, max, last}; termId: 'current' | 'all' | id ; from/to: ts aralığı (isteğe bağlı)
  store.gradeStats = function (studentId, o) {
    o = o || {};
    const tid = !o.termId || o.termId === 'current' ? store.cfg.currentTermId : o.termId;
    const list = store.gradesOf(studentId).filter((g) => (tid === 'all' || g.termId === tid) && (o.from == null || g.ts >= o.from) && (o.to == null || g.ts < o.to));
    if (!list.length) return { count: 0, avg: null, min: null, max: null, last: null };
    const sum = list.reduce((a, g) => a + g.score, 0);
    return { count: list.length, avg: Math.round((sum / list.length) * 10) / 10, min: Math.min(...list.map((g) => g.score)), max: Math.max(...list.map((g) => g.score)), last: list[0] };
  };

  /* ---------- Devamsızlık (gün bazında: özürsüz / özürlü / geç) ---------- */
  const absId = (studentId, day) => 'a_' + studentId + '_' + day.replace(/-/g, '');
  store.ABS_TYPES = ABS_TYPES;
  store.absenceOn = (studentId, day) => store.absences.get(absId(studentId, day)) || null;
  // type: 'unexcused' | 'excused' | 'late' | null (kaydı sil → "var")
  store.setAbsence = function (studentId, day, type, note) {
    if (!store.students.has(studentId)) throw err('NO_STUDENT', 'Öğrenci bulunamadı.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(day)) || !Number.isFinite(U.parseISODay(day)) || U.isoDay(U.parseISODay(day)) !== day) throw err('BAD_DAY', 'Geçerli bir tarih seçin.');
    const id = absId(studentId, day);
    if (!type) {
      const old = store.absences.get(id);
      if (!old) return null;
      store._del('absences', id);
      store._changed('absences', { id, studentId, day, op: 'delete' });
      return null;
    }
    if (!ABS_TYPES.includes(type)) throw err('BAD_TYPE', 'Geçersiz devamsızlık türü.');
    const prev = store.absences.get(id);
    const a = { id, studentId, termId: termForTs(U.parseISODay(day) + 12 * 3600e3), day, type, note: note != null ? clean(note, 200) : prev ? prev.note : '', ts: Date.now() };
    store._put('absences', a);
    store._changed('absences', { id, studentId, day, op: prev ? 'update' : 'add' });
    return a;
  };
  store.restoreAbsence = function (a) {
    store._put('absences', a);
    store._changed('absences', { id: a.id, studentId: a.studentId, day: a.day, op: 'add' });
  };
  // {unexcused, excused, late, days (özürsüz+özürlü)}
  store.absenceStats = function (studentId, o) {
    o = o || {};
    const tid = !o.termId || o.termId === 'current' ? store.cfg.currentTermId : o.termId;
    const r = { unexcused: 0, excused: 0, late: 0, days: 0 };
    for (const a of store.absencesOf(studentId)) {
      if (tid !== 'all' && a.termId !== tid) continue;
      if (o.fromDay && a.day < o.fromDay) continue;
      if (o.toDay && a.day > o.toDay) continue;
      r[a.type]++;
    }
    r.days = r.unexcused + r.excused;
    return r;
  };
  // Sınıfın bir günkü yoklaması: Map(studentId → kayıt)
  store.attendanceOn = function (classId, day) {
    const m = new Map();
    for (const s of store.studentsOf(classId)) {
      const a = store.absences.get(absId(s.id, day));
      if (a) m.set(s.id, a);
    }
    return m;
  };

  /* ---------- Nedenler ---------- */
  store.addReason = function (type, label) {
    const l = clean(label, 60);
    if (type !== 'plus' && type !== 'minus') throw err('BAD_TYPE', 'Geçersiz tür.');
    if (!l) throw err('EMPTY', 'Neden boş olamaz.');
    for (const r of store.reasons.values()) if (r.type === type && U.norm(r.label) === U.norm(l) && !r.hidden) throw err('DUP', 'Bu neden zaten var.');
    const order = store.sortedReasons(type, true).reduce((m, r) => Math.max(m, r.order), -1) + 1;
    const r = { id: U.uid(), type, label: l, order, builtin: false, hidden: false };
    store._put('reasons', r);
    store._changed('reasons', { id: r.id });
    return r;
  };
  store.updateReason = function (id, o) {
    const r = store.reasons.get(id);
    if (!r) throw err('NO_REASON', 'Neden bulunamadı.');
    if (o.label !== undefined) {
      const l = clean(o.label, 60);
      if (!l) throw err('EMPTY', 'Neden boş olamaz.');
      for (const x of store.reasons.values()) if (x.id !== id && x.type === r.type && !x.hidden && U.norm(x.label) === U.norm(l)) throw err('DUP', 'Bu neden zaten var.');
      r.label = l;
    }
    if (o.hidden !== undefined) r.hidden = !!o.hidden;
    store._put('reasons', r);
    store._changed('reasons', { id });
    return r;
  };
  store.moveReason = function (id, dir) {
    const r = store.reasons.get(id);
    if (!r) return;
    const list = store.sortedReasons(r.type, true);
    const i = list.findIndex((x) => x.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    list.splice(j, 0, list.splice(i, 1)[0]);
    list.forEach((x, k) => {
      if (x.order !== k) {
        x.order = k;
        store._put('reasons', x);
      }
    });
    store._changed('reasons', {});
  };
  store.deleteReason = function (id) {
    const r = store.reasons.get(id);
    if (!r) return;
    if (r.builtin) return store.updateReason(id, { hidden: true });
    store._del('reasons', id);
    store._changed('reasons', { id });
  };

  /* ---------- Dönemler ---------- */
  store.startTerm = function (name) {
    const now = Date.now();
    const cur = store.currentTerm();
    store.batch(() => {
      if (cur && !cur.endedAt) {
        cur.endedAt = now;
        store._put('terms', cur);
      }
      const t = { id: U.uid(), name: clean(name, 60) || U.suggestTermName(now), startedAt: now, endedAt: null };
      store._put('terms', t);
      store.cfg.currentTermId = t.id;
      store._putCfg();
      store._newTerm = t;
    });
    store.session.undo = [];
    store._changed('terms', { op: 'start' });
    return store._newTerm;
  };
  store.renameTerm = function (id, name) {
    const t = store.terms.get(id);
    const n = clean(name, 60);
    if (!t || !n) throw err('EMPTY', 'Dönem adı boş olamaz.');
    t.name = n;
    store._put('terms', t);
    store._changed('terms', { id, op: 'rename' });
    return t;
  };
  store.termStats = function (termId) {
    let plus = 0, minus = 0;
    for (const e of store.events.values()) {
      if (e.voided || e.termId !== termId) continue;
      if (e.type === 'plus') plus++;
      else minus++;
    }
    return { plus, minus, net: plus - minus };
  };

  /* ---------- Arama ---------- */
  store.search = function (q, limit) {
    const n = U.norm(q);
    if (!n) return [];
    const out = [];
    for (const s of store.students.values()) {
      const name = U.norm(store.fullName(s));
      const rev = U.norm(s.last + ' ' + s.first);
      const no = U.norm(s.no);
      let score = -1;
      if (no && no === n) score = 0;
      else if (name.startsWith(n) || rev.startsWith(n)) score = 1;
      else if (name.split(' ').some((w) => w.startsWith(n))) score = 2;
      else if (name.includes(n) || (no && no.includes(n))) score = 3;
      if (score >= 0) out.push({ student: s, cls: store.classes.get(s.classId), score });
    }
    out.sort((a, b) => a.score - b.score || U.cmp(store.fullName(a.student), store.fullName(b.student)));
    return out.slice(0, limit || 30);
  };

  /* ---------- Yedek: dışa aktarma / doğrulama / içe aktarma ---------- */
  store.exportData = function () {
    return {
      format: 'ogretmenim-yedek',
      version: 1,
      createdAt: Date.now(),
      account: { name: store.account ? store.account.name : '', school: store.account ? store.account.school || '' : '' },
      data: {
        cfg: store.cfg,
        classes: Array.from(store.classes.values()),
        students: Array.from(store.students.values()),
        events: Array.from(store.events.values()),
        notes: Array.from(store.notes.values()),
        grades: Array.from(store.grades.values()),
        absences: Array.from(store.absences.values()),
        reasons: Array.from(store.reasons.values()),
        terms: Array.from(store.terms.values()),
      },
    };
  };
  const isStr = (x) => typeof x === 'string' && x.length > 0 && x.length < 64 && /^[A-Za-z0-9_-]+$/.test(x);
  const num = (x, d) => (typeof x === 'number' && Number.isFinite(x) ? x : d);
  // Güvenilmeyen dosyayı temizler; bozuk kayıtları atar. Dönüş: {ok, error, data, counts, dropped}
  store.validateBackup = function (obj) {
    if (!obj || typeof obj !== 'object' || obj.format !== 'ogretmenim-yedek' || !obj.data || typeof obj.data !== 'object') {
      return { ok: false, error: 'Bu dosya bir E+ yedeği değil.' };
    }
    if (num(obj.version, 0) > 1) return { ok: false, error: 'Yedek daha yeni bir sürümden. Uygulamayı güncelleyin.' };
    const d = obj.data;
    const arr = (x) => (Array.isArray(x) ? x : []);
    let dropped = 0;
    const classes = [], students = [], events = [], notes = [], grades = [], absences = [], reasons = [], terms = [];
    const seen = { c: new Set(), s: new Set(), t: new Set() };
    for (const t of arr(d.terms)) {
      if (!t || !isStr(t.id) || seen.t.has(t.id)) { dropped++; continue; }
      seen.t.add(t.id);
      terms.push({ id: t.id, name: clean(t.name, 60) || 'Dönem', startedAt: num(t.startedAt, Date.now()), endedAt: t.endedAt == null ? null : num(t.endedAt, null) });
    }
    for (const c of arr(d.classes)) {
      const g = parseInt(c && c.grade, 10);
      if (!c || !isStr(c.id) || seen.c.has(c.id) || !(g >= 1 && g <= 12)) { dropped++; continue; }
      seen.c.add(c.id);
      classes.push({ id: c.id, grade: g, section: clean(c.section, 3).toLocaleUpperCase('tr-TR'), label: clean(c.label, 40), color: U.clamp(parseInt(c.color, 10) || 0, 0, CLASS_COLORS - 1), createdAt: num(c.createdAt, Date.now()) });
    }
    for (const s of arr(d.students)) {
      if (!s || !isStr(s.id) || seen.s.has(s.id) || !seen.c.has(s.classId) || (!clean(s.first, 60) && !clean(s.last, 60))) { dropped++; continue; }
      seen.s.add(s.id);
      students.push({ id: s.id, classId: s.classId, first: clean(s.first, 60), last: clean(s.last, 60), no: clean(s.no, 20), createdAt: num(s.createdAt, Date.now()) });
    }
    const fallbackTerm = terms.length ? terms[terms.length - 1].id : null;
    const seenE = new Set();
    for (const e of arr(d.events)) {
      if (!e || !isStr(e.id) || seenE.has(e.id) || !seen.s.has(e.studentId) || (e.type !== 'plus' && e.type !== 'minus') || !Number.isFinite(e.ts)) { dropped++; continue; }
      seenE.add(e.id);
      const ev = { id: e.id, studentId: e.studentId, termId: seen.t.has(e.termId) ? e.termId : fallbackTerm, type: e.type, reasonId: isStr(e.reasonId) ? e.reasonId : null, reason: clean(e.reason, 60), ts: e.ts, voided: !!e.voided };
      if (ev.voided && Number.isFinite(e.voidedAt)) ev.voidedAt = e.voidedAt;
      events.push(ev);
    }
    const seenN = new Set();
    for (const n of arr(d.notes)) {
      const text = String(n && n.text != null ? n.text : '').trim().slice(0, 2000);
      if (!n || !isStr(n.id) || seenN.has(n.id) || !seen.s.has(n.studentId) || !text) { dropped++; continue; }
      seenN.add(n.id);
      notes.push({ id: n.id, studentId: n.studentId, text, ts: num(n.ts, Date.now()), uts: num(n.uts, num(n.ts, Date.now())) });
    }
    const seenG = new Set();
    for (const g of arr(d.grades)) {
      const sc = g && Number(g.score);
      if (!g || !isStr(g.id) || seenG.has(g.id) || !seen.s.has(g.studentId) || !Number.isFinite(sc) || sc < 0 || sc > 100) { dropped++; continue; }
      seenG.add(g.id);
      grades.push({ id: g.id, studentId: g.studentId, termId: seen.t.has(g.termId) ? g.termId : fallbackTerm, score: Math.round(sc * 10) / 10, reason: clean(g.reason, 200), ts: num(g.ts, Date.now()) });
    }
    const seenA = new Set();
    for (const a of arr(d.absences)) {
      if (!a || !isStr(a.id) || seenA.has(a.id) || !seen.s.has(a.studentId) || !/^\d{4}-\d{2}-\d{2}$/.test(String(a.day)) || !ABS_TYPES.includes(a.type)) { dropped++; continue; }
      seenA.add(a.id);
      absences.push({ id: a.id, studentId: a.studentId, termId: seen.t.has(a.termId) ? a.termId : fallbackTerm, day: a.day, type: a.type, note: clean(a.note, 200), ts: num(a.ts, Date.now()) });
    }
    const seenR = new Set();
    for (const r of arr(d.reasons)) {
      if (!r || !isStr(r.id) || seenR.has(r.id) || (r.type !== 'plus' && r.type !== 'minus') || !clean(r.label, 60)) { dropped++; continue; }
      seenR.add(r.id);
      reasons.push({ id: r.id, type: r.type, label: clean(r.label, 60), order: num(r.order, 0), builtin: !!r.builtin, hidden: !!r.hidden });
    }
    const cfgIn = d.cfg && typeof d.cfg === 'object' ? d.cfg : {};
    const cfg = {};
    for (const k of Object.keys(DEFAULT_CFG)) if (k in cfgIn && typeof cfgIn[k] === typeof DEFAULT_CFG[k]) cfg[k] = cfgIn[k];
    if (!['system', 'light', 'dark'].includes(cfg.theme)) delete cfg.theme;
    if (cfg.classPrefs) {
      const cp = {};
      for (const id of Object.keys(cfg.classPrefs)) if (seen.c.has(id) && cfg.classPrefs[id] && typeof cfg.classPrefs[id] === 'object') cp[id] = cfg.classPrefs[id];
      cfg.classPrefs = cp;
    }
    if (cfg.currentTermId && !seen.t.has(cfg.currentTermId)) delete cfg.currentTermId;
    return { ok: true, data: { cfg, classes, students, events, notes, grades, absences, reasons, terms }, counts: { classes: classes.length, students: students.length, events: events.length, notes: notes.length, grades: grades.length, absences: absences.length, terms: terms.length }, dropped };
  };
  // mode: 'replace' | 'merge'
  store.importData = async function (obj, opts) {
    const mode = (opts && opts.mode) || 'replace';
    const v = store.validateBackup(obj);
    if (!v.ok) throw err('BAD_BACKUP', v.error);
    await store.flush();
    if (!(opts && opts.skipSnapshot)) await store.snapshot('before', mode === 'replace' ? 'Geri yüklemeden önce' : 'Birleştirmeden önce');
    const d = v.data;
    let added = 0;
    store.batch(() => {
      if (mode === 'replace') {
        for (const c of COLS) {
          for (const id of Array.from(store._map(c).keys())) store._del(c, id);
        }
        store.cfg = Object.assign({}, DEFAULT_CFG, d.cfg, { lastBackupAt: store.cfg.lastBackupAt });
        store._putCfg();
      }
      const put = (col, list) => {
        for (const r of list) {
          if (mode === 'merge' && store._map(col).has(r.id)) continue;
          store._put(col, r);
          added++;
        }
      };
      put('terms', d.terms);
      put('reasons', d.reasons);
      put('classes', d.classes);
      put('students', d.students);
      put('events', d.events);
      put('notes', d.notes);
      put('grades', d.grades);
      put('absences', d.absences);
      store._ensureDefaults();
    });
    store.session.undo = [];
    store.rev++;
    store._emit({ kind: 'reset' });
    await store.flush();
    return { added, counts: v.counts, dropped: v.dropped };
  };

  /* ---------- Otomatik / elle anlık yedekler (cihaz içinde) ---------- */
  async function gzip(str) {
    if (typeof CompressionStream !== 'function') return null;
    try {
      return await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    } catch (e) {
      return null;
    }
  }
  async function gunzip(buf) {
    return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  store.snapshot = async function (kind, reason) {
    const json = JSON.stringify(store.exportData());
    const buf = await gzip(json);
    const rec = {
      id: U.uid(),
      uid: store.uid,
      ts: Date.now(),
      kind: kind || 'manual',
      reason: reason || '',
      gz: !!buf,
      size: buf ? buf.byteLength : json.length,
      counts: store.counts(),
      payload: buf || json,
    };
    await OGR.db.adapter.addBackup(rec);
    await store._pruneSnapshots();
    return rec;
  };
  store.listSnapshots = () => OGR.db.adapter.listBackups(store.uid);
  store.readSnapshot = async function (id) {
    const rec = await OGR.db.adapter.getBackup(id);
    if (!rec) return null;
    const json = rec.gz ? await gunzip(rec.payload) : rec.payload;
    return JSON.parse(json);
  };
  store.deleteSnapshot = (id) => OGR.db.adapter.deleteBackup(id);
  store._pruneSnapshots = async function () {
    const list = await store.listSnapshots();
    const autos = list.filter((b) => b.kind === 'auto');
    const others = list.filter((b) => b.kind !== 'auto');
    for (const b of autos.slice(7)) await OGR.db.adapter.deleteBackup(b.id);
    for (const b of others.slice(10)) await OGR.db.adapter.deleteBackup(b.id);
  };
  store._autoSnapshotSoon = function () {
    clearTimeout(store._autoTimer);
    store._autoTimer = setTimeout(async () => {
      try {
        if (!store.uid || !store.students.size) return;
        const list = await store.listSnapshots();
        const lastAuto = list.find((b) => b.kind === 'auto');
        if (lastAuto && Date.now() - lastAuto.ts < 20 * 3600e3) return;
        await store.snapshot('auto', 'Günlük otomatik yedek');
      } catch (e) { /* sessizce geç */ }
    }, 4000);
  };
  // Hesabın tüm verilerini siler (hesap kalır). Önce anlık yedek alınır.
  store.wipeData = async function () {
    await store.flush();
    await store.snapshot('before', 'Tüm veriler silinmeden önce');
    store.batch(() => {
      for (const c of COLS) {
        for (const id of Array.from(store._map(c).keys())) store._del(c, id);
      }
      const keep = { theme: store.cfg.theme, autoLockMin: store.cfg.autoLockMin, vibrate: store.cfg.vibrate, sound: store.cfg.sound };
      store.cfg = Object.assign({}, DEFAULT_CFG, keep);
      store._putCfg();
      store._ensureDefaults();
    });
    store.session.undo = [];
    store.rev++;
    store._emit({ kind: 'reset' });
    await store.flush();
  };

  store.CLASS_COLORS = CLASS_COLORS;
  store.DEFAULT_CFG = DEFAULT_CFG;
  OGR.store = store;
})();

/* js/core/auth.js */
/* E+ · Öğretmen hesapları (bu cihazda), zorunlu parola, isteğe bağlı hızlı PIN, kurtarma kodu. */
(function () {
  'use strict';
  const G = typeof globalThis !== 'undefined' ? globalThis : window;
  const OGR = (G.OGR = G.OGR || {});
  const U = OGR.util;

  const ITER = 50000;
  const RECOVERY_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const attempts = new Map();

  function err(code, msg, extra) {
    const e = new Error(msg);
    e.code = code;
    if (extra) Object.assign(e, extra);
    return e;
  }
  const clean = (s, max) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, max);

  async function makeSecret(secret) {
    const salt = U.randomBytes(16);

  }
  async function checkSecret(secret, rec) {
    if (!rec) return false;
    const h = U.toHex(await U.pbkdf2(secret, U.fromHex(rec.salt), rec.iter || ITER));
    let diff = h.length ^ rec.hash.length;
    for (let i = 0; i < h.length; i++) diff |= h.charCodeAt(i) ^ (rec.hash.charCodeAt(i) || 0);
    return diff === 0;
  }

  const A = {};
  A.validatePin = function (pin) {
    if (!/^\d{4,8}$/.test(String(pin == null ? '' : pin))) throw err('BAD_PIN', 'PIN 4 ile 8 haneli rakamlardan oluşmalı.');
    return String(pin);
  };
  A.newRecoveryCode = function () {
    const b = U.randomBytes(16);
    let s = '';
    for (let i = 0; i < 16; i++) s += RECOVERY_ALPHABET[b[i] % RECOVERY_ALPHABET.length];
    return s;
  };
  A.formatRecovery = (c) => String(c).replace(/(.{4})(?=.)/g, '$1-');
  A.normRecovery = (c) => String(c == null ? '' : c).toUpperCase().replace(/[^A-Z0-9]/g, '');

  A.list = async function () {
    const a = await OGR.db.adapter.listAccounts();
    return a.sort((x, y) => (y.lastLoginAt || 0) - (x.lastLoginAt || 0));
  };
  A.validatePassword = function (pw) {
    const p = String(pw == null ? '' : pw);
    if (p.length < 8) throw err('BAD_PASSWORD', 'Parola en az 8 karakter olmalı.');
    if (p.length > 128) throw err('BAD_PASSWORD', 'Parola en fazla 128 karakter olabilir.');
    if (!/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(p) || !/\d/.test(p)) throw err('BAD_PASSWORD', 'Parola en az bir harf ve bir rakam içermeli.');
    return p;
  };
  A.validateEmail = function (e) {
    const m = String(e == null ? '' : e).trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m) || m.length > 120) throw err('BAD_EMAIL', 'Geçerli bir e-posta adresi yazın.');

  };
  A.create = async function (o) {
    const name = clean(o.name, 60);

    A.validatePassword(o.password);
    for (const a of await OGR.db.adapter.listAccounts()) if (a.email === email) throw err('DUP_EMAIL', 'Bu e-posta ile zaten bir hesap var.');
    const acc = {
      id: U.uid(),
      name,
      email,
      school: clean(o.school, 80),
      color: 0,
      createdAt: Date.now(),
      lastLoginAt: Date.now(),
      pw: await makeSecret(String(o.password)),
      lastPwAt: Date.now(),
      bio: null,
      pin: null,
      rec: null,
      demo: !!o.demo,
    };
    let sum = 0;
    for (const ch of name) sum += ch.charCodeAt(0);
    acc.color = sum % 8;
    const recoveryCode = A.newRecoveryCode();
    acc.rec = await makeSecret(recoveryCode);
    if (o.pin) {
      A.validatePin(o.pin);
      acc.pin = await makeSecret(String(o.pin));
    }
    await OGR.db.adapter.putAccount(acc);
    return { account: acc, recoveryCode };
  };
  A.findByEmail = async function (email) {
    const m = String(email || '').trim().toLowerCase();
    return (await OGR.db.adapter.listAccounts()).find((a) => a.email === m) || null;
  };
  function limited(key, ok, fail) {
    const st = attempts.get(key) || { n: 0, until: 0 };
    const now = Date.now();
    if (st.until > now) throw err('LOCKED', `Çok fazla hatalı deneme. ${Math.ceil((st.until - now) / 1000)} saniye sonra tekrar deneyin.`, { wait: st.until - now });
    return {
      done(success) {
        if (success) { attempts.delete(key); return true; }
        st.n++;
        if (st.n >= 5) st.until = now + Math.min(300, 30 * Math.pow(2, st.n - 5)) * 1000;
        attempts.set(key, st);
        return false;
      },
    };
  }
  A.verifyPassword = async function (acc, pw) {
    const l = limited('pw:' + acc.id);
    return l.done(await checkSecret(String(pw), acc.pw));
  };
  // E-posta + parola ile giriş. Hesap yoksa aynı maliyette sahte doğrulama yapılır (zamanlama farkı ve hesap sızdırma yok).
  A.login = async function (email, password) {
    const em = String(email || '').trim().toLowerCase();
    const l = limited('em:' + em);
    const acc = em ? await A.findByEmail(em) : null;
    const ok = acc ? await checkSecret(String(password), acc.pw) : (await checkSecret(String(password), { salt: '00'.repeat(16), hash: '00'.repeat(32), iter: ITER }), false);
    if (!l.done(ok)) return null;
    acc.lastLoginAt = Date.now();
    acc.lastPwAt = Date.now();
    await OGR.db.adapter.putAccount(acc);
    return acc;
  };
  A.QUICK_DAYS = 30;
  A.quickAllowed = (acc) => !!(acc && (acc.pin || acc.bio) && Date.now() - (acc.lastPwAt || 0) < A.QUICK_DAYS * 86400000);
  A.renewRecovery = async function (acc) {
    const code = A.newRecoveryCode();
    acc.rec = await makeSecret(code);
    await OGR.db.adapter.putAccount(acc);
    return code;
  };
  A.setBio = async function (acc, bio) {
    acc.bio = bio || null;
    await OGR.db.adapter.putAccount(acc);
  };
  A.setPassword = async function (acc, pw) {
    A.validatePassword(pw);
    acc.pw = await makeSecret(String(pw));
    acc.lastPwAt = Date.now();
    acc.rec = null;
    const code = A.newRecoveryCode();
    acc.rec = await makeSecret(code);
    await OGR.db.adapter.putAccount(acc);
    return code;
  };
  A.hasPin = (acc) => !!(acc && acc.pin);

  A.verifyPin = async function (acc, pin) {
    const l = limited('pin:' + acc.id);
    return l.done(await checkSecret(String(pin), acc.pin));
  };
  A.setPin = async function (acc, pin) {
    if (!pin) acc.pin = null;
    else {
      A.validatePin(pin);
      acc.pin = await makeSecret(String(pin));
    }
    await OGR.db.adapter.putAccount(acc);
  };
  A.resetWithRecovery = async function (acc, code, newPassword) {
    A.validatePassword(newPassword);
    const l = limited('rec:' + acc.id);
    const ok = l.done(await checkSecret(A.normRecovery(code), acc.rec));
    if (!ok) return null;
    return A.setPassword(acc, newPassword);
  };
  A.touch = async function (acc) {
    acc.lastLoginAt = Date.now();
    await OGR.db.adapter.putAccount(acc);
  };
  A.updateProfile = async function (acc, o) {
    const name = clean(o.name, 60);
    if (!name) throw err('NO_NAME', 'Adınızı yazın.');
    acc.name = name;
    acc.school = clean(o.school, 80);
    if (o.email !== undefined) acc.email = A.validateEmail(o.email);
    await OGR.db.adapter.putAccount(acc);
    return acc;
  };
  A.remove = async function (id) {
    await OGR.db.adapter.deleteAccount(id);
  };

  OGR.auth = A;
})();

/* js/core/reports.js */
/* E+ · Raporlama: dönemler, sıralama, eğilim, neden dağılımı. DOM'a dokunmaz. */
(function () {
  'use strict';
  const G = typeof globalThis !== 'undefined' ? globalThis : window;
  const OGR = (G.OGR = G.OGR || {});
  const U = OGR.util;
  const S = OGR.store;
  const DAY = 86400000;

  const R = {};
  R.KIND_LABEL = { day: 'Günlük', week: 'Haftalık', month: 'Aylık', term: 'Dönem', all: 'Tüm zamanlar', custom: 'Özel aralık' };
  R.PERIOD_LABEL = { today: 'Bugün', week: 'Bu hafta', month: 'Bu ay', term: 'Dönem', all: 'Tüm zamanlar' };

  R.fmtRange = function (from, toIncl) {
    const a = new Date(from), b = new Date(toIncl);
    if (a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth()) {
      return a.getDate() === b.getDate() ? U.fmtDate(toIncl) : `${a.getDate()}–${U.fmtDate(toIncl)}`;
    }
    if (a.getFullYear() === b.getFullYear()) return `${U.fmtDateShort(from)} – ${U.fmtDate(toIncl)}`;
    return `${U.fmtDate(from)} – ${U.fmtDate(toIncl)}`;
  };

  // kind: day | week | month | term | all | custom
  R.periodRange = function (kind, anchor, custom) {
    const a = anchor == null ? Date.now() : anchor;
    if (kind === 'day') {
      const from = U.startOfDay(a);
      return { kind, from, to: U.addDays(from, 1), label: U.fmtDayLong(from) };
    }
    if (kind === 'week') {
      const from = U.startOfWeek(a);
      const to = U.addDays(from, 7);
      return { kind, from, to, label: R.fmtRange(from, to - 1) };
    }
    if (kind === 'month') {
      const from = U.startOfMonth(a);
      return { kind, from, to: U.addMonths(from, 1), label: U.fmtMonthYear(from) };
    }
    if (kind === 'custom' && custom && custom.from != null && custom.to != null) {
      const from = U.startOfDay(Math.min(custom.from, custom.to));
      const to = U.addDays(U.startOfDay(Math.max(custom.from, custom.to)), 1);
      return { kind, from, to, label: R.fmtRange(from, to - 1) };
    }
    return { kind, from: null, to: null, label: R.KIND_LABEL[kind] || '' };
  };
  R.shiftAnchor = function (kind, anchor, dir) {
    if (kind === 'day') return U.addDays(anchor, dir);
    if (kind === 'week') return U.addDays(anchor, 7 * dir);
    if (kind === 'month') return U.addMonths(anchor, dir);
    return anchor;
  };
  // Sınıf ekranındaki dönem seçici: today|week|month|term|all|term:<id>
  R.listFilter = function (period) {
    const now = Date.now();
    if (period === 'today') {
      const r = R.periodRange('day', now);
      return { termId: 'current', from: r.from, to: r.to };
    }
    if (period === 'week') {
      const r = R.periodRange('week', now);
      return { termId: 'current', from: r.from, to: r.to };
    }
    if (period === 'month') {
      const r = R.periodRange('month', now);
      return { termId: 'current', from: r.from, to: r.to };
    }
    if (period === 'all') return { termId: 'all', from: null, to: null };
    if (period && period.startsWith('term:')) return { termId: period.slice(5), from: null, to: null };
    return { termId: 'current', from: null, to: null };
  };
  R.periodLabel = function (period) {
    if (period && period.startsWith('term:')) {
      const t = S.terms.get(period.slice(5));
      return t ? t.name : 'Dönem';
    }
    if (period === 'term') {
      const t = S.currentTerm();
      return t ? t.name : 'Dönem';
    }
    return R.PERIOD_LABEL[period] || 'Dönem';
  };

  /* ---------- Kovalama (grafik verisi) ---------- */
  function monthStep(ts) {
    return U.addMonths(ts, 1);
  }
  R.bucketize = function (events, from, to, unit) {
    const buckets = [];
    if (unit === 'hour') {
      for (let t = from; t < to; t += 3600000) buckets.push({ from: t, to: t + 3600000, plus: 0, minus: 0 });
    } else if (unit === 'day') {
      for (let t = from; t < to; t = U.addDays(t, 1)) buckets.push({ from: t, to: U.addDays(t, 1), plus: 0, minus: 0 });
    } else if (unit === 'week') {
      for (let t = from; t < to; t = U.addDays(t, 7)) buckets.push({ from: t, to: U.addDays(t, 7), plus: 0, minus: 0 });
    } else {
      for (let t = from; t < to; t = monthStep(t)) buckets.push({ from: t, to: monthStep(t), plus: 0, minus: 0 });
    }
    const find = (ts) => {
      let lo = 0, hi = buckets.length - 1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (ts < buckets[mid].from) hi = mid - 1;
        else if (ts >= buckets[mid].to) lo = mid + 1;
        else return mid;
      }
      return -1;
    };
    for (const e of events) {
      if (e.voided) continue;
      const i = find(e.ts);
      if (i < 0) continue;
      if (e.type === 'plus') buckets[i].plus++;
      else buckets[i].minus++;
    }
    const y0 = buckets.length ? new Date(buckets[0].from).getFullYear() : 0;
    const multiYear = buckets.length && new Date(buckets[buckets.length - 1].from).getFullYear() !== y0;
    const sameMonth = buckets.length && new Date(buckets[0].from).getMonth() === new Date(buckets[buckets.length - 1].from).getMonth() && !multiYear;
    for (const b of buckets) {
      b.net = b.plus - b.minus;
      const d = new Date(b.from);
      if (unit === 'hour') b.label = String(d.getHours()).padStart(2, '0');
      else if (unit === 'day') b.label = buckets.length <= 8 ? `${U.fmtWeekdayShort(b.from)} ${d.getDate()}` : sameMonth ? String(d.getDate()) : `${d.getDate()} ${U.fmtMonthShort(b.from)}`;
      else if (unit === 'week') b.label = U.fmtDateShort(b.from);
      else b.label = U.fmtMonthShort(b.from) + (multiYear ? ' ' + String(d.getFullYear()).slice(2) : '');
      b.title = unit === 'hour' ? `${U.fmtDateNum(b.from)} ${b.label}:00` : unit === 'day' ? U.fmtDayLong(b.from) : unit === 'week' ? R.fmtRange(b.from, b.to - 1) : U.fmtMonthYear(b.from);
    }
    return buckets;
  };

  R.trendFor = function (events, range, termInfo) {
    const now = Date.now();
    if (range.kind === 'day') {
      const all = R.bucketize(events, range.from, range.to, 'hour');
      let first = 24, last = -1;
      all.forEach((b, i) => {
        if (b.plus + b.minus > 0) {
          first = Math.min(first, i);
          last = Math.max(last, i);
        }
      });
      const lo = Math.min(first === 24 ? 8 : first, 8);
      const hi = Math.max(last === -1 ? 16 : last, 15);
      return { unit: 'hour', buckets: all.slice(lo, hi + 1) };
    }
    if (range.kind === 'week') return { unit: 'day', buckets: R.bucketize(events, range.from, range.to, 'day') };
    if (range.kind === 'month') return { unit: 'day', buckets: R.bucketize(events, range.from, range.to, 'day') };
    let from = range.from, to = range.to;
    if (from == null) {
      const ts = events.length ? events.map((e) => e.ts) : [];
      const minE = ts.length ? Math.min.apply(null, ts) : now - 6 * DAY;
      const maxE = ts.length ? Math.max.apply(null, ts) : now;
      from = U.startOfDay(termInfo && termInfo.start != null ? Math.min(termInfo.start, minE) : minE);
      to = U.addDays(U.startOfDay(termInfo && termInfo.end != null ? Math.max(termInfo.end, maxE) : maxE), 1);
    }
    const span = (to - from) / DAY;
    if (span <= 62) return { unit: 'day', buckets: R.bucketize(events, from, to, 'day') };
    if (span <= 420) return { unit: 'week', buckets: R.bucketize(events, U.startOfWeek(from), to, 'week') };
    return { unit: 'month', buckets: R.bucketize(events, U.startOfMonth(from), to, 'month') };
  };

  R.reasonTally = function (events) {
    const pm = new Map(), mm = new Map();
    for (const e of events) {
      if (e.voided) continue;
      const m = e.type === 'plus' ? pm : mm;
      const k = e.reason || '';
      m.set(k, (m.get(k) || 0) + 1);
    }
    const toArr = (m) =>
      Array.from(m, ([k, count]) => ({ label: k || 'Neden belirtilmedi', count, none: !k })).sort((a, b) => b.count - a.count || U.cmp(a.label, b.label));
    return { plus: toArr(pm), minus: toArr(mm) };
  };

  /* ---------- Sınıf / çok sınıf raporu ---------- */
  // opts: {classId|null, termId, kind, anchor, custom:{from,to}}
  R.build = function (opts) {
    const now = Date.now();
    const termId = opts.termId === undefined ? 'current' : opts.termId;
    const range = R.periodRange(opts.kind || 'week', opts.anchor == null ? now : opts.anchor, opts.custom);
    const classes = opts.classId ? [S.classes.get(opts.classId)].filter(Boolean) : S.sortedClasses();
    const rows = [];
    const classRows = [];
    for (const cls of classes) {
      const cs = S.classStats(cls.id, { termId, from: range.from, to: range.to });
      const fromDay = range.from != null ? U.isoDay(range.from) : null;
      const toDay = range.to != null ? U.isoDay(range.to - 1) : null;
      cs.rows.forEach((r) => {
        const g = S.gradeStats(r.student.id, { termId, from: range.from, to: range.to });
        const ab = S.absenceStats(r.student.id, { termId, fromDay, toDay });
        rows.push({ student: r.student, cls, plus: r.plus, minus: r.minus, net: r.net, gAvg: g.avg, gCount: g.count, absent: ab.days, unexcused: ab.unexcused, excused: ab.excused, late: ab.late });
      });
      classRows.push({ cls, students: cs.totals.students, plus: cs.totals.plus, minus: cs.totals.minus, net: cs.totals.net, avgNet: cs.totals.avgNet });
    }
    const ranking = rows.slice().sort((a, b) => b.net - a.net || b.plus - a.plus || U.cmp(S.fullName(a.student), S.fullName(b.student)));
    ranking.forEach((r) => {
      r.rank = 1 + ranking.filter((x) => x.net > r.net).length;
    });
    let plus = 0, minus = 0, active = 0;
    rows.forEach((r) => {
      plus += r.plus;
      minus += r.minus;
      if (r.plus + r.minus > 0) active++;
    });
    const n = rows.length;
    const totals = { plus, minus, net: plus - minus, students: n, active, avgNet: n ? (plus - minus) / n : 0, avgPlus: n ? plus / n : 0, avgMinus: n ? minus / n : 0, events: plus + minus };
    const events = [];
    for (const cls of classes) {
      for (const e of S.queryEvents({ classId: cls.id, termId, from: range.from, to: range.to, voided: 'no' })) events.push(e);
    }
    events.sort((a, b) => b.ts - a.ts);
    const term = termId === 'current' ? S.currentTerm() : termId === 'all' ? null : S.terms.get(termId);
    const termInfo = term ? { start: term.startedAt, end: term.endedAt || now } : null;
    const trend = R.trendFor(events, range, termInfo);
    const reasons = R.reasonTally(events);
    const kindLabel = R.KIND_LABEL[range.kind];
    return {
      opts,
      range,
      kindLabel,
      termId,
      termName: termId === 'all' ? 'Tüm dönemler' : term ? term.name : '',
      scopeLabel: opts.classId && classes[0] ? S.classTitle(classes[0]) + (classes[0].label ? ' · ' + classes[0].label : '') : 'Tüm sınıflar',
      classes,
      multi: !opts.classId,
      totals,
      ranking,
      classRows: classRows.sort((a, b) => b.avgNet - a.avgNet),
      events,
      trend,
      reasons,
      generatedAt: now,
    };
  };

  /* ---------- Öğrenci özeti ---------- */
  R.studentSeries = function (studentId, unit, count, now) {
    const n = now == null ? Date.now() : now;
    const events = S.eventsOf(studentId);
    let to, from;
    if (unit === 'day') {
      to = U.addDays(U.startOfDay(n), 1);
      from = U.addDays(to, -count);
    } else if (unit === 'week') {
      to = U.addDays(U.startOfWeek(n), 7);
      from = U.addDays(to, -7 * count);
    } else {
      to = U.addMonths(U.startOfMonth(n), 1);
      from = U.addMonths(to, -count);
    }
    return { unit, buckets: R.bucketize(events, from, to, unit) };
  };
  R.studentSummary = function (sid, opts) {
    const st = S.students.get(sid);
    if (!st) return null;
    const cls = S.classes.get(st.classId);
    const termId = opts && opts.termId !== undefined ? opts.termId : 'current';
    const now = Date.now();
    const mk = (r) => {
      const a = S.aggregate({ studentIds: [sid], termId, from: r ? r.from : null, to: r ? r.to : null }).get(sid);
      return { plus: a.plus, minus: a.minus, net: a.net, last: a.last };
    };
    const totals = mk(null);
    const cs = S.classStats(st.classId, { termId });
    const rank = 1 + cs.rows.filter((r) => r.net > totals.net).length;
    const evs = S.queryEvents({ studentId: sid, termId, voided: 'no' });
    const byTerm = S.sortedTerms()
      .map((t) => {
        const a = S.aggregate({ studentIds: [sid], termId: t.id }).get(sid);
        return { term: t, plus: a.plus, minus: a.minus, net: a.net };
      })
      .filter((x) => x.plus + x.minus > 0 || x.term.id === S.cfg.currentTermId);
    return {
      student: st,
      cls,
      termId,
      totals,
      grades: S.gradeStats(sid, { termId }),
      absences: S.absenceStats(sid, { termId }),
      today: mk(R.periodRange('day', now)),
      week: mk(R.periodRange('week', now)),
      month: mk(R.periodRange('month', now)),
      rank: { rank, of: cs.rows.length },
      reasons: R.reasonTally(evs),
      byTerm,
      generatedAt: now,
    };
  };

  OGR.reports = R;
})();

/* js/core/docs.js */
/* E+ · Belge modeli: rapor/liste verisini PDF, Excel, CSV ve yazdırma için tek biçime çevirir. */
(function () {
  'use strict';
  const G = typeof globalThis !== 'undefined' ? globalThis : window;
  const OGR = (G.OGR = G.OGR || {});
  const U = OGR.util;
  const S = OGR.store;
  const R = OGR.reports;

  const D = {};
  const sg = (n) => U.fmtSigned(n, 1);
  const tone = (n) => (n > 0 ? 'plus' : n < 0 ? 'minus' : 'muted');

  function meta(extra) {
    const a = S.account || {};
    const lines = [];
    if (a.name) lines.push('Öğretmen: ' + a.name);
    if (a.school) lines.push('Okul: ' + a.school);
    (extra || []).forEach((x) => x && lines.push(x));
    lines.push('Oluşturulma: ' + U.fmtDateTime(Date.now()));
    return lines;
  }
  const typeLabel = (t) => (t === 'plus' ? 'Artı (+)' : 'Eksi (−)');
  const reasonLabel = (e) => e.reason || '—';

  /* ---------- Sınıf / çok sınıf raporu ---------- */
  D.report = function (rep) {
    const t = rep.totals;
    const blocks = [];
    blocks.push({
      t: 'kpis',
      items: [
        { label: 'Toplam artı', value: String(t.plus), tone: 'plus' },
        { label: 'Toplam eksi', value: String(t.minus), tone: 'minus' },
        { label: 'Net puan', value: sg(t.net), tone: tone(t.net) },
        { label: 'Öğrenci', value: String(t.students) },
        { label: 'Ortalama net', value: sg(t.avgNet), tone: tone(t.avgNet) },
      ],
    });
    const unitTitle = { hour: 'Saate göre dağılım', day: 'Güne göre dağılım', week: 'Haftaya göre dağılım', month: 'Aya göre dağılım' }[rep.trend.unit];
    blocks.push({ t: 'heading', text: unitTitle });
    blocks.push({ t: 'chart', spec: { type: 'columns', buckets: rep.trend.buckets, unit: rep.trend.unit } });

    const rankRows = rep.ranking.map((r) => {
      const row = [r.rank, r.student.no || '', S.fullName(r.student)];
      if (rep.multi) row.push(S.className(r.cls));
      row.push({ v: r.plus, tone: 'plus' }, { v: r.minus, tone: 'minus' }, { v: r.net, tone: tone(r.net), bold: true, signed: true });
      row.push(r.gAvg == null ? '—' : r.gAvg, r.absent || 0, r.late || 0);
      return row;
    });
    const rankCols = [{ label: 'Sıra', align: 'center', w: 0.7 }, { label: 'No', align: 'left', w: 0.9 }, { label: 'Öğrenci', align: 'left', w: 3 }];
    if (rep.multi) rankCols.push({ label: 'Sınıf', align: 'left', w: 1 });
    rankCols.push({ label: '+', align: 'right', w: 0.8 }, { label: '−', align: 'right', w: 0.8 }, { label: 'Toplam', align: 'right', w: 1 }, { label: 'Dav. notu', align: 'right', w: 1 }, { label: 'Devamsız', align: 'right', w: 1 }, { label: 'Geç', align: 'right', w: 0.7 });
    blocks.push({ t: 'heading', text: 'Başarı sıralaması' });
    if (rep.ranking.length) {
      blocks.push({
        t: 'chart',
        spec: {
          type: 'diverge',
          rows: rep.ranking.slice(0, 15).map((r) => ({ label: S.fullName(r.student), sub: rep.multi ? S.className(r.cls) : '', plus: r.plus, minus: r.minus, net: r.net })),
        },
        only: ['pdf', 'print'],
      });
    }
    blocks.push({ t: 'table', sheet: 'Sıralama', cols: rankCols, rows: rankRows, empty: 'Bu kapsamda öğrenci yok.' });

    if (rep.multi && rep.classRows.length > 1) {
      blocks.push({ t: 'heading', text: 'Sınıfların karşılaştırması' });
      blocks.push({
        t: 'table',
        sheet: 'Sınıflar',
        cols: [{ label: 'Sınıf', w: 2 }, { label: 'Öğrenci', align: 'right', w: 1 }, { label: '+', align: 'right', w: 1 }, { label: '−', align: 'right', w: 1 }, { label: 'Net', align: 'right', w: 1 }, { label: 'Öğrenci başına net', align: 'right', w: 1.6 }],
        rows: rep.classRows.map((c) => [S.classFull(c.cls), c.students, { v: c.plus, tone: 'plus' }, { v: c.minus, tone: 'minus' }, { v: c.net, tone: tone(c.net), signed: true }, { v: Math.round(c.avgNet * 10) / 10, tone: tone(c.avgNet), signed: true, dec: true }]),
      });
    }

    const rcols = [{ label: 'Neden', w: 4 }, { label: 'Adet', align: 'right', w: 1 }];

      sheetTitle: 'Rapor',

  };

  /* ---------- Öğrenci raporu ---------- */
  D.student = function (sum) {
    const s = sum.student;
    const blocks = [];

        { label: 'Net puan', value: sg(sum.totals.net), tone: tone(sum.totals.net) },
        { label: 'Sınıf sırası', value: `${sum.rank.rank} / ${sum.rank.of}` },
        { label: 'Davranış ort.', value: sum.grades.count ? String(sum.grades.avg) : '—' },
        { label: 'Devamsızlık (gün)', value: String(sum.absences.days) },
      ],
    });
    blocks.push({
      t: 'table',
      sheet: 'Özet',
      title: 'Dönem özeti',
      cols: [{ label: 'Aralık', w: 2 }, { label: '+', align: 'right', w: 1 }, { label: '−', align: 'right', w: 1 }, { label: 'Net', align: 'right', w: 1 }],
      rows: [
        ['Bugün', { v: sum.today.plus, tone: 'plus' }, { v: sum.today.minus, tone: 'minus' }, { v: sum.today.net, tone: tone(sum.today.net), signed: true }],
        ['Bu hafta', { v: sum.week.plus, tone: 'plus' }, { v: sum.week.minus, tone: 'minus' }, { v: sum.week.net, tone: tone(sum.week.net), signed: true }],
        ['Bu ay', { v: sum.month.plus, tone: 'plus' }, { v: sum.month.minus, tone: 'minus' }, { v: sum.month.net, tone: tone(sum.month.net), signed: true }],
        [{ v: 'Seçili dönem', bold: true }, { v: sum.totals.plus, tone: 'plus', bold: true }, { v: sum.totals.minus, tone: 'minus', bold: true }, { v: sum.totals.net, tone: tone(sum.totals.net), signed: true, bold: true }],
      ],
    });
    blocks.push({ t: 'heading', text: 'Günlük performans (son 14 gün)' });
    blocks.push({ t: 'chart', spec: { type: 'columns', unit: 'day', buckets: R.studentSeries(s.id, 'day', 14).buckets } });
    blocks.push({ t: 'heading', text: 'Haftalık performans (son 8 hafta)' });
    blocks.push({ t: 'chart', spec: { type: 'columns', unit: 'week', buckets: R.studentSeries(s.id, 'week', 8).buckets } });
    blocks.push({ t: 'heading', text: 'Aylık performans (son 6 ay)' });
    blocks.push({ t: 'chart', spec: { type: 'columns', unit: 'month', buckets: R.studentSeries(s.id, 'month', 6).buckets } });
    const rcols = [{ label: 'Neden', w: 4 }, { label: 'Adet', align: 'right', w: 1 }];
    blocks.push({ t: 'table', sheet: 'Nedenler', title: 'Artı nedenleri', cols: rcols, rows: sum.reasons.plus.map((r) => [r.label, { v: r.count, tone: 'plus' }]), empty: 'Artı kaydı yok.' });
    blocks.push({ t: 'table', sheet: 'Nedenler', title: 'Eksi nedenleri', cols: rcols, rows: sum.reasons.minus.map((r) => [r.label, { v: r.count, tone: 'minus' }]), empty: 'Eksi kaydı yok.' });
    if (sum.byTerm.length > 1) {
      blocks.push({
        t: 'table',
        sheet: 'Dönemler',
        title: 'Dönemlere göre',
        cols: [{ label: 'Dönem', w: 3 }, { label: '+', align: 'right', w: 1 }, { label: '−', align: 'right', w: 1 }, { label: 'Net', align: 'right', w: 1 }],
        rows: sum.byTerm.map((x) => [x.term.name, { v: x.plus, tone: 'plus' }, { v: x.minus, tone: 'minus' }, { v: x.net, tone: tone(x.net), signed: true }]),
      });
    }
    const tid = sum.termId;
    const grs = S.gradesOf(s.id).filter((g) => tid === 'all' || g.termId === (tid === 'current' ? S.cfg.currentTermId : tid));
    blocks.push({
      t: 'table',
      sheet: 'Davranış notları',
      title: 'Davranış (sözlü) notları' + (sum.grades.count ? ` · ortalama ${sum.grades.avg}` : ''),
      cols: [{ label: 'Tarih', w: 1.4 }, { label: 'Puan', align: 'right', w: 0.8 }, { label: 'Sebep', w: 4 }],
      rows: grs.map((g) => [new Date(g.ts), g.score, g.reason || '—']),
      empty: 'Davranış notu yok.',
    });
    const absTr = { unexcused: 'Özürsüz', excused: 'Özürlü', late: 'Geç' };
    const abs = S.absencesOf(s.id).filter((a) => tid === 'all' || a.termId === (tid === 'current' ? S.cfg.currentTermId : tid));
    blocks.push({
      t: 'table',
      sheet: 'Devamsızlık',
      title: `Devamsızlık · özürsüz ${sum.absences.unexcused}, özürlü ${sum.absences.excused}, geç ${sum.absences.late}`,
      cols: [{ label: 'Gün', w: 1.4 }, { label: 'Tür', w: 1 }, { label: 'Not', w: 4 }],

    blocks.push({
      t: 'table',

  V.periodOptions = function (sel) {
    const base = [['today', 'Bugün'], ['week', 'Bu hafta'], ['month', 'Bu ay'], ['term', 'Bu dönem'], ['all', 'Tüm zamanlar']];
    const old = S.sortedTerms().filter((t) => t.id !== S.cfg.currentTermId).map((t) => ['term:' + t.id, 'Arşiv: ' + t.name]);
    return base.concat(old).map(([v, l]) => h`<option value="${v}" ${v === sel ? 'selected' : ''}>${l}</option>`);
  };

  V.pageHead = (title, sub, actions) => h`<div class="page-h"><div><h1>${title}</h1>${sub ? h`<p class="sub">${sub}</p>` : ''}</div>${actions ? h`<div class="row">${actions}</div>` : ''}</div>`;
  V.initials = (s) => U.initials(s.first, s.last);
})();

/* js/ui/views/auth.js */
/* E+ · Giriş, kayıt, parola sıfırlama, kilit ekranı, biyometrik (cihaz) doğrulama. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const ui = OGR.ui;
  const U = OGR.util;
  const A = OGR.auth;
  const { h, raw, icon } = ui;
  const V = (OGR.views = OGR.views || {});

  /* ---------- WebAuthn: cihaz parmak izi / yüz / ekran kilidi ---------- */
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const bio = {
    async supported() {
      try {
        return !!(window.PublicKeyCredential && navigator.credentials && (await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()));
      } catch (e) { return false; }
    },
    async register(acc) {
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge: U.randomBytes(32),
          rp: { name: 'E+' },
          user: { id: U.randomBytes(16), name: acc.email, displayName: acc.name },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
          timeout: 60000,
          attestation: 'none',
        },
      });
      if (!cred) throw new Error('Doğrulama tamamlanamadı.');
      return { id: b64(cred.rawId), at: Date.now() };
    },
    async verify(acc) {
      const r = await navigator.credentials.get({
        publicKey: { challenge: U.randomBytes(32), allowCredentials: [{ type: 'public-key', id: unb64(acc.bio.id), transports: ['internal'] }], userVerification: 'required', timeout: 60000 },
      });
      return !!r;
    },
  };
  OGR.bio = bio;

  const root = () => document.getElementById('authRoot');
  const msgOf = (e) => (e && e.message) || 'Bir sorun oluştu.';
  function lastEmail() { try { return localStorage.getItem('eplus:lastEmail') || ''; } catch (e) { return ''; } }
  function rememberEmail(e) { try { localStorage.setItem('eplus:lastEmail', e); } catch (x) { /* yoksay */ } }

  function screen(inner, opts) {
    const r = root();
    r.hidden = false;
    r.innerHTML = String(h`<div class="auth-in">
      <div class="auth-brand">${ui.logo}<h1>E+</h1><p>${(opts && opts.tagline) || 'Sınıf takibi ve artı/eksi programı'}</p></div>
      ${inner}
      <p class="field-help" style="text-align:center">Hesaplar ve öğrenci verileri yalnızca bu cihazda saklanır.</p>
    </div>`);
    document.getElementById('app').hidden = true;
    const f = r.querySelector('[data-autofocus]');
    if (f) setTimeout(() => { const a = document.activeElement; if (!a || a === document.body || !r.contains(a)) f.focus(); }, 40);
    r.scrollTop = 0;
    return r;
  }
  V.hideAuth = function () {
    const r = root();
    r.hidden = true;
    r.innerHTML = '';
    document.getElementById('app').hidden = false;
  };

  const pwField = (id, label, ac, extra) => h`<div class="field"><label for="${id}">${label}</label>
    <div style="position:relative"><input id="${id}" name="${id}" class="input" type="password" autocomplete="${ac}" maxlength="128" required style="padding-right:50px" ${extra || ''}>
    <button type="button" class="icon-btn sm" data-eye="${id}" aria-label="Parolayı göster" aria-pressed="false" style="position:absolute;right:4px;top:5px">${icon('eye')}</button></div></div>`;

  function wireEyes(r) {
    r.querySelectorAll('[data-eye]').forEach((b) => {
      b.addEventListener('click', () => {
        const i = r.querySelector('#' + b.dataset.eye);
        const show = i.type === 'password';
        i.type = show ? 'text' : 'password';
        b.setAttribute('aria-pressed', String(show));
        b.setAttribute('aria-label', show ? 'Parolayı gizle' : 'Parolayı göster');
        b.innerHTML = String(icon(show ? 'eyeOff' : 'eye'));
      });
    });
  }
  const strength = (p) => {
    let s = 0;
    if (p.length >= 8) s++;
    if (p.length >= 12) s++;
    if (/[a-zçğıöşü]/.test(p) && /[A-ZÇĞİÖŞÜ]/.test(p)) s++;
    if (/\d/.test(p) && /[^A-Za-z0-9çğıöşüÇĞİÖŞÜ]/.test(p)) s++;
    return Math.min(s, 4);
  };
  function wireStrength(r, id) {
    const i = r.querySelector('#' + id), out = r.querySelector('[data-strength]');
    if (!i || !out) return;
    i.addEventListener('input', () => {
      const s = strength(i.value);
      out.textContent = i.value ? ['Çok zayıf', 'Zayıf', 'Orta', 'İyi', 'Güçlü'][s] : '';
      out.className = 'field-help ' + (s >= 3 ? 't-plus' : s <= 1 ? 't-minus' : '');
    });
  }
  const errBox = () => h`<p class="form-error" data-error role="alert"></p>`;
  const setErr = (r, m) => { const e = r.querySelector('[data-error]'); if (e) e.textContent = m || ''; };

  /* ---------- Giriş ---------- */
  V.login = function (ctx, prefill) {
    const hasDemo = true;
    const r = screen(h`<form class="card stack" data-form novalidate>
      <h2>Giriş yap</h2>
      ${ui.field({ id: 'email', label: 'E-posta', type: 'email', ac: 'username email', value: (prefill && prefill.email) || lastEmail(), required: true, af: true, max: 120, inputmode: 'email' })}
      ${pwField('password', 'Parola', 'current-password')}
      ${errBox()}
      <button class="btn btn-primary btn-lg btn-block" type="submit">${icon('unlock')} Giriş yap</button>
      <div class="row" style="justify-content:space-between"><button type="button" class="btn btn-ghost btn-sm" data-go="forgot">Parolamı unuttum</button><button type="button" class="btn btn-ghost btn-sm" data-go="register">Hesap oluştur</button></div>
    </form>
    ${hasDemo ? h`<button type="button" class="btn btn-block" data-go="demo">${icon('star')} Örnek verilerle dene</button>` : ''}
    ${prefill && prefill.notice ? h`<div class="banner">${icon('info')}<div>${prefill.notice}</div></div>` : ''}`);
    wireEyes(r);
    r.querySelector('[data-go=register]').onclick = () => V.register(ctx);
    r.querySelector('[data-go=forgot]').onclick = () => V.forgot(ctx);
    const demoBtn = r.querySelector('[data-go=demo]');
    if (demoBtn) demoBtn.onclick = () => ui.busy(demoBtn, () => ctx.demo().catch((e) => setErr(r, msgOf(e))));
    if (r.querySelector('#email').value) setTimeout(() => r.querySelector('#password').focus(), 60);
    r.querySelector('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ui.formData(ev.target);
      const btn = ev.target.querySelector('[type=submit]');
      setErr(r, '');
      if (!f.email.trim() || !f.password) return setErr(r, 'E-posta ve parolayı yazın.');
      try {
        await ui.busy(btn, async () => {
          const acc = await A.login(f.email, f.password);
          if (!acc) return setErr(r, 'E-posta veya parola hatalı.');
          rememberEmail(acc.email);
          await ctx.enter(acc);
        });
      } catch (e) { setErr(r, msgOf(e)); }
    });
  };

  /* ---------- Kayıt ---------- */
  V.register = function (ctx) {
    const r = screen(h`<form class="card stack" data-form novalidate>
      <div class="row-nw"><button type="button" class="icon-btn sm" data-go="login" aria-label="Geri">${icon('chevL')}</button><h2>Öğretmen hesabı oluştur</h2></div>
      ${ui.field({ id: 'name', label: 'Ad soyad', ac: 'name', required: true, af: true, max: 60 })}
      ${ui.field({ id: 'school', label: 'Okul (isteğe bağlı)', ac: 'organization', max: 80 })}
      ${ui.field({ id: 'email', label: 'E-posta', type: 'email', ac: 'username email', required: true, max: 120, inputmode: 'email', help: 'Giriş için kullanılır. Bu sürümde adres doğrulanmaz ve e-posta gönderilmez.' })}
      ${pwField('password', 'Parola', 'new-password')}
      <span class="field-help" data-strength aria-live="polite"></span>
      ${pwField('password2', 'Parola (tekrar)', 'new-password')}
      <p class="field-help">En az 8 karakter; en az bir harf ve bir rakam içermeli.</p>
      ${errBox()}
      <button class="btn btn-primary btn-lg btn-block" type="submit">Hesabı oluştur</button>
    </form>`);
    wireEyes(r);
    wireStrength(r, 'password');
    r.querySelector('[data-go=login]').onclick = () => V.login(ctx);
    r.querySelector('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ui.formData(ev.target);
      const btn = ev.target.querySelector('[type=submit]');
      setErr(r, '');
      if (f.password !== f.password2) return setErr(r, 'Parolalar aynı değil.');
      try {
        await ui.busy(btn, async () => {
          const res = await A.create({ name: f.name, school: f.school, email: f.email, password: f.password });
          rememberEmail(res.account.email);
          V.recovery(ctx, res.account, res.recoveryCode, 'created');
        });
      } catch (e) { setErr(r, msgOf(e)); }
    });
  };

  /* ---------- Kurtarma kodu ---------- */
  V.recovery = function (ctx, acc, code, why) {
    const shown = A.formatRecovery(code);
    const r = screen(h`<div class="card stack">
      <div class="row-nw">${icon('key')}<h2>Kurtarma kodunuz</h2></div>
      <p>Parolanızı unutursanız hesabınıza <b>yalnızca bu kodla</b> yeniden erişebilirsiniz. Kod yalnızca bir kez gösterilir; e-posta gönderilmez.</p>
      <div class="recovery" data-code>${shown}</div>
      <div class="row"><button type="button" class="btn btn-sm" data-copy>${icon('copy')} Kopyala</button><button type="button" class="btn btn-sm" data-save>${icon('download')} Dosya olarak indir</button></div>
      <label class="check"><input type="checkbox" data-ack><span>Kurtarma kodumu güvenli bir yere kaydettim.</span></label>
      <button class="btn btn-primary btn-lg btn-block" type="button" data-next disabled>${why === 'reset' ? 'Giriş yap' : 'Uygulamaya geç'}</button>
    </div>`, { tagline: why === 'reset' ? 'Parolanız güncellendi' : 'Hesabınız hazır' });
    r.querySelector('[data-ack]').onchange = (e) => { r.querySelector('[data-next]').disabled = !e.target.checked; };
    r.querySelector('[data-copy]').onclick = async () => {
      try { await navigator.clipboard.writeText(shown); ui.toast('Kod kopyalandı'); } catch (e) { ui.toast('Kopyalanamadı; kodu elle yazın', { kind: 'error' }); }
    };
    r.querySelector('[data-save]').onclick = () => OGR.export.save(`E+ kurtarma kodu\r\nHesap: ${acc.email}\r\nKod: ${shown}\r\n\r\nBu kodu kimseyle paylaşmayın.\r\n`, 'E+-kurtarma-kodu.txt', 'text/plain;charset=utf-8').catch(() => ui.toast('Dosya kaydedilemedi', { kind: 'error' }));
    r.querySelector('[data-next]').onclick = () => (why === 'reset' ? V.login(ctx, { email: acc.email }) : ctx.enter(acc));
  };

  /* ---------- Parola sıfırlama ---------- */
  V.forgot = function (ctx) {
    const r = screen(h`<form class="card stack" data-form novalidate>
      <div class="row-nw"><button type="button" class="icon-btn sm" data-go="login" aria-label="Geri">${icon('chevL')}</button><h2>Parolayı sıfırla</h2></div>
      <p class="muted">Hesap oluştururken verilen 16 karakterlik kurtarma kodunu girin.</p>
      ${ui.field({ id: 'email', label: 'E-posta', type: 'email', ac: 'username email', value: lastEmail(), required: true, af: true, max: 120 })}
      ${ui.field({ id: 'code', label: 'Kurtarma kodu', ac: 'off', required: true, max: 24, ph: 'XXXX-XXXX-XXXX-XXXX' })}
      ${pwField('password', 'Yeni parola', 'new-password')}
      <span class="field-help" data-strength aria-live="polite"></span>
      ${pwField('password2', 'Yeni parola (tekrar)', 'new-password')}
      ${errBox()}
      <button class="btn btn-primary btn-lg btn-block" type="submit">Parolayı değiştir</button>
      <p class="field-help">Kodunuz yoksa hesabın verilerine erişilemez; güvenlik gereği başka bir yol yoktur.</p>
    </form>`);
    wireEyes(r);
    wireStrength(r, 'password');
    r.querySelector('[data-go=login]').onclick = () => V.login(ctx);
    r.querySelector('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ui.formData(ev.target);
      const btn = ev.target.querySelector('[type=submit]');
      setErr(r, '');
      if (f.password !== f.password2) return setErr(r, 'Parolalar aynı değil.');
      try {
        await ui.busy(btn, async () => {
          A.validatePassword(f.password);
          const acc = await A.findByEmail(f.email);
          // Hesap yoksa da aynı hata (hesap varlığı sızdırılmaz)
          const code = acc ? await A.resetWithRecovery(acc, f.code, f.password) : null;
          if (!code) return setErr(r, 'E-posta veya kurtarma kodu hatalı.');
          V.recovery(ctx, acc, code, 'reset');
        });
      } catch (e) { setErr(r, msgOf(e)); }
    });
  };

  /* ---------- Kilit ekranı (oturum açık, ekran kilitli) ---------- */
  V.lock = function (ctx, acc, opts) {
    opts = opts || {};
    const quick = A.quickAllowed(acc);
    const usePin = quick && !!acc.pin;
    const useBio = quick && !!acc.bio;
    let pin = '';
    const avatar = h`<div class="avatar" style="width:64px;height:64px;font-size:24px;background:${ui.avatarBg(acc.color)};margin:0 auto">${U.initials(acc.name, '')}</div>`;
    const dots = () => h`<div class="pin-dots" data-dots aria-hidden="true">${Array.from({ length: Math.max(4, pin.length) }, (_, i) => h`<i class="${i < pin.length ? 'on' : ''}"></i>`)}</div>`;
    const pad = h`<div class="pinpad">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((n) => h`<button type="button" data-n="${n}" aria-label="${n}">${n}</button>`)}<button type="button" class="alt" data-bk aria-label="Sil">${icon('chevL')}</button><button type="button" data-n="0" aria-label="0">0</button><button type="button" class="alt" data-ok aria-label="Kilidi aç">${icon('check')}</button></div>`;
    const r = screen(h`<div class="card stack" style="text-align:center">
      ${avatar}
      <div><h2>${acc.name}</h2><p class="muted">${opts.reason || 'Oturum kilitli'}</p></div>
      ${usePin ? h`<div data-pinwrap>${dots()}</div>${pad}` : ''}
      ${useBio ? h`<button type="button" class="btn btn-lg btn-block" data-bio>${icon('fingerprint')} Parmak izi / yüz ile aç</button>` : ''}
      ${errBox()}
      <div class="row" style="justify-content:center"><button type="button" class="btn btn-ghost btn-sm" data-pw>${icon('key')} Parola ile aç</button><button type="button" class="btn btn-ghost btn-sm" data-out>${icon('logout')} Oturumu kapat</button></div>
    </div>`, { tagline: 'Verileriniz korunuyor' });
    const unlock = async () => { setErr(r, ''); await ctx.enter(acc, { unlocked: true }); };
    if (usePin) {
      const refresh = () => { r.querySelector('[data-pinwrap]').innerHTML = String(dots()); };
      const submit = async () => {
        if (pin.length < 4) return;
        try {
          const ok = await A.verifyPin(acc, pin);
          if (ok) return unlock();
          const d = r.querySelector('[data-dots]');
          d.classList.add('shake');
          setErr(r, 'PIN hatalı.');
          pin = '';
          setTimeout(refresh, 380);
        } catch (e) { setErr(r, msgOf(e)); pin = ''; refresh(); }
      };
      r.querySelectorAll('[data-n]').forEach((b) => (b.onclick = () => { if (pin.length < 8) { pin += b.dataset.n; refresh(); if (pin.length === 8) submit(); } }));
      r.querySelector('[data-bk]').onclick = () => { pin = pin.slice(0, -1); refresh(); };
      r.querySelector('[data-ok]').onclick = submit;
      const key = (e) => {
        if (!root() || root().hidden) return document.removeEventListener('keydown', key);
        if (/^\d$/.test(e.key) && pin.length < 8) { pin += e.key; refresh(); } else if (e.key === 'Backspace') { pin = pin.slice(0, -1); refresh(); } else if (e.key === 'Enter') submit();
      };
      document.addEventListener('keydown', key);
    }
    if (useBio) {
      const go = async () => {
        try { if (await bio.verify(acc)) await unlock(); } catch (e) { setErr(r, e && e.name === 'NotAllowedError' ? 'Doğrulama iptal edildi veya desteklenmiyor.' : msgOf(e)); }
      };
      r.querySelector('[data-bio]').onclick = go;
      if (opts.autoBio) setTimeout(go, 250);
    }
    r.querySelector('[data-pw]').onclick = () => V.passwordGate(ctx, acc);
    r.querySelector('[data-out]').onclick = () => ctx.logout();
    if (!quick) V.passwordGate(ctx, acc, opts);
  };

  // Kilidi parolayla açma
  V.passwordGate = function (ctx, acc, opts) {
    const r = screen(h`<form class="card stack" data-form novalidate>
      <div class="row-nw"><button type="button" class="icon-btn sm" data-back aria-label="Geri">${icon('chevL')}</button><div><h2>${acc.name}</h2><p class="muted">${(opts && opts.reason) || 'Devam etmek için parolanızı girin'}</p></div></div>
      ${pwField('password', 'Parola', 'current-password', 'data-autofocus')}
      ${errBox()}
      <button class="btn btn-primary btn-lg btn-block" type="submit">${icon('unlock')} Aç</button>
      <button type="button" class="btn btn-ghost btn-sm btn-block" data-out>${icon('logout')} Oturumu kapat</button>
    </form>`, { tagline: 'Oturum kilitli' });
    wireEyes(r);
    r.querySelector('[data-back]').onclick = () => (A.quickAllowed(acc) ? V.lock(ctx, acc, opts) : ctx.logout());
    r.querySelector('[data-out]').onclick = () => ctx.logout();
    r.querySelector('form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const f = ui.formData(ev.target);
      const btn = ev.target.querySelector('[type=submit]');
      try {
        await ui.busy(btn, async () => {
          if (!(await A.verifyPassword(acc, f.password))) return setErr(r, 'Parola hatalı.');
          acc.lastPwAt = Date.now();
          await OGR.db.adapter.putAccount(acc);
          await ctx.enter(acc, { unlocked: true });
        });
      } catch (e) { setErr(r, msgOf(e)); }
    });
  };
})();

/* js/ui/views/home.js */
/* E+ · Ana sayfa: sınıf kartları ve günün özeti. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const ui = OGR.ui;
  const U = OGR.util;
  const S = OGR.store;
  const R = OGR.reports;
  const { h, icon } = ui;
  const V = (OGR.views = OGR.views || {});

  function today() {
    const f = R.listFilter('today');
    let plus = 0, minus = 0, active = 0, total = 0;
    const per = new Map();
    for (const c of S.sortedClasses()) {
      const cs = S.classStats(c.id, f);
      total += cs.totals.students;
      plus += cs.totals.plus;
      minus += cs.totals.minus;
      active += cs.rows.filter((r) => r.plus + r.minus > 0).length;
      per.set(c.id, cs.totals);
    }
    return { plus, minus, active, total, per };
  }

  V.home = {
    title: () => 'Sınıflarım',
    render() {
      const classes = S.sortedClasses();
      const t = today();
      const first = (S.account.name || '').split(' ')[0];
      const hr = new Date().getHours();
      const greet = hr < 6 ? 'İyi geceler' : hr < 12 ? 'Günaydın' : hr < 18 ? 'İyi günler' : 'İyi akşamlar';
      const needBackup = S.students.size > 0 && S.cfg.backupReminderDays > 0 && Date.now() - (S.cfg.lastBackupAt || 0) > S.cfg.backupReminderDays * 86400000;
      const cards = classes.map((c) => {
        const cs = S.classStats(c.id, { termId: 'current' });
        const td = t.per.get(c.id) || { plus: 0, minus: 0 };
        return h`<div class="ccard" style="${ui.coverVar(c)}">
          <a class="ccard-main" href="#sinif-${c.id}" aria-label="${S.classFull(c)} sınıfını aç">
            <div class="ccard-cover"><div class="ccard-label"><b>${S.className(c)}</b><small>${c.label || ' '}</small></div></div>
            <div class="ccard-body"><div><div class="l">Öğrenci</div><div class="v">${cs.totals.students}</div></div><div><div class="l">Ort. net</div><div class="v ${ui.tone(cs.totals.avgNet)}">${ui.signed(cs.totals.avgNet)}</div></div><div><div class="l">Bugün</div><div class="v"><span class="t-plus">+${td.plus}</span> <span class="t-minus">−${td.minus}</span></div></div></div>
          </a>
          <button type="button" class="icon-btn ccard-menu" data-act="cmenu" data-id="${c.id}" aria-label="${S.className(c)} seçenekleri">${icon('more')}</button>
        </div>`;
      });
      return h`${V.pageHead(`${greet}${first ? ', ' + first : ''}`, U.fmtDayLong(Date.now()), h`<button type="button" class="btn btn-primary" data-act="newclass">${icon('plus')} Yeni sınıf</button>`)}
        ${classes.length ? h`<div class="kpis" style="margin-bottom:16px">
          <div class="kpi plus"><div class="kpi-l">Bugün verilen artı</div><div class="kpi-v">${t.plus}</div></div>
          <div class="kpi minus"><div class="kpi-l">Bugün verilen eksi</div><div class="kpi-v">${t.minus}</div></div>
          <div class="kpi"><div class="kpi-l">Bugün puan alan</div><div class="kpi-v">${t.active}<small class="faint" style="font-size:15px"> / ${t.total}</small></div></div>
          <div class="kpi"><div class="kpi-l">Dönem</div><div class="kpi-v" style="font-size:17px;line-height:1.35">${(S.currentTerm() || {}).name || ''}</div></div>
        </div>` : ''}
        ${needBackup ? h`<div class="banner warn" style="margin-bottom:16px">${icon('alert')}<div class="grow"><b>Yedek zamanı.</b> Verileriniz yalnızca bu cihazda duruyor; ${S.cfg.lastBackupAt ? 'son yedeğinizin üzerinden ' + Math.floor((Date.now() - S.cfg.lastBackupAt) / 86400000) + ' gün geçti.' : 'henüz yedek almadınız.'}</div><button class="btn btn-sm" data-act="backup">Yedek al</button></div>` : ''}
        ${classes.length
          ? h`<div class="cgrid">${cards}<button type="button" class="ccard ccard-new" data-act="newclass"><span class="plus-i">${icon('plus')}</span>Yeni sınıf ekle</button></div>`
          : h`<div class="card"><div class="empty"><div class="empty-i">${icon('book')}</div><h3>İlk sınıfınızı oluşturun</h3><p>Sınıf düzeyini ve şubeyi seçin, ardından öğrencilerinizi tek tek ya da Excel/CSV dosyasından ekleyin.</p><button type="button" class="btn btn-primary btn-lg" data-act="newclass">${icon('plus')} Sınıf ekle</button></div></div>`}`;
    },
    mount(el) {
      ui.delegate(el, {
        newclass: () => V.classModal(null, (c) => V.go('sinif', c.id)),
        backup: () => V.go('ayarlar'),
        cmenu: (b) => {
          const c = S.classes.get(b.dataset.id);
          ui.menu(b, [
            { label: 'Sınıfa git', icon: 'book', act: () => V.go('sinif', c.id) },
            { label: 'Düzenle', icon: 'edit', act: () => V.classModal(c) },
            { label: 'Rapor', icon: 'chart', act: () => V.go('rapor', c.id) },
            { sep: true },
            { label: 'Sınıfı sil', icon: 'trash', danger: true, act: () => V.deleteClass(c) },
          ]);
        },
      });
    },
  };
})();

/* js/ui/views/class.js */
/* E+ · Sınıf ekranı: öğrenci listesi, tek dokunuşla artı/eksi, sıralama, arama. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const ui = OGR.ui;
  const U = OGR.util;
  const S = OGR.store;
  const R = OGR.reports;
  const { h, raw, icon } = ui;
  const V = (OGR.views = OGR.views || {});

  const SORTS = [
    ['name', 'Soyada göre (A–Z)'],
    ['first', 'Ada göre (A–Z)'],
    ['no', 'Okul numarasına göre'],
    ['net-desc', 'Puana göre (çoktan aza)'],
    ['net-asc', 'Puana göre (azdan çoğa)'],
    ['plus', 'En çok artı'],
    ['minus', 'En çok eksi'],
  ];
  const SCORE_SORT = new Set(['net-desc', 'net-asc', 'plus', 'minus']);
  const noNum = (s) => (/^\d+$/.test(s.no) ? parseInt(s.no, 10) : Infinity);

  function sortRows(rows, mode) {
    const a = rows.slice();
    const nm = (r) => S.fullName(r.student);
    switch (mode) {
      case 'first': a.sort((x, y) => U.cmp(x.student.first, y.student.first) || U.cmp(x.student.last, y.student.last)); break;
      case 'no': a.sort((x, y) => noNum(x.student) - noNum(y.student) || U.cmp(x.student.no, y.student.no) || U.cmp(nm(x), nm(y))); break;
      case 'net-desc': a.sort((x, y) => y.net - x.net || y.plus - x.plus || U.cmp(nm(x), nm(y))); break;
      case 'net-asc': a.sort((x, y) => x.net - y.net || y.minus - x.minus || U.cmp(nm(x), nm(y))); break;
      case 'plus': a.sort((x, y) => y.plus - x.plus || y.net - x.net || U.cmp(nm(x), nm(y))); break;
      case 'minus': a.sort((x, y) => y.minus - x.minus || x.net - y.net || U.cmp(nm(x), nm(y))); break;
      default: break; // studentsOf zaten soyada göre sıralı
    }
    return a;
  }

  function rowHtml(r, pos, scoreSort, cls) {
    const s = r.student;
    const name = S.fullName(s);
    const medal = scoreSort && pos <= 3 && r.plus + r.minus > 0 ? ' r' + pos : '';
    const lead = scoreSort ? pos : U.initials(s.first, s.last);
    return h`<li class="srow" data-sid="${s.id}">
      <a class="smain" href="#ogrenci-${s.id}" aria-label="${name} ayrıntıları">
        <span class="srank${medal}" ${scoreSort ? '' : raw(`style="background:var(--cover-${cls.color % 8});color:#fff"`)}>${lead}</span>
        <span class="sinfo"><span class="sname">${name}</span><span class="smeta">${s.no ? h`<span>No ${s.no}</span>` : ''}<span class="c t-plus">+${r.plus}</span><span class="c t-minus">−${r.minus}</span><span class="net">= ${ui.signed(r.net, 0)}</span>${(() => { const a = S.absenceOn(s.id, V.today()); return a ? h`<span class="abtag abs-${a.type}">${V.ABS_LABEL[a.type]}</span>` : ''; })()}</span></span>
        <span class="scols"><span class="n t-plus">${r.plus}</span><span class="n t-minus">${r.minus}</span><span class="n net ${ui.tone(r.net)}">${ui.signed(r.net, 0)}</span></span>
      </a>
      <div class="sbtns"><button type="button" class="pm pm-minus" data-act="minus" aria-label="${name} için eksi ver">${icon('minus')}</button><button type="button" class="pm pm-plus" data-act="plus" aria-label="${name} için artı ver">${icon('plus')}</button></div>
    </li>`;
  }

  V.classView = {
    title: (p) => { const c = S.classes.get(p.id); return c ? S.classFull(c) : 'Sınıf'; },
    render(p) {
      const cls = S.classes.get(p.id);
      if (!cls) return h`<div class="card"><div class="empty"><div class="empty-i">${icon('book')}</div><h3>Sınıf bulunamadı</h3><p>Silinmiş olabilir.</p><a class="btn btn-primary" href="#">Sınıflarıma dön</a></div></div>`;
      const pref = S.classPref(cls.id);
      const st = (this._st = this._st && this._st.id === cls.id ? this._st : { id: cls.id, q: '' });
      const f = R.listFilter(pref.period);
      const cs = S.classStats(cls.id, f);
      const score = SCORE_SORT.has(pref.sort);
      const rows = sortRows(cs.rows, pref.sort);
      st.order = rows.map((r) => r.student.id);
      st.dirty = false;
      const t = cs.totals;
      const all = S.sortedClasses();
      const arch = pref.period.startsWith('term:');
      return h`
        <a class="crumb" href="#">${icon('chevL')} Sınıflarım</a>
        <div class="chead" style="${ui.coverVar(cls)}">
          <div class="cbadge">${S.className(cls)}</div>
          <div class="grow"><h1 style="font-size:24px">${S.classTitle(cls)}</h1><p class="muted">${cls.label ? cls.label + ' · ' : ''}${t.students} öğrenci · ${R.periodLabel(pref.period)}${(() => { const n = S.attendanceOn(cls.id, V.today()).size; return n ? ' · bugün ' + n + ' devamsız/geç' : ''; })()}</p></div>
          <div class="row"><button type="button" class="btn" data-act="attend">${icon('check')} Yoklama</button><button type="button" class="btn btn-primary" data-act="addstudent">${icon('plus')} Öğrenci ekle</button><button type="button" class="icon-btn" data-act="cmenu" aria-label="Sınıf seçenekleri" style="border:1px solid var(--line-2);background:var(--surface)">${icon('more')}</button></div>
        </div>
        ${all.length > 1 ? h`<div class="cswitch" role="tablist" aria-label="Sınıf değiştir">${all.map((c) => h`<a class="chip ${c.id === cls.id ? 'is-on' : ''}" href="#sinif-${c.id}" style="${ui.coverVar(c)}" ${c.id === cls.id ? raw('aria-current="page"') : ''}><span class="dot"></span>${S.className(c)}</a>`)}</div>` : ''}
        <div class="avgbar" data-avg>${this.avg(t)}</div>
        <div class="toolbar">
          <div class="search">${icon('search')}<input class="input sm" type="search" data-q placeholder="Öğrenci ara…" aria-label="Sınıfta öğrenci ara" value="${st.q}" autocomplete="off"></div>
          <select class="select sm" data-sort aria-label="Sıralama" style="width:auto;max-width:200px">${SORTS.map(([v, l]) => h`<option value="${v}" ${v === pref.sort ? 'selected' : ''}>${l}</option>`)}</select>
          <select class="select sm" data-period aria-label="Dönem / aralık" style="width:auto;max-width:190px">${V.periodOptions(pref.period)}</select>
          <button type="button" class="btn btn-sm" data-act="undo" ${S.canUndo() ? '' : 'disabled'} aria-label="Son puanı geri al">${icon('undo')} <span>Geri al</span></button>
        </div>
        ${arch ? h`<div class="banner" style="margin-bottom:10px">${icon('folder')}<div>Arşivlenmiş dönem görüntüleniyor. Yeni puanlar <b>${(S.currentTerm() || {}).name}</b> dönemine işlenir.</div></div>` : ''}
        ${!S.cfg.hintDismissed && t.students ? h`<div class="hint">${icon('info')}<span class="grow">Dokun: hemen puan ver · Basılı tut: neden seç · Yanlış puan için “Geri al”.</span><button class="btn btn-ghost btn-sm" data-act="hint">Tamam</button></div>` : ''}
        ${t.students
          ? h`<div class="shead" aria-hidden="true"><span></span><span>Öğrenci</span><span class="r" style="display:flex;justify-content:flex-end">+</span><span class="r" style="display:flex;justify-content:flex-end">−</span><span class="r" style="display:flex;justify-content:flex-end">Toplam</span><span></span></div>
            <ul class="slist" data-list>${this.rowsHtml(rows, score, cls, st.q)}</ul>
            <p class="empty" data-none hidden>Aramayla eşleşen öğrenci yok.</p>`
          : h`<div class="card"><div class="empty"><div class="empty-i">${icon('users')}</div><h3>Bu sınıfta henüz öğrenci yok</h3><p>Öğrencileri tek tek ekleyebilir veya Excel / CSV dosyasından toplu aktarabilirsiniz.</p><div class="row" style="justify-content:center"><button type="button" class="btn btn-primary" data-act="addstudent">${icon('plus')} Öğrenci ekle</button><button type="button" class="btn" data-act="import">${icon('upload')} Dosyadan aktar</button></div></div></div>`}
        <button type="button" class="btn btn-primary resort" data-act="resort" hidden>${icon('sort')} Sıralamayı güncelle</button>`;
    },
    avg(t) {
      return h`<div class="kpi"><div class="kpi-l">Sınıf ortalaması (net)</div><div class="kpi-v ${ui.tone(t.avgNet)}">${ui.signed(t.avgNet)}</div><div class="kpi-s">öğrenci başına</div></div>
        <div class="kpi plus"><div class="kpi-l">Toplam artı</div><div class="kpi-v">${t.plus}</div><div class="kpi-s">ort. ${U.fmtNum(t.avgPlus)}</div></div>
        <div class="kpi minus"><div class="kpi-l">Toplam eksi</div><div class="kpi-v">${t.minus}</div><div class="kpi-s">ort. ${U.fmtNum(t.avgMinus)}</div></div>
        <div class="kpi"><div class="kpi-l">Sınıf toplamı</div><div class="kpi-v ${ui.tone(t.net)}">${ui.signed(t.net, 0)}</div><div class="kpi-s">${t.students} öğrenci</div></div>`;
    },
    rowsHtml(rows, score, cls, q) {
      const nq = U.norm(q);
      return raw(rows
        .map((r, i) => (nq && !U.norm(S.fullName(r.student) + ' ' + r.student.no).includes(nq) ? '' : String(rowHtml(r, i + 1, score, cls))))
        .join(''));
    },
    mount(el, p) {
      const cls = S.classes.get(p.id);
      if (!cls) return;
      S.cfg.lastClassId !== cls.id && (S.cfg.lastClassId = cls.id, S._putCfg());
      const st = this._st;
      const list = () => ui.$('[data-list]', el);
      const refreshView = () => V.refresh();
      const typeOf = (b) => (b.dataset.act === 'plus' ? 'plus' : 'minus');
      // Basılı tutma → neden seç
      let timer = null, held = false;
      const clear = () => { clearTimeout(timer); timer = null; };
      el.addEventListener('pointerdown', (ev) => {
        const b = ev.target.closest('.pm');
        if (!b) return;
        held = false;
        clear();
        timer = setTimeout(() => {
          held = true;
          ui.vibrate(25);
          V.reasonSheet(b.closest('.srow').dataset.sid, typeOf(b));
        }, 520);
      });
      ['pointerup', 'pointerleave', 'pointercancel', 'pointermove'].forEach((t) => el.addEventListener(t, (ev) => { if (t === 'pointermove' && Math.abs(ev.movementX) + Math.abs(ev.movementY) < 3) return; clear(); }));
      el.addEventListener('contextmenu', (ev) => {
        const b = ev.target.closest('.pm');
        if (b) { ev.preventDefault(); V.reasonSheet(b.closest('.srow').dataset.sid, typeOf(b)); }
      });
      el.addEventListener('click', (ev) => {
        const b = ev.target.closest('.pm');
        if (!b) return;
        ev.preventDefault();
        if (held) { held = false; return; }
        const sid = b.closest('.srow').dataset.sid;
        V.pointFor(sid, typeOf(b));
      });
      ui.delegate(el, {
        addstudent: () => V.studentModal(cls.id),
        import: () => V.importModal(cls.id),
        hint: () => { S.setCfg({ hintDismissed: true }); },
        undo: () => { const e = S.undoLast(); if (e) { const s = S.students.get(e.studentId); ui.toast(`${s ? S.fullName(s) : 'Öğrenci'}: son puan geri alındı`); } },
        resort: () => refreshView(),
        attend: () => V.attendanceModal(cls.id),
        cmenu: (b) => ui.menu(b, [
          { label: 'Yoklama al', icon: 'check', act: () => V.attendanceModal(cls.id) },
          { label: 'Sınıfı düzenle', icon: 'edit', act: () => V.classModal(cls) },
          { label: 'Excel / CSV’den öğrenci aktar', icon: 'upload', act: () => V.importModal(cls.id) },
          { sep: true },
          { header: 'Liste ve çıktı' },
          { label: 'Puanlı öğrenci listesi…', icon: 'file', act: () => V.exportMenu(b, () => OGR.docs.roster(cls.id, 'scores', S.classPref(cls.id).period)) },
          { label: 'Boş sınıf çizelgesi…', icon: 'table', act: () => V.exportMenu(b, () => OGR.docs.roster(cls.id, 'blank')) },
          { label: 'Sınıf raporu', icon: 'chart', act: () => V.go('rapor', cls.id) },
          { sep: true },
          { label: 'Sınıfı sil', icon: 'trash', danger: true, act: async () => { if (await V.deleteClass(cls)) V.go(''); } },
        ]),
      });
      ui.$('[data-q]', el).addEventListener('input', (ev) => {
        st.q = ev.target.value;
        const l = list();
        if (!l) return;
        const pref = S.classPref(cls.id);
        const cs = S.classStats(cls.id, R.listFilter(pref.period));
        l.innerHTML = String(this.rowsHtml(sortRows(cs.rows, pref.sort), SCORE_SORT.has(pref.sort), cls, st.q));
        ui.$('[data-none]', el).hidden = !!l.children.length;
      });
      ui.$('[data-sort]', el).addEventListener('change', (ev) => { S.setClassPref(cls.id, { sort: ev.target.value }); refreshView(); });
      ui.$('[data-period]', el).addEventListener('change', (ev) => { S.setClassPref(cls.id, { period: ev.target.value }); refreshView(); });
    },
    // Olay: tek öğrencinin satırını yerinde güncelle (satır yerinden oynamaz)
    change(ev, el, p) {
      if (ev.kind !== 'events' || ev.classId !== p.id) return false;
      const cls = S.classes.get(p.id);
      const pref = S.classPref(cls.id);
      const cs = S.classStats(cls.id, R.listFilter(pref.period));
      const score = SCORE_SORT.has(pref.sort);
      const li = ui.$(`[data-sid="${ev.studentId}"]`, el);
      const r = cs.rows.find((x) => x.student.id === ev.studentId);
      if (!li || !r) return false;
      const pos = this._st.order.indexOf(ev.studentId) + 1;
      const fresh = ui.frag(String(rowHtml(r, pos, score, cls)));
      li.replaceWith(fresh);
      if (ev.op === 'add') {
        fresh.classList.add(r && S.events.get(ev.id).type === 'plus' ? 'flash-plus' : 'flash-minus');
        setTimeout(() => fresh.classList.remove('flash-plus', 'flash-minus'), 450);
      }
      ui.$('[data-avg]', el).innerHTML = String(this.avg(cs.totals));
      const u = ui.$('[data-act=undo]', el);
      if (u) u.disabled = !S.canUndo();
      if (score) {
        const order = sortRows(cs.rows, pref.sort).map((x) => x.student.id);
        const same = order.length === this._st.order.length && order.every((id, i) => id === this._st.order[i]);
        ui.$('[data-act=resort]', el).hidden = same;
      }
      return true;
    },
  };
})();

/* js/ui/views/attendance.js */
/* E+ · Davranış (sözlü) notu 0–100 + devamsızlık / yoklama pencereleri. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const ui = OGR.ui;
  const U = OGR.util;
  const S = OGR.store;
  const { h, icon } = ui;
  const V = (OGR.views = OGR.views || {});

  const TYPES = [['', 'Var'], ['unexcused', 'Özürsüz'], ['excused', 'Özürlü'], ['late', 'Geç']];
  V.ABS_LABEL = { unexcused: 'Özürsüz', excused: 'Özürlü', late: 'Geç' };
  V.dayTr = (d) => String(d).split('-').reverse().join('.');
  V.today = () => U.isoDay(Date.now());
  V.gradeTone = (n) => (n >= 85 ? 't-plus' : n < 50 ? 't-minus' : '');

  // Metin alanına sesle yazma (varsa)
  function wireMic(m, input) {
    const mic = m.$('[data-mic]'), live = m.$('[data-live]');
    if (!mic) return;
    OGR.speech.init().then((k) => { if (k) mic.hidden = false; });
    mic.addEventListener('click', () => {
      if (OGR.speech.active) { OGR.speech.stop(); return; }
      let committed = input.value;
      OGR.speech.start({
        partial: (t) => { live.hidden = !t; live.textContent = t ? '… ' + t : ''; },
        final: (t) => { if (!t) return; committed = (committed && !/\s$/.test(committed) ? committed + ' ' : committed) + t; input.value = committed; live.hidden = true; },
        state: (s) => { const on = s === 'listening'; mic.setAttribute('aria-pressed', String(on)); mic.classList.toggle('btn-danger', on); mic.lastElementChild.textContent = on ? 'Dinleniyor… durdur' : 'Sesle yaz'; if (!on) live.hidden = true; },
        error: (e) => ui.toast(e, { kind: 'error', ms: 5000 }),
      });
    });
    m.el.addEventListener('click', () => {}, { once: true });
  }
  const micRow = () => h`<p class="field-help" data-live hidden aria-live="polite"></p><div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn btn-sm" type="button" data-mic hidden aria-pressed="false">${icon('mic')} <span>Sesle yaz</span></button></div>`;

  /* ---------- Davranış notu ---------- */
  V.gradeModal = function (studentId, g) {
    const s = S.students.get(studentId);
    if (!s) return;
    const quick = [100, 90, 80, 70, 60, 50];
    ui.modal({
      title: g ? 'Davranış notunu düzenle' : 'Davranış notu ver',
      body: h`<p class="muted" style="margin-bottom:12px">${S.fullName(s)}</p>
        <div class="field"><label for="gs">Puan (0–100)</label><input id="gs" class="input" name="score" type="number" inputmode="decimal" min="0" max="100" step="0.1" value="${g ? g.score : ''}" placeholder="örn. 85" data-autofocus></div>
        <div class="row" style="flex-wrap:wrap;gap:6px;margin:-4px 0 12px">${quick.map((q) => h`<button type="button" class="chip" data-q="${q}">${q}</button>`)}</div>
        <div class="field"><label for="gr">Sebep</label><textarea id="gr" class="textarea" name="reason" maxlength="200" style="min-height:70px" placeholder="Örn. Derste çok iyi katılım gösterdi">${g ? g.reason || '' : ''}</textarea></div>
        ${micRow()}<p class="form-error" data-error role="alert"></p>`,
      footer: h`<button class="btn" data-close type="button">Vazgeç</button><button class="btn btn-primary" data-ok type="button">Kaydet</button>`,
      onMount(m) {
        m.$$('[data-q]').forEach((b) => (b.onclick = () => { m.$('#gs').value = b.dataset.q; }));
        wireMic(m, m.$('#gr'));
        m.$('[data-ok]').onclick = () => {
          try {
            const o = { score: m.$('#gs').value, reason: m.$('#gr').value };
            if (g) S.updateGrade(g.id, o); else S.addGrade(studentId, o);
            m.close();
            ui.toast(g ? 'Davranış notu güncellendi' : 'Davranış notu eklendi');
          } catch (x) { m.error(x.message); }
        };
      },
    });
  };

  /* ---------- Tek öğrenci için devamsızlık kaydı ---------- */
  V.absenceModal = function (studentId, day) {
    const s = S.students.get(studentId);
    if (!s) return;
    const cur = day ? S.absenceOn(studentId, day) : null;
    ui.modal({
      title: cur ? 'Devamsızlığı düzenle' : 'Devamsızlık ekle',
      body: h`<p class="muted" style="margin-bottom:12px">${S.fullName(s)}</p>
        <div class="field"><label for="ad">Tarih</label><input id="ad" class="input" type="date" value="${day || V.today()}" max="2100-12-31"></div>
        <div class="field"><label>Tür</label><div class="seg" role="group" aria-label="Tür">${['unexcused', 'excused', 'late'].map((t) => h`<button type="button" data-t="${t}" aria-pressed="${(cur ? cur.type : 'unexcused') === t}">${V.ABS_LABEL[t]}</button>`)}</div></div>
        <div class="field"><label for="an">Not (isteğe bağlı)</label><input id="an" class="input" maxlength="200" value="${cur ? cur.note || '' : ''}" placeholder="Örn. Raporlu"></div>
        ${micRow()}<p class="form-error" data-error role="alert"></p>`,
      footer: h`${cur ? h`<button class="btn btn-danger" data-del type="button" style="margin-right:auto">Kaydı sil</button>` : ''}<button class="btn" data-close type="button">Vazgeç</button><button class="btn btn-primary" data-ok type="button">Kaydet</button>`,
      onMount(m) {
        let type = cur ? cur.type : 'unexcused';
        m.$$('[data-t]').forEach((b) => (b.onclick = () => { type = b.dataset.t; m.$$('[data-t]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));
        wireMic(m, m.$('#an'));
        m.$('[data-ok]').onclick = () => {
          try {
            const d = m.$('#ad').value;
            if (cur && d !== cur.day) S.setAbsence(studentId, cur.day, null);
            S.setAbsence(studentId, d, type, m.$('#an').value);
            m.close();
            ui.toast('Devamsızlık kaydedildi');
          } catch (x) { m.error(x.message); }
        };
        const del = m.$('[data-del]');
        if (del) del.onclick = () => { const r = S.setAbsence(studentId, cur.day, null); m.close(); ui.toast('Devamsızlık kaydı silindi', { action: { label: 'Geri al', fn: () => r && S.restoreAbsence(r) }, ms: 7000 }); };
      },
    });
  };

  /* ---------- Sınıf yoklaması ---------- */
  V.attendanceModal = function (classId) {
    const cls = S.classes.get(classId);
    if (!cls) return;
    let day = V.today();
    const listHtml = () => {
      const att = S.attendanceOn(classId, day);
      const studs = S.studentsOf(classId);
      if (!studs.length) return h`<div class="empty"><p>Bu sınıfta öğrenci yok.</p></div>`;
      return h`<ul class="attlist">${studs.map((s) => {
        const a = att.get(s.id);
        const t = a ? a.type : '';
        return h`<li data-sid="${s.id}"><span class="aname">${s.no ? h`<small class="faint">${s.no}</small> ` : ''}${S.fullName(s)}</span><div class="seg" role="group" aria-label="${S.fullName(s)} yoklama">${TYPES.map(([v, l]) => h`<button type="button" data-v="${v}" class="at-${v || 'ok'}" aria-pressed="${t === v}">${l}</button>`)}</div></li>`;
      })}</ul>`;
    };
    const sumHtml = () => {
      const att = S.attendanceOn(classId, day);
      let u = 0, e = 0, l = 0;
      att.forEach((a) => { if (a.type === 'unexcused') u++; else if (a.type === 'excused') e++; else l++; });
      const n = S.studentsOf(classId).length;
      return `${n - att.size} var · ${u} özürsüz · ${e} özürlü · ${l} geç`;
    };
    ui.modal({
      title: `Yoklama · ${S.classFull(cls)}`,
      size: 'lg',
      body: h`<div class="row" style="margin-bottom:10px;gap:10px;flex-wrap:wrap"><input class="input" type="date" data-day value="${day}" aria-label="Yoklama günü" style="max-width:190px"><button type="button" class="btn btn-sm" data-allok>Hepsi var</button><span class="muted grow" data-sum aria-live="polite">${sumHtml()}</span></div><div data-list>${listHtml()}</div><p class="form-error" data-error role="alert"></p>`,
      footer: h`<button class="btn btn-primary" data-close type="button">Bitti</button>`,
      onMount(m) {
        const redraw = () => { m.$('[data-list]').innerHTML = String(listHtml()); m.$('[data-sum]').textContent = sumHtml(); };
        m.$('[data-day]').addEventListener('change', (e) => { if (e.target.value) { day = e.target.value; redraw(); } });
        m.$('[data-allok]').onclick = () => {
          const att = S.attendanceOn(classId, day);
          try { att.forEach((a, sid) => S.setAbsence(sid, day, null)); redraw(); ui.toast('Hepsi var olarak işaretlendi'); } catch (x) { m.error(x.message); }
        };
        m.$('[data-list]').addEventListener('click', (e) => {
          const b = e.target.closest('[data-v]');
          if (!b) return;
          const sid = b.closest('li').dataset.sid;
          try { S.setAbsence(sid, day, b.dataset.v || null); redraw(); } catch (x) { m.error(x.message); }
        });
      },
    });
  };
})();

/* js/ui/views/student.js */
/* E+ · Öğrenci ayrıntı sayfası: toplamlar, performans grafikleri, geçmiş, notlar. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const ui = OGR.ui;
  const U = OGR.util;
  const S = OGR.store;
  const R = OGR.reports;
  const C = OGR.charts;
  const { h, raw, icon } = ui;
  const V = (OGR.views = OGR.views || {});

  const st = { id: null, termId: 'current', type: '', voided: false, shown: 30 };

  function histItem(e) {
    const label = e.reason || 'Neden belirtilmedi';
    return h`<li class="${e.voided ? 'is-void' : ''}"><span class="badge ${e.type}">${icon(e.type === 'plus' ? 'plus' : 'minus')}</span>
      <div style="min-width:0"><div class="what"><b>${e.type === 'plus' ? 'Artı' : 'Eksi'}</b> · ${label}</div><div class="when">${U.fmtDayLong(e.ts)} · ${U.fmtTime(e.ts)}${e.voided ? ' · geri alındı' : ''}</div></div>
      <button type="button" class="icon-btn sm" data-act="evmenu" data-id="${e.id}" aria-label="İşlem seçenekleri">${icon('more')}</button></li>`;
  }

  V.studentView = {
    title: (p) => { const s = S.students.get(p.id); return s ? S.fullName(s) : 'Öğrenci'; },
    render(p) {
      const s = S.students.get(p.id);
      if (!s) return h`<div class="card"><div class="empty"><div class="empty-i">${icon('user')}</div><h3>Öğrenci bulunamadı</h3><a class="btn btn-primary" href="#">Sınıflarıma dön</a></div></div>`;
      if (st.id !== s.id) Object.assign(st, { id: s.id, termId: 'current', type: '', voided: false, shown: 30 });
      if (st.termId !== 'current' && st.termId !== 'all' && !S.terms.has(st.termId)) st.termId = 'current';
      const cls = S.classes.get(s.classId);
      const sum = R.studentSummary(s.id, { termId: st.termId });
      const t = sum.totals;
      const evs = S.queryEvents({ studentId: s.id, termId: st.termId, type: st.type || undefined, voided: st.voided ? 'all' : 'no' });
      const notes = S.notesOf(s.id);
      const tidNow = st.termId === 'current' ? S.cfg.currentTermId : st.termId;
      const grs = S.gradesOf(s.id).filter((g) => tidNow === 'all' || g.termId === tidNow);
      const abs = S.absencesOf(s.id).filter((a) => tidNow === 'all' || a.termId === tidNow);
      const pr = S.sortedReasons('plus'), mr = S.sortedReasons('minus');
      const series = (u, n, title) => C.card(title, { type: 'columns', unit: u, buckets: R.studentSeries(s.id, u, n).buckets });
      const termOpts = [['current', 'Bu dönem (' + ((S.currentTerm() || {}).name || '') + ')'], ['all', 'Tüm dönemler']].concat(S.sortedTerms().filter((x) => x.id !== S.cfg.currentTermId).map((x) => [x.id, 'Arşiv: ' + x.name]));
      const mk = (a) => h`<td class="r t-plus">${a.plus}</td><td class="r t-minus">${a.minus}</td><td class="r"><b class="${ui.tone(a.net)}">${ui.signed(a.net, 0)}</b></td>`;
      return h`
        <a class="crumb" href="#sinif-${s.classId}">${icon('chevL')} ${cls ? S.className(cls) : 'Sınıf'}</a>
        <div class="shero" style="${cls ? ui.coverVar(cls) : ''};margin-bottom:16px">
          <div class="sbadge">${U.initials(s.first, s.last)}</div>
          <div class="grow"><h1 style="font-size:26px">${S.fullName(s)}</h1><p class="muted">${s.no ? 'Okul no ' + s.no + ' · ' : ''}${cls ? S.classFull(cls) : ''}</p></div>
          <div class="row"><select class="select sm" data-term aria-label="Dönem" style="width:auto;max-width:260px">${termOpts.map(([v, l]) => h`<option value="${v}" ${v === st.termId ? 'selected' : ''}>${l}</option>`)}</select>
          <button type="button" class="icon-btn" data-act="smenu" aria-label="Öğrenci seçenekleri" style="border:1px solid var(--line-2);background:var(--surface)">${icon('more')}</button></div>
        </div>
        <div class="bigpm" style="margin-bottom:10px"><button type="button" class="pm pm-minus" data-act="minus">${icon('minus')} Eksi ver</button><button type="button" class="pm pm-plus" data-act="plus">${icon('plus')} Artı ver</button></div>
        <details class="card card-flat" style="margin-bottom:16px"><summary style="cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center">Nedenle puan ver</summary>
          <div class="cols2" style="margin-top:12px"><div><div class="section-t" style="margin-bottom:8px">Artı nedenleri</div><div class="reasons" style="grid-template-columns:1fr">${pr.map((r) => h`<button type="button" class="reason plus" data-act="rplus" data-r="${r.id}">${icon('plus')}<span>${r.label}</span></button>`)}</div></div>
          <div><div class="section-t" style="margin-bottom:8px">Eksi nedenleri</div><div class="reasons" style="grid-template-columns:1fr">${mr.map((r) => h`<button type="button" class="reason minus" data-act="rminus" data-r="${r.id}">${icon('minus')}<span>${r.label}</span></button>`)}</div></div></div></details>
        <div class="kpis" style="margin-bottom:16px">
          <div class="kpi plus"><div class="kpi-l">Toplam artı</div><div class="kpi-v">${t.plus}</div></div>
          <div class="kpi minus"><div class="kpi-l">Toplam eksi</div><div class="kpi-v">${t.minus}</div></div>
          <div class="kpi"><div class="kpi-l">Net puan</div><div class="kpi-v ${ui.tone(t.net)}">${ui.signed(t.net, 0)}</div></div>
          <div class="kpi"><div class="kpi-l">Sınıf sırası</div><div class="kpi-v">${sum.rank.rank}<small class="faint" style="font-size:15px"> / ${sum.rank.of}</small></div></div>
          <div class="kpi"><div class="kpi-l">Davranış ort.</div><div class="kpi-v ${sum.grades.count ? V.gradeTone(sum.grades.avg) : ''}">${sum.grades.count ? sum.grades.avg : '—'}</div></div>
          <div class="kpi"><div class="kpi-l">Devamsızlık (gün)</div><div class="kpi-v">${sum.absences.days}<small class="faint" style="font-size:15px"> · ${sum.absences.late} geç</small></div></div>
        </div>
        <div class="cols2" style="margin-bottom:14px">
          <div class="card"><div class="card-h"><h2>Davranış notu</h2><button type="button" class="btn btn-primary btn-sm" data-act="addgrade">${icon('plus')} Not ver</button></div>
            ${grs.length ? h`<p class="muted" style="margin-bottom:8px">Ortalama <b class="${V.gradeTone(sum.grades.avg)}">${sum.grades.avg}</b> · ${sum.grades.count} not · en düşük ${sum.grades.min} · en yüksek ${sum.grades.max}</p><ul class="hist">${grs.slice(0, 20).map((g) => h`<li class="two"><span class="badge gscore ${V.gradeTone(g.score)}">${g.score}</span><div style="min-width:0"><div class="what">${g.reason || 'Sebep yazılmadı'}</div><div class="when">${U.fmtDayLong(g.ts)} · ${U.fmtTime(g.ts)}</div></div><button type="button" class="icon-btn sm" data-act="editgrade" data-id="${g.id}" aria-label="Notu düzenle">${icon('edit')}</button><button type="button" class="icon-btn sm" data-act="delgrade" data-id="${g.id}" aria-label="Notu sil">${icon('trash')}</button></li>`)}</ul>` : h`<p class="muted">Henüz davranış notu yok. 0–100 arası puan ve sebep girebilirsiniz.</p>`}</div>
          <div class="card"><div class="card-h"><h2>Devamsızlık</h2><button type="button" class="btn btn-primary btn-sm" data-act="addabs">${icon('plus')} Ekle</button></div>
            <div class="abssum"><span><b>${sum.absences.unexcused}</b> özürsüz</span><span><b>${sum.absences.excused}</b> özürlü</span><span><b>${sum.absences.late}</b> geç</span></div>
            ${abs.length ? h`<ul class="hist">${abs.slice(0, 20).map((a) => h`<li class="two"><span class="badge abs-${a.type}">${a.type === 'late' ? 'G' : a.type === 'excused' ? 'Ö' : 'D'}</span><div style="min-width:0"><div class="what"><b>${V.ABS_LABEL[a.type]}</b>${a.note ? ' · ' + a.note : ''}</div><div class="when">${V.dayTr(a.day)}</div></div><button type="button" class="icon-btn sm" data-act="editabs" data-day="${a.day}" aria-label="Kaydı düzenle">${icon('edit')}</button><button type="button" class="icon-btn sm" data-act="delabs" data-day="${a.day}" aria-label="Kaydı sil">${icon('trash')}</button></li>`)}</ul>` : h`<p class="muted">Devamsızlık kaydı yok.</p>`}</div>
        </div>
        <div class="cols2 wide-left" style="margin-bottom:14px">
          <div class="card"><div class="card-h"><h2>Dönemsel özet</h2></div><div class="tablewrap"><table class="rt"><thead><tr><th>Aralık</th><th class="r">+</th><th class="r">−</th><th class="r">Net</th></tr></thead><tbody>
            <tr><td>Bugün</td>${mk(sum.today)}</tr><tr><td>Bu hafta</td>${mk(sum.week)}</tr><tr><td>Bu ay</td>${mk(sum.month)}</tr><tr><td><b>Seçili dönem</b></td>${mk(sum.totals)}</tr></tbody></table></div>
            ${sum.byTerm.length > 1 ? h`<div class="section-t" style="margin:14px 0 8px">Dönemlere göre</div><div class="tablewrap"><table class="rt"><tbody>${sum.byTerm.map((x) => h`<tr><td>${x.term.name}</td>${mk(x)}</tr>`)}</tbody></table></div>` : ''}</div>
          <div class="card"><div class="card-h"><h2>Nedenler</h2></div>
            ${this.reasonTable('Artı', sum.reasons.plus, 'plus')}${this.reasonTable('Eksi', sum.reasons.minus, 'minus')}</div>
        </div>
        <div class="stack" style="margin-bottom:14px">
          <div class="card">${raw(series('day', 14, 'Günlük performans · son 14 gün'))}</div>
          <div class="cols2"><div class="card">${raw(series('week', 8, 'Haftalık · son 8 hafta'))}</div><div class="card">${raw(series('month', 6, 'Aylık · son 6 ay'))}</div></div>
        </div>
        <div class="cols2 wide-left">
          <div class="card"><div class="card-h"><h2>Geçmiş</h2><span class="pill">${evs.length} kayıt</span></div>
            <div class="filters"><div class="seg" role="group" aria-label="Tür"><button type="button" data-type="" aria-pressed="${st.type === ''}">Tümü</button><button type="button" data-type="plus" aria-pressed="${st.type === 'plus'}">Artı</button><button type="button" data-type="minus" aria-pressed="${st.type === 'minus'}">Eksi</button></div>
            <label class="check" style="align-items:center"><input type="checkbox" data-voided ${st.voided ? 'checked' : ''}><span>Geri alınanları göster</span></label></div>
            ${evs.length ? h`<ul class="hist">${evs.slice(0, st.shown).map(histItem)}</ul>${evs.length > st.shown ? h`<button class="btn btn-block" style="margin-top:8px" data-act="more">Daha fazla göster (${evs.length - st.shown})</button>` : ''}` : h`<div class="empty" style="padding:22px"><p>Bu filtrede kayıt yok.</p></div>`}</div>
          <div class="card"><div class="card-h"><h2>Öğretmen notları</h2></div>
            <form data-noteform class="stack" style="margin-bottom:12px"><textarea class="textarea" name="text" maxlength="2000" placeholder="Bu öğrenci hakkında not ekleyin…" aria-label="Yeni not" style="min-height:80px"></textarea><p class="field-help" data-live hidden aria-live="polite"></p><div class="row" style="justify-content:flex-end"><button class="btn btn-sm" type="button" data-mic hidden aria-pressed="false">${icon('mic')} <span>Sözlü not</span></button><button class="btn btn-primary btn-sm" type="submit">${icon('plus')} Not ekle</button></div></form>
            ${notes.length ? notes.map((n) => h`<div class="note"><p>${n.text}</p><div class="meta"><span>${U.fmtDateTime(n.ts)}${n.uts && n.uts !== n.ts ? ' · düzenlendi' : ''}</span><span class="spacer"></span><button class="icon-btn sm" data-act="editnote" data-id="${n.id}" aria-label="Notu düzenle">${icon('edit')}</button><button class="icon-btn sm" data-act="delnote" data-id="${n.id}" aria-label="Notu sil">${icon('trash')}</button></div></div>`) : h`<p class="muted">Henüz not yok.</p>`}</div>
        </div>`;
    },
    reasonTable(title, list, tone) {
      if (!list.length) return h`<div class="section-t" style="margin:6px 0 6px">${title}</div><p class="muted" style="margin-bottom:12px">Kayıt yok.</p>`;
      const max = Math.max(...list.map((x) => x.count));
      return h`<div class="section-t" style="margin:6px 0 6px">${title}</div><div style="margin-bottom:14px">${list.map((x) => h`<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin-bottom:8px"><span>${x.label}</span><b class="num">${x.count}</b><div style="grid-column:1/3;height:6px;border-radius:3px;background:var(--surface-3)"><div style="height:100%;width:${Math.max(4, (x.count / max) * 100)}%;border-radius:3px;background:var(--chart-${tone === 'plus' ? 'plus' : 'minus'})"></div></div></div>`)}</div>`;
    },
    mount(el, p) {
      const s = S.students.get(p.id);
      if (!s) return;
      C.wire(el);
      ui.$('[data-term]', el).addEventListener('change', (e) => { st.termId = e.target.value; st.shown = 30; V.refresh(); });
      ui.$$('[data-type]', el).forEach((b) => (b.onclick = () => { st.type = b.dataset.type; st.shown = 30; V.refresh(); }));
      ui.$('[data-voided]', el).addEventListener('change', (e) => { st.voided = e.target.checked; V.refresh(); });
      ui.$('[data-noteform]', el).addEventListener('submit', (e) => {
        e.preventDefault();
        const ta = e.target.elements.text;
        try { S.addNote(s.id, ta.value); ui.toast('Not eklendi'); } catch (x) { V.err(x); }
      });
      // Sözlü not
      const mic = ui.$('[data-mic]', el), ta = ui.$('[name=text]', el), live = ui.$('[data-live]', el);
      OGR.speech.init().then((k) => { if (k && mic) mic.hidden = false; });
      if (mic) mic.addEventListener('click', () => {
        if (OGR.speech.active) { OGR.speech.stop(); return; }
        const base = () => (ta.value && !/\s$/.test(ta.value) ? ta.value + ' ' : ta.value);
        let committed = ta.value;
        OGR.speech.start({
          partial: (t) => { live.hidden = !t; live.textContent = t ? '… ' + t : ''; },
          final: (t) => { if (!t) return; committed = (committed && !/\s$/.test(committed) ? committed + ' ' : committed) + t; ta.value = committed; live.hidden = true; },
          state: (st) => { const on = st === 'listening'; mic.setAttribute('aria-pressed', String(on)); mic.classList.toggle('btn-danger', on); mic.lastElementChild.textContent = on ? 'Dinleniyor… durdur' : 'Sözlü not'; if (!on) live.hidden = true; },
          error: (m) => ui.toast(m, { kind: 'error', ms: 5000 }),
        });
        committed = base();
      });
      ui.delegate(el, {
        plus: () => V.pointFor(s.id, 'plus'),
        minus: () => V.pointFor(s.id, 'minus'),
        rplus: (b) => V.give(s.id, 'plus', b.dataset.r),
        rminus: (b) => V.give(s.id, 'minus', b.dataset.r),
        more: () => { st.shown += 40; V.refresh(); },
        addgrade: () => V.gradeModal(s.id),
        editgrade: (b) => { const g = S.grades.get(b.dataset.id); if (g) V.gradeModal(s.id, g); },
        delgrade: (b) => { const g = S.deleteGrade(b.dataset.id); if (g) ui.toast('Davranış notu silindi', { action: { label: 'Geri al', fn: () => S.restoreGrade(g) }, ms: 7000 }); },
        addabs: () => V.absenceModal(s.id),
        editabs: (b) => V.absenceModal(s.id, b.dataset.day),
        delabs: (b) => { const r = S.setAbsence(s.id, b.dataset.day, null); if (r) ui.toast('Devamsızlık kaydı silindi', { action: { label: 'Geri al', fn: () => S.restoreAbsence(r) }, ms: 7000 }); },
        editnote: (b) => {
          const n = S.notes.get(b.dataset.id);
          const m = ui.modal({
            title: 'Notu düzenle',
            body: h`<div class="field"><label for="ne">Not</label><textarea id="ne" class="textarea" maxlength="2000" data-autofocus>${n.text}</textarea></div><p class="form-error" data-error role="alert"></p>`,
            footer: h`<button class="btn" data-close type="button">Vazgeç</button><button class="btn btn-primary" data-ok type="button">Kaydet</button>`,
            onMount(mm) { mm.$('[data-ok]').onclick = () => { try { S.updateNote(n.id, mm.$('#ne').value); mm.close(); ui.toast('Not güncellendi'); } catch (x) { mm.error(x.message); } }; },
          });
        },
        delnote: (b) => {
          const n = S.deleteNote(b.dataset.id);
          if (n) ui.toast('Not silindi', { action: { label: 'Geri al', fn: () => S.restoreNote(n) }, ms: 7000 });
        },
        evmenu: (b) => {
          const e = S.events.get(b.dataset.id);
          const other = S.sortedReasons(e.type);
          ui.menu(b, [
            e.voided ? { label: 'Geri getir', icon: 'refresh', act: () => { S.restoreEvent(e.id); ui.toast('Puan geri getirildi'); } } : { label: 'Puanı geri al (iptal et)', icon: 'undo', act: () => { S.voidEvent(e.id); ui.toast('Puan geri alındı', { action: { label: 'Vazgeç', fn: () => S.restoreEvent(e.id) } }); } },
            { header: 'Nedeni değiştir' },
            { label: 'Neden belirtilmedi', icon: 'minus', tick: !e.reasonId && !e.reason, act: () => S.setEventReason(e.id, null) },
            ...other.map((r) => ({ label: r.label, icon: e.type === 'plus' ? 'plus' : 'minus', tick: e.reasonId === r.id, act: () => S.setEventReason(e.id, r.id) })),
          ]);
        },
        smenu: (b) => ui.menu(b, [
          { label: 'Düzenle', icon: 'edit', act: () => V.studentModal(s.classId, s) },
          { label: 'Başka sınıfa taşı', icon: 'swap', act: () => V.moveModal(s) },
          { sep: true },
          { header: 'Rapor' },
          { label: 'PDF / Excel / Yazdır…', icon: 'file', act: () => V.exportMenu(b, () => OGR.docs.student(R.studentSummary(s.id, { termId: st.termId }))) },
          { sep: true },
          { label: 'Öğrenciyi sil', icon: 'trash', danger: true, act: async () => { if (await V.deleteStudent(s)) V.go('sinif', s.classId); } },
        ]),
      });
    },
  };
})();

/* js/ui/views/reports.js */
/* E+ · Raporlar: günlük/haftalık/aylık/dönem, sıralama, grafikler, dışa aktarma. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const ui = OGR.ui;
  const U = OGR.util;
  const S = OGR.store;
  const R = OGR.reports;
  const C = OGR.charts;
  const { h, raw, icon } = ui;
  const V = (OGR.views = OGR.views || {});

  const st = { classId: '', kind: 'week', anchor: Date.now(), termId: 'current', from: '', to: '', limit: 25 };
  const KINDS = [['day', 'Günlük'], ['week', 'Haftalık'], ['month', 'Aylık'], ['term', 'Dönem'], ['all', 'Tümü'], ['custom', 'Özel']];

  function build() {
    let kind = st.kind === 'term' ? 'all' : st.kind;
    let custom = null;
    if (kind === 'custom') {
      const a = U.parseISODay(st.from), b = U.parseISODay(st.to);
      if (Number.isFinite(a) && Number.isFinite(b)) custom = { from: a, to: b };
      else kind = 'all';
    }
    return R.build({ classId: st.classId || null, termId: st.kind === 'all' ? 'all' : st.termId, kind, anchor: st.anchor, custom });
  }
  V.currentReport = () => OGR.docs.report(build());

  V.reportView = {
    title: () => 'Raporlar',
    render(p) {
      if (p && p.id && p.id !== st.classId && p.id !== st._seen) { st.classId = S.classes.has(p.id) ? p.id : ''; st._seen = p.id; }
      if (st.classId && !S.classes.has(st.classId)) st.classId = '';
      if (st.termId !== 'current' && st.termId !== 'all' && !S.terms.has(st.termId)) st.termId = 'current';
      const rep = build();
      const t = rep.totals;
      const nav = ['day', 'week', 'month'].includes(st.kind);
      const classes = S.sortedClasses();
      const termOpts = [['current', 'Bu dönem'], ['all', 'Tüm dönemler']].concat(S.sortedTerms().filter((x) => x.id !== S.cfg.currentTermId).map((x) => [x.id, 'Arşiv: ' + x.name]));
      const trendTitle = { hour: 'Saate göre dağılım', day: 'Güne göre dağılım', week: 'Haftaya göre dağılım', month: 'Aya göre dağılım' }[rep.trend.unit];
      const top = rep.ranking.slice(0, 15);

      return h`
        ${V.pageHead('Raporlar', `${rep.scopeLabel} · ${rep.range.label}`, h`<button type="button" class="btn btn-primary" data-act="export">${icon('download')} Dışa aktar</button>`)}

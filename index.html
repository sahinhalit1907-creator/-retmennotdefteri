            ${nav ? h`<div class="field"><span class="label">Tarih</span><div class="datenav"><button type="button" class="icon-btn sm" data-act="prev" aria-label="Önceki">${icon('chevL')}</button><b>${rep.range.label}</b><button type="button" class="icon-btn sm" data-act="next" aria-label="Sonraki">${icon('chevR')}</button></div></div>` : ''}
            ${st.kind === 'custom' ? h`<div class="field"><label for="rf">Başlangıç</label><input id="rf" type="date" class="input" data-f="from" value="${st.from}"></div><div class="field"><label for="rto">Bitiş</label><input id="rto" type="date" class="input" data-f="to" value="${st.to}"></div>` : ''}
          </div>
        </div>
        ${st.kind === 'custom' && !(st.from && st.to) ? h`<div class="banner" style="margin-bottom:14px">${icon('info')}<div>Başlangıç ve bitiş tarihini seçin. Şimdilik tüm zamanlar gösteriliyor.</div></div>` : ''}
        <div class="kpis" style="margin-bottom:14px">
          <div class="kpi plus"><div class="kpi-l">Toplam artı</div><div class="kpi-v">${t.plus}</div></div>
          <div class="kpi minus"><div class="kpi-l">Toplam eksi</div><div class="kpi-v">${t.minus}</div></div>
          <div class="kpi"><div class="kpi-l">Net puan</div><div class="kpi-v ${ui.tone(t.net)}">${ui.signed(t.net, 0)}</div></div>
          <div class="kpi"><div class="kpi-l">Ortalama net</div><div class="kpi-v ${ui.tone(t.avgNet)}">${ui.signed(t.avgNet)}</div><div class="kpi-s">öğrenci başına</div></div>
          <div class="kpi"><div class="kpi-l">Puan alan öğrenci</div><div class="kpi-v">${t.active}<small class="faint" style="font-size:15px"> / ${t.students}</small></div></div>
        </div>
        <div class="card" style="margin-bottom:14px">${raw(C.card(trendTitle, { type: 'columns', unit: rep.trend.unit, buckets: rep.trend.buckets }))}</div>
        <div class="card" style="margin-bottom:14px"><div class="card-h"><h2>Başarı sıralaması</h2><span class="pill">${rep.ranking.length} öğrenci</span></div>
          ${top.length ? raw(C.card('En yüksek 15 öğrenci · artı, eksi ve net', { type: 'diverge', rows: top.map((r) => ({ label: S.fullName(r.student), plus: r.plus, minus: r.minus, net: r.net })) })) : ''}
          ${rep.ranking.length ? h`<div class="tablewrap" style="margin-top:12px"><table class="rt"><thead><tr><th class="c">Sıra</th><th>Öğrenci</th>${rep.multi ? h`<th>Sınıf</th>` : ''}<th class="r">+</th><th class="r">−</th><th class="r">Toplam</th></tr></thead><tbody>${rep.ranking.slice(0, st.limit).map((r) => h`<tr><td class="c"><span class="medal${r.rank <= 3 ? ' r' + r.rank : ''}">${r.rank}</span></td><td><a href="#ogrenci-${r.student.id}">${S.fullName(r.student)}</a></td>${rep.multi ? h`<td>${S.className(r.cls)}</td>` : ''}<td class="r t-plus">${r.plus}</td><td class="r t-minus">${r.minus}</td><td class="r"><b class="${ui.tone(r.net)}">${ui.signed(r.net, 0)}</b></td></tr>`)}</tbody></table></div>${rep.ranking.length > st.limit ? h`<button class="btn btn-block" style="margin-top:8px" data-act="more">Tümünü göster (${rep.ranking.length})</button>` : ''}` : h`<div class="empty"><p>Bu kapsamda öğrenci yok.</p></div>`}</div>
        ${rep.multi && rep.classRows.length > 1 ? h`<div class="card" style="margin-bottom:14px"><div class="card-h"><h2>Sınıfların karşılaştırması</h2></div><div class="tablewrap"><table class="rt"><thead><tr><th>Sınıf</th><th class="r">Öğrenci</th><th class="r">+</th><th class="r">−</th><th class="r">Net</th><th class="r">Öğrenci başına</th></tr></thead><tbody>${rep.classRows.map((c) => h`<tr><td><a href="#sinif-${c.cls.id}">${S.classFull(c.cls)}</a></td><td class="r">${c.students}</td><td class="r t-plus">${c.plus}</td><td class="r t-minus">${c.minus}</td><td class="r"><b class="${ui.tone(c.net)}">${ui.signed(c.net, 0)}</b></td><td class="r"><b class="${ui.tone(c.avgNet)}">${ui.signed(c.avgNet)}</b></td></tr>`)}</tbody></table></div></div>` : ''}
        <div class="cols2"><div class="card"><div class="card-h"><h2>Artı nedenleri</h2></div>${rtable(rep.reasons.plus, 'plus', 'Bu aralıkta artı verilmedi.')}</div>
        <div class="card"><div class="card-h"><h2>Eksi nedenleri</h2></div>${rtable(rep.reasons.minus, 'minus', 'Bu aralıkta eksi verilmedi.')}</div></div>`;
    },
    mount(el) {
      C.wire(el);
      ui.$$('[data-f]', el).forEach((i) => i.addEventListener('change', () => { st[i.dataset.f] = i.value; if (i.dataset.f === 'classId') st._seen = i.value || '-'; V.refresh(); }));
      ui.$$('[data-kind]', el).forEach((b) => (b.onclick = () => { st.kind = b.dataset.kind; st.anchor = Date.now(); st.limit = 25; if (st.kind === 'custom' && !st.from) { st.to = U.isoDay(Date.now()); st.from = U.isoDay(U.addDays(Date.now(), -6)); } V.refresh(); }));
      ui.delegate(el, {
        prev: () => { st.anchor = R.shiftAnchor(st.kind, st.anchor, -1); V.refresh(); },
        next: () => { st.anchor = R.shiftAnchor(st.kind, st.anchor, 1); V.refresh(); },
        more: () => { st.limit = 9999; V.refresh(); },
        export: (b) => V.exportMenu(b, () => V.currentReport()),
      });
    },
  };
})();

/* js/ui/views/import.js */
/* E+ · Excel / CSV'den toplu öğrenci aktarma sihirbazı + öğrenci arama penceresi. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const ui = OGR.ui;
  const U = OGR.util;
  const S = OGR.store;
  const { h, raw, icon } = ui;
  const V = (OGR.views = OGR.views || {});

  const HDR = {
    first: ['ad', 'adi', 'isim', 'ogrenci adi', 'adiniz'],
    last: ['soyad', 'soyadi', 'soyisim', 'soyadiniz'],
    no: ['no', 'numara', 'okul no', 'okul numarasi', 'ogrenci no', 'ogrenci numarasi', 'numarasi', 'okulno'],
    full: ['ad soyad', 'adi soyadi', 'ad soyadi', 'adi soyad', 'ogrenci', 'ogrenci adi soyadi', 'isim soyisim', 'ad ve soyad', 'adsoyad'],
  };
  const colName = (i) => (i < 26 ? String.fromCharCode(65 + i) : String.fromCharCode(64 + Math.floor(i / 26)) + String.fromCharCode(65 + (i % 26)));
  const cellStr = (c) => (c == null ? '' : c instanceof Date ? '' : typeof c === 'number' ? (Number.isInteger(c) ? String(c) : String(c)) : String(c).trim());

  async function parseFile(file) {
    const buf = await file.arrayBuffer();
    const name = file.name.toLowerCase();
    if (/\.xlsx$|\.xlsm$/.test(name)) {
      const wb = await OGR.xlsx.read(buf);
      const sheets = wb.sheets.map((s) => ({ name: s.name, rows: s.rows.map((r) => r.map(cellStr)).filter((r) => r.some((c) => c !== '')) })).filter((s) => s.rows.length);
      if (!sheets.length) throw new Error('Dosyada veri bulunamadı.');
      return sheets;
    }
    if (/\.xls$/.test(name)) throw new Error('Eski .xls biçimi desteklenmiyor. Excel’de “Farklı kaydet” ile .xlsx veya CSV olarak kaydedip tekrar deneyin.');
    const text = OGR.csv.decode(new Uint8Array(buf));
    const { rows } = OGR.csv.parse(text);
    const clean = rows.map((r) => r.map(cellStr)).filter((r) => r.some((c) => c !== ''));
    if (!clean.length) throw new Error('Dosyada veri bulunamadı.');
    return [{ name: 'CSV', rows: clean }];
  }

  function detect(rows) {
    const head = rows[0].map((c) => U.norm(c).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim());
    const find = (keys) => head.findIndex((c) => keys.includes(c));
    const m = { first: find(HDR.first), last: find(HDR.last), no: find(HDR.no), full: find(HDR.full) };
    const hasHeader = Object.values(m).some((i) => i >= 0);
    if (hasHeader) {
      if (m.full >= 0 && m.first < 0) { m.first = -1; } else m.full = m.first >= 0 ? -1 : m.full;
      return { hasHeader, m: { first: m.first, last: m.last, no: m.no, full: m.full } };
    }
    // Başlıksız: sayısal sütun → no, kalan metin sütunları → ad, soyad
    const cols = Math.max(...rows.slice(0, 20).map((r) => r.length));
    const numeric = [], text = [];
    for (let c = 0; c < cols; c++) {
      const vals = rows.slice(0, 20).map((r) => r[c] || '').filter(Boolean);
      (vals.length && vals.every((v) => /^\d{1,12}$/.test(v)) ? numeric : text).push(c);
    }
    const g = { first: -1, last: -1, no: numeric.length ? numeric[0] : -1, full: -1 };
    if (text.length >= 2) { g.first = text[0]; g.last = text[1]; } else if (text.length === 1) g.full = text[0];
    return { hasHeader: false, m: g };
  }

  function toStudents(rows, hasHeader, m) {
    const data = hasHeader ? rows.slice(1) : rows;
    return data.map((r) => {
      const get = (i) => (i >= 0 ? (r[i] || '').trim() : '');
      let first = get(m.first), last = get(m.last);
      if (m.full >= 0) {
        const parts = get(m.full).split(/\s+/).filter(Boolean);
        last = parts.length > 1 ? parts.pop() : '';
        first = parts.join(' ');
      }
      return { first, last, no: get(m.no) };
    });
  }

  V.importModal = function (classId) {
    const cls = S.classes.get(classId);
    if (!cls) return;
    const wz = { sheets: null, sheet: 0, hasHeader: true, m: null, onDup: 'skip', fixCase: true, fname: '' };
    const m = ui.modal({
      title: `Öğrenci aktar · ${S.className(cls)}`,
      size: 'lg',
      body: '',
      persistent: false,
      onMount(mm) { step1(mm); },
    });
    function step1(mm, errMsg) {
      mm.setBody(h`<div class="drop" data-drop><div class="empty-i">${icon('upload')}</div>
        <div><b>Excel (.xlsx) veya CSV dosyası seçin</b><p class="muted">Sütunlar: ad, soyad, okul numarası. Ad ve soyad tek sütunda da olabilir.</p></div>
        <label class="btn btn-primary" for="impf">${icon('folder')} Dosya seç</label><input id="impf" type="file" accept=".xlsx,.xlsm,.csv,.txt,.tsv,text/csv" class="sr-only" data-file>
        <p class="field-help">veya dosyayı buraya sürükleyin</p></div>
        <p class="form-error" data-error role="alert">${errMsg || ''}</p>
        <div class="photo" data-photo hidden><div class="row" style="gap:10px;flex-wrap:wrap;align-items:center"><label class="btn" for="impp">${icon('camera')} Kağıt listeyi fotoğrafla</label><input id="impp" type="file" accept="image/*" capture="environment" class="sr-only" data-pfile><span class="muted grow" data-pnote>Listeyi düz ve aydınlık çekin; okunanları kaydetmeden önce kontrol edersiniz.</span></div></div>
        <div class="row"><button type="button" class="btn btn-sm" data-tpl>${icon('download')} Örnek CSV şablonunu indir</button></div>`);
      mm.el.querySelector('.dialog-f') && mm.el.querySelector('.dialog-f').remove();
      const drop = mm.$('[data-drop]');
      const take = async (file) => {
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) return mm.error('Dosya çok büyük (en fazla 8 MB).');
        try {
          wz.sheets = await parseFile(file);
          wz.fname = file.name;
          wz.sheet = 0;
          step2(mm);
        } catch (e) { mm.error(e.message || 'Dosya okunamadı.'); }
      };
      mm.$('[data-file]').addEventListener('change', (e) => take(e.target.files[0]));
      OGR.ocr.kind().then((k) => {
        const box = mm.$('[data-photo]');
        if (!box) return;
        box.hidden = false;
        if (!k) { mm.$('[data-pfile]').disabled = true; mm.$('[data-pnote]').textContent = 'Fotoğraftan okuma bu sürümde kullanılamıyor (Claude içinde yayınlanan sürümde veya desteklenen tarayıcıda çalışır). Excel/CSV kullanabilirsiniz.'; box.querySelector('label').classList.add('is-disabled'); return; }
        if (k === 'claude') mm.$('[data-pnote]').textContent = 'Fotoğraf, okunması için Claude’a gönderilir. Okunanları kaydetmeden önce kontrol edersiniz.';
        mm.$('[data-pfile]').addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const note = mm.$('[data-pnote]');
          note.textContent = 'Liste okunuyor… birkaç saniye sürebilir.';
          try { photoCheck(mm, await OGR.ocr.read(f), f.name); }
          catch (x) { note.textContent = ''; mm.error((x && x.message) || 'Liste okunamadı.'); }
        });
      });
      ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('is-over'); }));
      ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('is-over'); }));
      drop.addEventListener('drop', (e) => take(e.dataTransfer.files[0]));
      mm.$('[data-tpl]').onclick = () => OGR.export.save('\ufeffAd;Soyad;Okul No\r\nAyşe;Yılmaz;101\r\nMehmet;Kaya;102\r\n', 'ogrenci-sablon.csv', 'text/csv;charset=utf-8');
    }
    // Okunan listeyi düzenlenebilir metin olarak göster (No;Ad;Soyad), sonra mevcut aktarım adımına ver
    function photoCheck(mm, list, fname) {
      if (!list.length) { step1(mm, 'Fotoğrafta öğrenci adı okunamadı. Daha net ve düz bir fotoğraf deneyin.'); return; }
      const text = list.map((x) => [x.no, x.first, x.last].join(';')).join('\n');
      mm.setBody(h`<div class="row"><b>Okunan liste</b><span class="pill" data-cnt>${list.length} öğrenci</span></div>
        <p class="muted">Her satır: <b>numara;ad;soyad</b>. Yanlış okunanları düzeltin, fazlaları silin, eksikleri ekleyin.</p>
        <textarea class="textarea" data-ptext spellcheck="false" style="min-height:260px;font-family:ui-monospace,monospace;font-size:14px" aria-label="Okunan öğrenci listesi">${text}</textarea>
        <p class="form-error" data-error role="alert"></p>
        <div class="row" style="justify-content:space-between"><button class="btn" data-back type="button">Geri</button><button class="btn btn-primary" data-pgo type="button">${icon('check')} Devam</button></div>`);
      const ta = mm.$('[data-ptext]');
      const parse = () => ta.value.split(/\r?\n/).map((l) => l.split(';').map((c) => c.trim())).filter((r) => r.some(Boolean)).map((r) => [r[0] || '', r[1] || '', r[2] || '']);
      ta.addEventListener('input', () => { mm.$('[data-cnt]').textContent = parse().length + ' öğrenci'; });
      mm.$('[data-back]').onclick = () => step1(mm);
      mm.$('[data-pgo]').onclick = () => {
        const rows = parse();
        if (!rows.length) return mm.error('Liste boş.');
        wz.sheets = [{ name: 'Fotoğraf', rows: [['No', 'Ad', 'Soyad']].concat(rows) }];
        wz.fname = 'Fotoğraftan okunan liste';
        wz.sheet = 0; wz.m = null;
        step2(mm);
      };
    }
    function step2(mm) {
      const rows = wz.sheets[wz.sheet].rows;
      if (!wz.m || wz._sheetFor !== wz.sheet) {
        const d = detect(rows);
        wz.hasHeader = d.hasHeader;
        wz.m = d.m;
        wz._sheetFor = wz.sheet;
      }
      const cols = Math.max(...rows.slice(0, 50).map((r) => r.length));
      const opt = (sel, allowNone) => h`${allowNone ? h`<option value="-1" ${sel < 0 ? 'selected' : ''}>— kullanma —</option>` : ''}${Array.from({ length: cols }, (_, i) => h`<option value="${i}" ${sel === i ? 'selected' : ''}>Sütun ${colName(i)}${rows[0][i] ? ' · ' + rows[0][i].slice(0, 18) : ''}</option>`)}`;
      const students = toStudents(rows, wz.hasHeader, wz.m);
      const byNo = new Set(S.studentsOf(classId).filter((s) => s.no).map((s) => s.no));
      const byName = new Set(S.studentsOf(classId).map((s) => U.norm(s.first) + '|' + U.norm(s.last)));
      let nAdd = 0, nDup = 0, nBad = 0;
      const seenNo = new Set(), seenName = new Set();
      const status = students.map((s) => {
        const f = wz.fixCase ? U.titleCaseTR(s.first) : s.first, l = wz.fixCase ? U.titleCaseTR(s.last) : s.last;
        if (!f && !l) { nBad++; return 'bad'; }
        const key = U.norm(f) + '|' + U.norm(l);
        const dup = s.no ? byNo.has(s.no) || seenNo.has(s.no) : byName.has(key) || seenName.has(key);
        if (dup) { nDup++; return 'dup'; }
        if (s.no) seenNo.add(s.no);
        seenName.add(key);
        nAdd++;
        return 'new';
      });
      mm.setBody(h`
        <div class="row"><b>${wz.fname}</b><span class="pill">${students.length} satır</span>${wz.sheets.length > 1 ? h`<select class="select sm" data-sheet style="width:auto" aria-label="Sayfa">${wz.sheets.map((s, i) => h`<option value="${i}" ${i === wz.sheet ? 'selected' : ''}>${s.name}</option>`)}</select>` : ''}<span class="spacer"></span><button class="btn btn-sm" data-back type="button">Başka dosya</button></div>
        <label class="check"><input type="checkbox" data-hdr ${wz.hasHeader ? 'checked' : ''}><span>İlk satır başlık satırı</span></label>
        <div class="maps">
          <div class="field"><label>${wz.m.full >= 0 ? 'Ad soyad (tek sütun)' : 'Ad sütunu'}</label><select class="select" data-m="${wz.m.full >= 0 ? 'full' : 'first'}">${opt(wz.m.full >= 0 ? wz.m.full : wz.m.first, true)}</select></div>
          ${wz.m.full >= 0 ? '' : h`<div class="field"><label>Soyad sütunu</label><select class="select" data-m="last">${opt(wz.m.last, true)}</select></div>`}
          <div class="field"><label>Okul numarası</label><select class="select" data-m="no">${opt(wz.m.no, true)}</select></div>
        </div>
        <label class="check"><input type="checkbox" data-full ${wz.m.full >= 0 ? 'checked' : ''}><span>Ad ve soyad tek sütunda (son sözcük soyadı sayılır)</span></label>
        <div class="form-grid two">
          <div class="field"><label>Yinelenen öğrenciler</label><select class="select" data-dup><option value="skip" ${wz.onDup === 'skip' ? 'selected' : ''}>Atla</option><option value="update" ${wz.onDup === 'update' ? 'selected' : ''}>Ad/soyadı güncelle</option></select><span class="field-help">Aynı numara (yoksa aynı ad-soyad) varsa yinelenmiş sayılır.</span></div>
          <label class="check" style="align-self:center"><input type="checkbox" data-case ${wz.fixCase ? 'checked' : ''}><span>Adları düzgün büyük/küçük harfe çevir</span></label>
        </div>
        <div class="preview"><table><thead><tr><th></th><th>Ad</th><th>Soyad</th><th>No</th><th>Durum</th></tr></thead><tbody>${students.slice(0, 8).map((s, i) => h`<tr class="${status[i] === 'bad' ? 'bad' : status[i] === 'dup' ? 'dup' : ''}"><td>${i + 1}</td><td>${s.first}</td><td>${s.last}</td><td>${s.no}</td><td>${status[i] === 'new' ? 'Eklenecek' : status[i] === 'dup' ? 'Yinelenen' : 'Ad boş'}</td></tr>`)}</tbody></table></div>
        <p class="muted"><b class="t-plus">${nAdd}</b> eklenecek · <b>${nDup}</b> yinelenen · <b class="${nBad ? 't-minus' : ''}">${nBad}</b> hatalı satır</p>
        <p class="form-error" data-error role="alert"></p>
        <div class="row" style="justify-content:flex-end"><button class="btn" data-close type="button">Vazgeç</button><button class="btn btn-primary" data-go type="button" ${nAdd + (wz.onDup === 'update' ? nDup : 0) ? '' : 'disabled'}>${icon('check')} ${nAdd} öğrenciyi aktar</button></div>`);
      mm.$('[data-back]').onclick = () => step1(mm);
      const sh = mm.$('[data-sheet]');
      if (sh) sh.onchange = () => { wz.sheet = +sh.value; wz.m = null; step2(mm); };
      mm.$('[data-hdr]').onchange = (e) => { wz.hasHeader = e.target.checked; step2(mm); };
      mm.$$('[data-m]').forEach((s) => (s.onchange = () => { wz.m[s.dataset.m] = +s.value; step2(mm); }));
      mm.$('[data-full]').onchange = (e) => {
        if (e.target.checked) { wz.m.full = wz.m.first >= 0 ? wz.m.first : Math.max(0, wz.m.full); wz.m.first = -1; wz.m.last = -1; }
        else { wz.m.first = wz.m.full; wz.m.full = -1; wz.m.last = wz.m.first + 1 < cols ? wz.m.first + 1 : -1; }
        step2(mm);
      };
      mm.$('[data-dup]').onchange = (e) => { wz.onDup = e.target.value; step2(mm); };
      mm.$('[data-case]').onchange = (e) => { wz.fixCase = e.target.checked; step2(mm); };
      mm.$('[data-go]').onclick = () => {
        try {
          const res = S.importStudents(classId, students, { onDuplicate: wz.onDup, fixCase: wz.fixCase });
          step3(mm, res);
        } catch (e) { mm.error(e.message); }
      };
    }
    function step3(mm, res) {
      mm.setBody(h`<div class="empty"><div class="empty-i">${icon('check')}</div><h3>Aktarma tamamlandı</h3>
        <p><b class="t-plus">${res.added}</b> öğrenci eklendi${res.updated ? ` · ${res.updated} güncellendi` : ''}${res.skipped ? ` · ${res.skipped} yinelenen atlandı` : ''}${res.errors.length ? ` · ${res.errors.length} satır hatalı` : ''}.</p>
        <button class="btn btn-primary" data-close type="button">Tamam</button></div>`);
    }
  };

  /* ---------- Arama ---------- */
  V.searchModal = function () {
    if (!S.uid) return;
    const m = ui.modal({
      title: 'Öğrenci ara',
      body: h`<div class="field"><input class="input" type="search" data-q placeholder="Ad, soyad veya okul numarası…" aria-label="Öğrenci ara" autocomplete="off" data-autofocus></div><div class="sresults" data-res role="list"><p class="muted" style="padding:8px">${S.students.size} öğrenci içinde arayın.</p></div>`,
      onMount(mm) {
        const res = mm.$('[data-res]');
        const draw = () => {
          const q = mm.$('[data-q]').value.trim();
          if (!q) { res.innerHTML = `<p class="muted" style="padding:8px">${S.students.size} öğrenci içinde arayın.</p>`; return; }
          const list = S.search(q, 30);
          res.innerHTML = list.length
            ? list.map((r) => String(h`<button type="button" class="sres" role="listitem" data-id="${r.student.id}" style="${r.cls ? ui.coverVar(r.cls) : ''}"><span class="cc">${r.cls ? S.className(r.cls) : '?'}</span><span class="grow ellipsis"><b>${S.fullName(r.student)}</b><br><small class="faint">${r.student.no ? 'No ' + r.student.no : 'Numara yok'}${r.cls && r.cls.label ? ' · ' + r.cls.label : ''}</small></span>${icon('chevR')}</button>`)).join('')
            : '<p class="muted" style="padding:8px">Eşleşen öğrenci bulunamadı.</p>';
        };
        mm.$('[data-q]').addEventListener('input', draw);
        mm.$('[data-q]').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const f = res.querySelector('.sres'); if (f) f.click(); } });
        res.addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) { mm.close(); V.go('ogrenci', b.dataset.id); } });
      },
    });
  };
})();

/* js/ui/views/settings.js */
/* E+ · Ayarlar: profil, güvenlik, görünüm, nedenler, dönemler, yedekleme. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const ui = OGR.ui;
  const U = OGR.util;
  const S = OGR.store;
  const A = OGR.auth;
  const { h, raw, icon } = ui;
  const V = (OGR.views = OGR.views || {});

  const sect = (id, title, sub, body) => h`<section class="card" id="set-${id}" style="margin-bottom:14px"><div class="card-h" style="margin-bottom:4px"><h2>${title}</h2></div>${sub ? h`<p class="muted" style="margin-bottom:8px">${sub}</p>` : ''}<div class="sgroup">${body}</div></section>`;
  const row = (t, d, ctl) => h`<div class="setting"><div><div class="t">${t}</div>${d ? h`<div class="d">${d}</div>` : ''}</div><div class="ctl">${ctl}</div></div>`;
  const sw = (key, checked, label) => h`<label class="switch"><input type="checkbox" data-cfg="${key}" ${checked ? 'checked' : ''} aria-label="${label}"><i></i></label>`;
  const fmtSize = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
  const KIND = { auto: 'Otomatik', manual: 'Elle', before: 'Öncesi' };

  // Parola isteyen işlemler için ortak pencere
  function askPassword(title, text) {
    return new Promise((resolve) => {
      let done = false;
      ui.modal({
        title,
        body: h`<form data-f class="stack"><p class="muted">${text}</p><div class="field"><label for="ap">Parolanız</label><input id="ap" class="input" type="password" autocomplete="current-password" maxlength="128" data-autofocus></div><p class="form-error" data-error role="alert"></p></form>`,
        footer: h`<button class="btn" data-close type="button">Vazgeç</button><button class="btn btn-primary" data-ok type="button">Onayla</button>`,
        onClose: () => { if (!done) resolve(false); },
        onMount(m) {
          const go = async () => {
            try {
              if (await A.verifyPassword(S.account, m.$('#ap').value)) { done = true; m.close(); resolve(true); } else m.error('Parola hatalı.');
            } catch (e) { m.error(e.message); }
          };
          m.$('[data-ok]').onclick = go;
          m.$('form').addEventListener('submit', (e) => { e.preventDefault(); go(); });
        },
      });
    });
  }
  function showRecovery(code, title) {
    const shown = A.formatRecovery(code);
    ui.modal({
      title: title || 'Yeni kurtarma kodunuz',
      persistent: true,
      body: h`<p>Eski kodunuz geçersiz oldu. Yeni kodu güvenli bir yere kaydedin; yalnızca şimdi gösterilir.</p><div class="recovery">${shown}</div>
        <div class="row"><button class="btn btn-sm" data-copy type="button">${icon('copy')} Kopyala</button><button class="btn btn-sm" data-save type="button">${icon('download')} İndir</button></div>
        <label class="check"><input type="checkbox" data-ack><span>Kodu kaydettim.</span></label>`,
      footer: h`<button class="btn btn-primary" data-close data-done type="button" disabled>Tamam</button>`,
      onMount(m) {
        m.$('[data-ack]').onchange = (e) => { m.$('[data-done]').disabled = !e.target.checked; };
        m.$('[data-copy]').onclick = async () => { try { await navigator.clipboard.writeText(shown); ui.toast('Kopyalandı'); } catch (e) { ui.toast('Kopyalanamadı', { kind: 'error' }); } };
        m.$('[data-save]').onclick = () => OGR.export.save(`E+ kurtarma kodu\r\nHesap: ${S.account.email}\r\nKod: ${shown}\r\n`, 'E+-kurtarma-kodu.txt', 'text/plain;charset=utf-8');
      },
    });
  }

  const actions = {
    profile(b, el) {
      const f = ui.$('[data-profile]', el);
      const v = ui.formData(f);
      A.updateProfile(S.account, v).then(() => { S._changed('cfg', {}); ui.toast('Profil kaydedildi'); }, V.err);
    },
    async changepw() {
      ui.modal({
        title: 'Parolayı değiştir',
        body: h`<form data-f class="stack">${ui.field({ id: 'p0', label: 'Mevcut parola', type: 'password', ac: 'current-password', af: true, max: 128 })}${ui.field({ id: 'p1', label: 'Yeni parola', type: 'password', ac: 'new-password', max: 128, help: 'En az 8 karakter; harf ve rakam içermeli.' })}${ui.field({ id: 'p2', label: 'Yeni parola (tekrar)', type: 'password', ac: 'new-password', max: 128 })}<p class="form-error" data-error role="alert"></p></form>`,
        footer: h`<button class="btn" data-close type="button">Vazgeç</button><button class="btn btn-primary" data-ok type="button">Değiştir</button>`,
        onMount(m) {
          const go = async () => {
            const v = ui.formData(m.$('form'));
            try {
              if (v.p1 !== v.p2) return m.error('Yeni parolalar aynı değil.');
              A.validatePassword(v.p1);
              if (!(await A.verifyPassword(S.account, v.p0))) return m.error('Mevcut parola hatalı.');
              const code = await A.setPassword(S.account, v.p1);
              m.close();
              ui.toast('Parola değiştirildi');
              showRecovery(code, 'Parola değişti · yeni kurtarma kodu');
            } catch (e) { m.error(e.message); }
          };
          m.$('[data-ok]').onclick = go;
          m.$('form').addEventListener('submit', (e) => { e.preventDefault(); go(); });
        },
      });
    },
    async renewrec() {
      if (!(await askPassword('Kurtarma kodunu yenile', 'Güvenlik için parolanızı girin.'))) return;
      showRecovery(await A.renewRecovery(S.account));
    },
    async setpin() {
      if (!(await askPassword('Hızlı PIN', 'PIN belirlemek için parolanızı onaylayın.'))) return;
      ui.modal({
        title: 'Hızlı PIN belirle',
        body: h`<form data-f class="stack"><p class="muted">Ekran kilitlendiğinde parola yerine kullanılır. 4–8 rakam. PIN yalnızca bu cihazda geçerlidir; 30 günde bir parola istenir.</p>${ui.field({ id: 'n1', label: 'PIN', type: 'password', inputmode: 'numeric', ac: 'off', af: true, max: 8 })}${ui.field({ id: 'n2', label: 'PIN (tekrar)', type: 'password', inputmode: 'numeric', ac: 'off', max: 8 })}<p class="form-error" data-error role="alert"></p></form>`,
        footer: h`<button class="btn" data-close type="button">Vazgeç</button><button class="btn btn-primary" data-ok type="button">Kaydet</button>`,
        onMount(m) {
          const go = async () => {
            const v = ui.formData(m.$('form'));
            try {
              if (v.n1 !== v.n2) return m.error('PIN’ler aynı değil.');
              await A.setPin(S.account, v.n1);
              m.close();
              S._changed('cfg', {});
              ui.toast('PIN kaydedildi');
            } catch (e) { m.error(e.message); }
          };
          m.$('[data-ok]').onclick = go;
          m.$('form').addEventListener('submit', (e) => { e.preventDefault(); go(); });
        },
      });
    },
    async rmpin() { await A.setPin(S.account, null); S._changed('cfg', {}); ui.toast('PIN kaldırıldı'); },
    async enablebio() {
      if (!(await askPassword('Parmak izi / yüz', 'Cihaz doğrulamasını açmak için parolanızı onaylayın.'))) return;
      try {
        const b = await OGR.bio.register(S.account);
        await A.setBio(S.account, b);
        S._changed('cfg', {});
        ui.toast('Cihaz doğrulaması etkinleştirildi');
      } catch (e) { ui.toast(e && e.name === 'NotAllowedError' ? 'Doğrulama iptal edildi veya bu ortamda desteklenmiyor.' : (e.message || 'Etkinleştirilemedi'), { kind: 'error', ms: 5000 }); }
    },
    async disablebio() { await A.setBio(S.account, null); S._changed('cfg', {}); ui.toast('Cihaz doğrulaması kapatıldı'); },
    lockNow() { OGR.app.lock('Oturum kilitlendi'); },
    logout() { OGR.app.logout(); },
    /* --- nedenler --- */
    addreason(b, el) {
      const type = b.dataset.type;
      const i = ui.$(`[data-newreason="${type}"]`, el);
      try { S.addReason(type, i.value); i.value = ''; } catch (e) { V.err(e); }
    },
    rup: (b) => S.moveReason(b.dataset.id, -1),
    rdown: (b) => S.moveReason(b.dataset.id, 1),
    async redit(b) {
      const r = S.reasons.get(b.dataset.id);
      const v = await ui.prompt({ title: 'Nedeni düzenle', label: 'Neden', value: r.label, max: 60 });
      if (v) try { S.updateReason(r.id, { label: v }); } catch (e) { V.err(e); }
    },
    rdel(b) {
      const r = S.reasons.get(b.dataset.id);
      if (r.builtin) { S.updateReason(r.id, { hidden: !r.hidden }); return; }
      S.deleteReason(r.id);
      ui.toast('Neden silindi (geçmiş kayıtlar korunur)');
    },
    /* --- dönemler --- */
    newterm() {
      const cur = S.currentTerm();
      const st = S.termStats(cur.id);
      ui.modal({
        title: 'Yeni dönem başlat',
        body: h`<div class="banner">${icon('info')}<div><b>${cur.name}</b> dönemi arşive alınır (${st.plus} artı, ${st.minus} eksi). Hiçbir kayıt silinmez; sınıf ve öğrenciler aynen kalır, <b>puanlar sıfırdan</b> başlar. Eski dönem raporlarda ve öğrenci sayfasında görüntülenebilir.</div></div>
          <div class="field"><label for="tn">Yeni dönemin adı</label><input id="tn" class="input" maxlength="60" value="${U.nextTermName(cur.name, Date.now())}" data-autofocus></div><p class="form-error" data-error role="alert"></p>`,
        footer: h`<button class="btn" data-close type="button">Vazgeç</button><button class="btn btn-primary" data-ok type="button">Dönemi başlat</button>`,
        onMount(m) {
          m.$('[data-ok]').onclick = async () => {
            try { await S.snapshot('before', 'Yeni dönemden önce'); S.startTerm(m.$('#tn').value); m.close(); ui.toast('Yeni dönem başladı; önceki dönem arşivlendi'); } catch (e) { m.error(e.message); }
          };
        },
      });
    },
    async renameterm(b) {
      const t = S.terms.get(b.dataset.id);
      const v = await ui.prompt({ title: 'Dönemi yeniden adlandır', label: 'Dönem adı', value: t.name, max: 60 });
      if (v) S.renameTerm(t.id, v);
    },
    /* --- yedek --- */
    async backupfile() {
      const o = S.exportData();
      await OGR.export.save(JSON.stringify(o), U.safeFilename(`E+_yedek_${U.isoDay(Date.now())}`) + '.json', 'application/json');
      S.setCfg({ lastBackupAt: Date.now() });
      ui.toast('Yedek dosyası hazırlandı');
    },
    async snapnow() { await S.snapshot('manual', 'Elle alınan yedek'); ui.toast('Cihaz içi yedek alındı'); V.refresh(); },
    restorefile(b, el) { ui.$('[data-restorefile]', el).click(); },
    async snaprestore(b) {
      const obj = await S.readSnapshot(b.dataset.id);
      restoreFlow(obj, 'Cihaz içi yedek');
    },
    async snapdl(b) {
      const obj = await S.readSnapshot(b.dataset.id);
      await OGR.export.save(JSON.stringify(obj), U.safeFilename(`E+_yedek_${U.isoDay(obj.createdAt)}`) + '.json', 'application/json');
    },
    async snapdel(b) { await S.deleteSnapshot(b.dataset.id); V.refresh(); },
    /* --- uygulama --- */
    install() { OGR.app.install(); },
    async wipe() {
      const m = await ui.confirm({ title: 'Tüm veriler silinsin mi?', text: 'Sınıflar, öğrenciler, puanlar ve notlar silinir. Hesabınız kalır. İşlemden hemen önce otomatik bir yedek alınır; “Cihaz içi yedekler” bölümünden geri dönebilirsiniz.', ok: 'Tüm verileri sil', danger: true });
      if (!m) return;
      if (!(await askPassword('Parolanızı onaylayın', 'Tüm veriler silinecek.'))) return;
      await S.wipeData();
      ui.toast('Veriler silindi');
      V.go('');
    },
    async delaccount() {
      if (!(await ui.confirm({ title: 'Hesap silinsin mi?', text: 'Hesabınız ve bu cihazdaki tüm verileriniz kalıcı olarak silinir. Yedek dosyası aldıysanız ileride geri yükleyebilirsiniz.', ok: 'Hesabı sil', danger: true }))) return;
      if (!(await askPassword('Parolanızı onaylayın', 'Hesap kalıcı olarak silinecek.'))) return;
      await OGR.app.deleteAccount();
    },
  };

  function restoreFlow(obj, label) {
    const v = S.validateBackup(obj);
    if (!v.ok) return ui.toast(v.error, { kind: 'error', ms: 6000 });
    const c = v.counts;
    ui.modal({
      title: 'Yedeği geri yükle',
      body: h`<p><b>${label}</b> · ${U.fmtDateTime(obj.createdAt || Date.now())}</p><div class="kpis"><div class="kpi"><div class="kpi-l">Sınıf</div><div class="kpi-v">${c.classes}</div></div><div class="kpi"><div class="kpi-l">Öğrenci</div><div class="kpi-v">${c.students}</div></div><div class="kpi"><div class="kpi-l">Puan kaydı</div><div class="kpi-v">${c.events}</div></div></div>${v.dropped ? h`<div class="banner warn">${icon('alert')}<div>${v.dropped} bozuk kayıt atlanacak.</div></div>` : ''}
        <div class="field"><label>Yöntem</label><div class="stack" style="gap:8px"><label class="check"><input type="radio" name="mode" value="merge" checked><span><b>Birleştir</b> — mevcut verileri koru, yedekteki yeni kayıtları ekle</span></label><label class="check"><input type="radio" name="mode" value="replace"><span><b>Değiştir</b> — mevcut tüm verilerin yerine yedeği koy</span></label></div></div>
        <p class="field-help">İşlemden önce mevcut verilerin otomatik yedeği alınır.</p><p class="form-error" data-error role="alert"></p>`,
      footer: h`<button class="btn" data-close type="button">Vazgeç</button><button class="btn btn-primary" data-ok type="button">Geri yükle</button>`,
      onMount(m) {
        m.$('[data-ok]').onclick = () => ui.busy(m.$('[data-ok]'), async () => {
          try {
            const mode = m.$('input[name=mode]:checked').value;
            const r = await S.importData(obj, { mode });
            m.close();
            ui.toast(mode === 'replace' ? 'Yedek geri yüklendi' : `${r.added} kayıt birleştirildi`);
          } catch (e) { m.error(e.message); }
        });
      },
    });
  }

  V.settingsView = {
    title: () => 'Ayarlar',
    render() {
      const a = S.account;
      const c = S.cfg;
      const lockOpts = [[1, '1 dakika'], [2, '2 dakika'], [5, '5 dakika'], [10, '10 dakika'], [15, '15 dakika'], [30, '30 dakika'], [0, 'Hiçbir zaman']];
      const outOpts = [[15, '15 dakika'], [30, '30 dakika'], [60, '1 saat'], [120, '2 saat'], [480, '8 saat'], [0, 'Hiçbir zaman']];
      const sel = (key, opts) => h`<select class="select sm" data-cfgsel="${key}" style="width:auto" aria-label="${key}">${opts.map(([v, l]) => h`<option value="${v}" ${+c[key] === v ? 'selected' : ''}>${l}</option>`)}</select>`;
      const rl = (type) => S.sortedReasons(type, true).map((r) => h`<li class="${r.hidden ? 'is-hidden' : ''}"><span class="dot ${type}"></span><span class="grow ellipsis">${r.label}${r.hidden ? ' (gizli)' : ''}</span>
        <button class="icon-btn sm" data-act="rup" data-id="${r.id}" aria-label="Yukarı taşı">${icon('arrowUp')}</button><button class="icon-btn sm" data-act="rdown" data-id="${r.id}" aria-label="Aşağı taşı">${icon('arrowDown')}</button>
        <button class="icon-btn sm" data-act="redit" data-id="${r.id}" aria-label="Düzenle">${icon('edit')}</button>
        <button class="icon-btn sm" data-act="rdel" data-id="${r.id}" aria-label="${r.builtin ? (r.hidden ? 'Göster' : 'Gizle') : 'Sil'}">${icon(r.builtin ? (r.hidden ? 'eye' : 'eyeOff') : 'trash')}</button></li>`);
      const reasonCol = (type, title) => h`<div><div class="section-t" style="margin-bottom:8px">${title}</div><ul class="rlist">${rl(type)}</ul><div class="row-nw" style="margin-top:8px"><input class="input sm" data-newreason="${type}" maxlength="60" placeholder="Yeni neden ekle…" aria-label="${title} için yeni neden"><button class="btn btn-sm" data-act="addreason" data-type="${type}">${icon('plus')} Ekle</button></div></div>`;
      const terms = S.sortedTerms();
      const quick = A.quickAllowed(a);
      return h`
        ${V.pageHead('Ayarlar', `${a.name} · ${a.email}`)}
        ${sect('profile', 'Profil', '', h`<form data-profile class="form-grid two" style="padding:8px 0 4px">${ui.field({ id: 'pn', name: 'name', label: 'Ad soyad', value: a.name, max: 60, ac: 'name' })}${ui.field({ id: 'ps', name: 'school', label: 'Okul', value: a.school || '', max: 80 })}${ui.field({ id: 'pe', name: 'email', label: 'E-posta (giriş adresi)', type: 'email', value: a.email, max: 120 })}<div style="align-self:end"><button class="btn btn-primary" type="button" data-act="profile">Kaydet</button></div></form>`)}
        ${sect('security', 'Güvenlik', 'Hesabınız yalnızca bu cihazda saklanır ve başka bir öğretmen hesabı verilerinize erişemez.', h`
          ${row('Parola', 'Parolanız hiçbir zaman düz metin olarak saklanmaz (PBKDF2-SHA256, tuzlu).', h`<button class="btn btn-sm" data-act="changepw">${icon('key')} Parolayı değiştir</button>`)}
          ${row('Kurtarma kodu', 'Parolanızı unutursanız tek yol budur. Yenilerseniz eski kod geçersiz olur.', h`<button class="btn btn-sm" data-act="renewrec">Kodu yenile</button>`)}
          ${row('Hızlı PIN', a.pin ? 'Etkin' + (quick ? '' : ' · parola girişi gerekiyor (30 gün doldu)') : 'Ekran kilidini PIN ile açın (isteğe bağlı).', a.pin ? h`<button class="btn btn-sm" data-act="setpin">Değiştir</button><button class="btn btn-sm btn-danger" data-act="rmpin">Kaldır</button>` : h`<button class="btn btn-sm" data-act="setpin">PIN belirle</button>`)}
          <div class="setting" data-biorow><div><div class="t">Parmak izi / yüz tanıma</div><div class="d" data-biotext>Kontrol ediliyor…</div></div><div class="ctl" data-bioctl></div></div>
          ${row('Otomatik kilit', 'Bu süre boyunca işlem yapılmazsa ekran kilitlenir ve veriler bellekten temizlenir.', sel('autoLockMin', lockOpts))}
          ${row('Otomatik oturum kapatma', 'Bu süre boyunca işlem yapılmazsa oturum tamamen kapanır; yeniden parola gerekir.', sel('autoLogoutMin', outOpts))}
          ${row('Şimdi kilitle', '', h`<button class="btn btn-sm" data-act="lockNow">${icon('lock')} Kilitle</button><button class="btn btn-sm" data-act="logout">${icon('logout')} Oturumu kapat</button>`)}`)}
        ${sect('look', 'Görünüm ve davranış', '', h`

        ${sect('terms', 'Dönemler', 'Dönem başında puanları sıfırlayın; önceki dönem silinmez, arşivde kalır.', h`
          <div style="padding:8px 0"><button class="btn btn-primary" data-act="newterm">${icon('refresh')} Yeni dönem başlat</button></div>
          <ul class="tlist">${terms.map((t) => { const st = S.termStats(t.id); const cur = t.id === c.currentTermId; return h`<li><div class="grow"><b>${t.name}</b> ${cur ? h`<span class="pill brand">Güncel</span>` : h`<span class="pill">Arşiv</span>`}<div class="muted" style="font-size:13px">${U.fmtDate(t.startedAt)}${t.endedAt ? ' – ' + U.fmtDate(t.endedAt) : ' – devam ediyor'} · <span class="t-plus">+${st.plus}</span> <span class="t-minus">−${st.minus}</span></div></div><button class="btn btn-sm" data-act="renameterm" data-id="${t.id}">Adlandır</button></li>`; })}</ul>`)}
        ${sect('backup', 'Yedekleme ve geri yükleme', 'Veriler yalnızca bu cihazdadır. Düzenli yedek alın; yedeği başka cihaza da yükleyebilirsiniz.', h`
          ${row('Yedek dosyası', c.lastBackupAt ? 'Son yedek: ' + U.fmtDateTime(c.lastBackupAt) : 'Henüz dosya yedeği alınmadı.', h`<button class="btn btn-sm btn-primary" data-act="backupfile">${icon('download')} Yedek indir</button><button class="btn btn-sm" data-act="restorefile">${icon('upload')} Yedekten yükle</button><input type="file" accept=".json,application/json" class="sr-only" data-restorefile>`)}
          ${row('Yedek hatırlatması', '', sel('backupReminderDays', [[0, 'Kapalı'], [3, '3 günde bir'], [7, 'Haftada bir'], [14, '2 haftada bir'], [30, 'Ayda bir']]))}
          <div class="setting" style="display:block"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div><div class="t">Cihaz içi yedekler</div><div class="d">Günde bir otomatik alınır; geri yüklemeden/silmeden önce de yedek alınır.</div></div><button class="btn btn-sm" data-act="snapnow">Şimdi yedek al</button></div><ul class="tlist" data-snaps><li class="muted">Yükleniyor…</li></ul></div>`)}
        ${sect('app', 'Uygulama', '', h`
          ${row('Cihaza yükle', OGR.app.canInstall() ? 'Ana ekrana ekleyin; internetsiz de çalışır.' : OGR.app.installNote(), OGR.app.canInstall() ? h`<button class="btn btn-sm btn-primary" data-act="install">${icon('install')} Yükle</button>` : '')}
          ${row('Depolama', S.counts().students + ' öğrenci · ' + S.counts().events + ' puan kaydı', h`<span class="pill" data-persist>…</span>`)}
          ${row('Sürüm', 'E+ ' + OGR.VERSION + ' · ücretsiz', '')}
          <div class="banner" style="margin:10px 0 4px">${icon('shield')}<div>Verileriniz sunucuya gönderilmez; tarayıcı depolamasında tutulur ve cihaz düzeyinde şifrelenmez. Ortak bir bilgisayar kullanıyorsanız işiniz bitince oturumu kapatın.</div></div>`)}
        ${sect('danger', 'Tehlikeli bölge', '', h`
          ${row('Tüm verileri sil', 'Sınıflar, öğrenciler ve puanlar silinir; hesap kalır.', h`<button class="btn btn-sm btn-danger" data-act="wipe">${icon('trash')} Verileri sil</button>`)}
          ${row('Hesabı sil', 'Hesap ve tüm veriler bu cihazdan kalıcı olarak silinir.', h`<button class="btn btn-sm btn-danger" data-act="delaccount">Hesabı sil</button>`)}`)}`;
    },
    mount(el) {
      ui.delegate(el, Object.fromEntries(Object.entries(actions).map(([k, fn]) => [k, (b) => V.safe(fn)(b, el)])));
      ui.$$('[data-cfg]', el).forEach((i) => i.addEventListener('change', () => { S.setCfg({ [i.dataset.cfg]: i.checked }); }));
      ui.$$('[data-cfgsel]', el).forEach((i) => i.addEventListener('change', () => { S.setCfg({ [i.dataset.cfgsel]: +i.value }); OGR.app.touch(); }));
      ui.$$('[data-theme]', el).forEach((b) => (b.onclick = () => S.setCfg({ theme: b.dataset.theme })));
      const rf = ui.$('[data-restorefile]', el);
      rf.addEventListener('change', async () => {
        const f = rf.files[0];
        rf.value = '';
        if (!f) return;
        try {
          if (f.size > 64 * 1024 * 1024) throw new Error('Dosya çok büyük.');
          restoreFlow(JSON.parse(await f.text()), f.name);
        } catch (e) { ui.toast(e instanceof SyntaxError ? 'Dosya geçerli bir yedek değil.' : e.message, { kind: 'error', ms: 5000 }); }
      });
      // Biyometri satırı
      OGR.bio.supported().then((ok) => {
        const t = ui.$('[data-biotext]', el), c = ui.$('[data-bioctl]', el);
        if (!t) return;
        if (!ok) { t.textContent = 'Bu cihaz/tarayıcı parmak izi veya yüz tanımayı (WebAuthn) desteklemiyor.'; return; }
        const on = !!S.account.bio;
        t.textContent = on ? 'Etkin · kilit ekranında kullanılır. Bu cihazın ekran kilidi doğrulaması istenir.' : 'Kilit ekranını cihazınızın parmak izi/yüz/ekran kilidiyle açın.';
        c.innerHTML = on ? '<button class="btn btn-sm btn-danger" data-act="disablebio">Kapat</button>' : '<button class="btn btn-sm" data-act="enablebio">Etkinleştir</button>';
      });
      if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then((p) => { const e = ui.$('[data-persist]', el); if (e) { e.textContent = p ? 'Kalıcı depolama: açık' : 'Kalıcı depolama: tarayıcı kararına bağlı'; e.className = 'pill ' + (p ? 'plus' : 'warn'); } });
      else { const e = ui.$('[data-persist]', el); if (e) e.textContent = 'Bilinmiyor'; }
      S.listSnapshots().then((list) => {
        const ul = ui.$('[data-snaps]', el);
        if (!ul) return;
        ul.innerHTML = list.length
          ? list.map((b) => String(h`<li><div class="grow"><b>${U.fmtDateTime(b.ts)}</b> <span class="pill">${KIND[b.kind] || b.kind}</span><div class="muted" style="font-size:13px">${b.reason || ''} · ${b.counts ? b.counts.students + ' öğrenci, ' + b.counts.events + ' puan' : ''} · ${fmtSize(b.size)}</div></div><button class="btn btn-sm" data-act="snaprestore" data-id="${b.id}">Geri yükle</button><button class="icon-btn sm" data-act="snapdl" data-id="${b.id}" aria-label="İndir">${icon('download')}</button><button class="icon-btn sm" data-act="snapdel" data-id="${b.id}" aria-label="Sil">${icon('trash')}</button></li>`)).join('')
          : '<li class="muted">Henüz cihaz içi yedek yok.</li>';
      });
    },
  };
})();

/* js/app.js */
/* E+ · Uygulama kabuğu: oturum, kilit, yönlendirme, tema, kurulum, çevrimdışı. */
(function () {
  'use strict';
  const OGR = (window.OGR = window.OGR || {});
  const ui = OGR.ui;
  const U = OGR.util;
  const S = OGR.store;
  const A = OGR.auth;
  const V = OGR.views;
  const { h, raw, icon } = ui;
  OGR.VERSION = '1.3.0';

  const app = {};
  OGR.app = app;
  const SS = {
    get(k) { try { return sessionStorage.getItem('eplus:' + k); } catch (e) { return null; } },
    set(k, v) { try { sessionStorage.setItem('eplus:' + k, v); } catch (e) { /* yoksay */ } },
    del(k) { try { sessionStorage.removeItem('eplus:' + k); } catch (e) { /* yoksay */ } },
  };
  const LS = {
    get(k) { try { return localStorage.getItem('eplus:' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('eplus:' + k, v); } catch (e) { /* yoksay */ } },
  };
  let acc = null, active = Date.now(), unsub = null, shellBuilt = false, params = {}, view = null, deferredInstall = null, standalone = false;

  /* ---------- Tema ---------- */
  function applyTheme(t) {
    const r = document.documentElement;
    if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
    const dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    const m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', dark ? '#0a1530' : '#11213f');
    LS.set('theme', t || 'system');
  }
  applyTheme(LS.get('theme') || 'system');

  /* ---------- Oturum ---------- */
  const ctx = {
    enter: (a, o) => app.enter(a, o),
    logout: () => app.logout(),
    demo: async () => {
      await OGR.demo.create();
      const a2 = S.account;
      await app.enter(a2, { demo: true });
    },
  };
  app.touch = () => { active = Date.now(); SS.set('active', String(active)); };
  app.enter = async function (a, o) {
    acc = a;
    await S.open(a);
    if (!(o && o.unlocked)) await A.touch(a);
    SS.set('session', a.id);
    SS.del('locked');
    SS.set('lock', String(S.cfg.autoLockMin));
    SS.set('out', String(S.cfg.autoLogoutMin));
    applyTheme(S.cfg.theme);
    app.touch();
    V.hideAuth && V.hideAuth();
    buildShell();
    bindStore();
    V.route();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* yoksay */ }
    if (o && o.demo) ui.toast('Örnek verilerle denemedesiniz. Oturumu kapatınca bu veriler silinir.', { ms: 6000 });
  };
  app.lock = async function (reason) {
    if (!acc) return;
    ui.closeAllModals();
    ui.closeMenu();
    const a = acc;
    SS.set('locked', '1');
    unbind();
    await S.close();
    shellBuilt = false;
    document.getElementById('view') && (document.getElementById('view').innerHTML = '');
    V.lock(ctx, a, { reason: reason || 'Oturum kilitli', autoBio: false });
  };
  app.logout = async function () {
    const a = acc || (SS.get('session') ? (await A.list()).find((x) => x.id === SS.get('session')) : null);
    ui.closeAllModals();
    ui.closeMenu();
    unbind();
    try { await S.close(); } catch (e) { /* yoksay */ }
    if (a && a.demo) { try { await A.remove(a.id); } catch (e) { /* yoksay */ } }
    acc = null;
    SS.del('session'); SS.del('locked'); SS.del('active');
    shellBuilt = false;
    history.replaceState(null, '', location.pathname + location.search);
    V.login(ctx);
  };
  app.deleteAccount = async function () {
    const id = acc.id;
    unbind();
    await S.close();
    await A.remove(id);
    acc = null;
    SS.del('session'); SS.del('locked');
    shellBuilt = false;
    history.replaceState(null, '', location.pathname + location.search);
    V.login(ctx, { notice: 'Hesap silindi.' });
  };

  // Hareketsizlik: kilit → oturum kapatma
  function idleCheck() {
    if (!acc || !S.uid) return;
    const idle = Date.now() - active;
    const out = (+SS.get('out') || 0) * 60000, lock = (+SS.get('lock') || 0) * 60000;
    if (out && idle > out) { app.logout().then(() => V.login(ctx, { notice: 'Uzun süre işlem yapılmadığı için oturumunuz kapatıldı.' })); return; }
    if (lock && idle > lock) app.lock('Hareketsizlik nedeniyle kilitlendi');
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach((t) => document.addEventListener(t, () => { if (acc && S.uid && Date.now() - active > 4000) app.touch(); else if (acc) active = Date.now(); }, { passive: true, capture: true }));
  setInterval(idleCheck, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) idleCheck(); });
  window.addEventListener('pagehide', () => { if (S.uid) S.flush(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S.uid) S.flush(); });

  /* ---------- Kabuk ---------- */
  function initials(a) { return U.initials(a.name.split(' ')[0], a.name.split(' ').slice(1).pop() || ''); }
  function buildShell() {
    const root = document.getElementById('app');
    root.innerHTML = String(h`
      <header class="topbar"><div class="topbar-in gutter">
        <a class="brand" href="#" aria-label="E+ ana sayfa">${ui.logo}<span>E+</span></a>
        <button type="button" class="searchbtn" data-act="search">${icon('search')} Öğrenci ara… <kbd>/</kbd></button>
        <span class="spacer"></span>
        <span class="savestat" data-save role="status"><i class="dot"></i><span>Kaydedildi</span></span>
        <button type="button" class="icon-btn on-bar only-narrow" data-act="search" aria-label="Öğrenci ara">${icon('search')}</button>
        <button type="button" class="icon-btn on-bar" data-act="account" aria-label="Hesap menüsü" aria-haspopup="menu"><span class="avatar" style="background:${ui.avatarBg(acc.color)}">${initials(acc)}</span></button>
      </div></header>
      <div class="layout">
        <nav class="side gutter" aria-label="Ana gezinme" data-side></nav>
        <main class="main gutter" id="main" tabindex="-1"><div class="main-in" id="view"></div></main>
      </div>
      <nav class="tabbar" aria-label="Ana gezinme" data-tabs>
        <a class="tab" href="#" data-r="home"><span class="tab-i">${icon('book')}</span>Sınıflar</a>
        <button type="button" class="tab" data-act="search"><span class="tab-i">${icon('search')}</span>Ara</button>
        <a class="tab" href="#rapor" data-r="rapor"><span class="tab-i">${icon('chart')}</span>Raporlar</a>
        <a class="tab" href="#ayarlar" data-r="ayarlar"><span class="tab-i">${icon('gear')}</span>Ayarlar</a>
      </nav>`);
    shellBuilt = true;
    ui.delegate(root, {
      search: () => V.searchModal(),
      account: (b) => ui.menu(b, [
        { header: acc.name },
        { label: 'Ayarlar', icon: 'gear', act: () => V.go('ayarlar') },
        { label: S.cfg.theme === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç', icon: S.cfg.theme === 'dark' ? 'sun' : 'moon', act: () => S.setCfg({ theme: S.cfg.theme === 'dark' ? 'light' : 'dark' }) },
        { label: 'Ekranı kilitle', icon: 'lock', act: () => app.lock('Oturum kilitlendi') },
        { sep: true },
        { label: 'Oturumu kapat', icon: 'logout', act: () => app.logout() },
      ]),
    });
    renderSide();
    updateSave();
  }
  function renderSide() {
    const el = document.querySelector('[data-side]');
    if (!el) return;
    const cur = params.route === 'sinif' ? params.id : null;
    el.innerHTML = String(h`
      <a class="navi" href="#" data-r="home">${icon('home')} Sınıflarım</a>
      <div class="side-h"><span class="section-t">Sınıflar</span><button type="button" class="icon-btn sm" data-addclass aria-label="Yeni sınıf">${icon('plus')}</button></div>
      ${S.sortedClasses().map((c) => h`<a class="navi" href="#sinif-${c.id}" ${c.id === cur ? raw('aria-current="page"') : ''}><span class="sw" style="background:var(--cover-${c.color % 8})">${c.grade}</span>${S.className(c)}<small>${S.studentsOf(c.id).length}</small></a>`)}
      ${S.classes.size ? '' : h`<p class="nav-hint">Henüz sınıf yok.</p>`}
      <div class="side-h"><span class="section-t">Araçlar</span></div>
      <a class="navi" href="#rapor" data-r="rapor">${icon('chart')} Raporlar</a>
      <a class="navi" href="#ayarlar" data-r="ayarlar">${icon('gear')} Ayarlar</a>`);
    const b = el.querySelector('[data-addclass]');
    if (b) b.onclick = () => V.classModal(null, (c) => V.go('sinif', c.id));
    markNav();
  }
  function markNav() {
    document.querySelectorAll('[data-r]').forEach((a) => {
      const on = a.dataset.r === (params.route === 'sinif' || params.route === 'ogrenci' ? (a.closest('[data-tabs]') ? 'home' : 'none') : params.route);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.querySelectorAll('[data-side] a[href^="#sinif-"]').forEach((a) => {
      if (params.route === 'sinif' && a.getAttribute('href') === '#sinif-' + params.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function updateSave() {
    const el = document.querySelector('[data-save]');
    if (!el) return;
    const st = S.saveState;
    el.className = 'savestat' + (st.status === 'saving' ? ' saving' : st.status === 'error' ? ' err' : '');
    el.lastElementChild.textContent = st.status === 'saving' ? 'Kaydediliyor…' : st.status === 'error' ? 'Kayıt hatası!' : 'Kaydedildi';
  }

  /* ---------- Yönlendirme ---------- */
  function parseHash() {
    const raw0 = (location.hash || '').replace(/^#\/?/, '');
    const m = /^([a-z]+)(?:-([A-Za-z0-9_-]+))?$/.exec(raw0);
    if (!m) return { route: 'home' };
    const map = { sinif: 'sinif', ogrenci: 'ogrenci', rapor: 'rapor', ayarlar: 'ayarlar' };
    return map[m[1]] ? { route: map[m[1]], id: m[2] } : { route: 'home' };
  }
  const VIEWS = () => ({ home: V.home, sinif: V.classView, ogrenci: V.studentView, rapor: V.reportView, ayarlar: V.settingsView });
  function freshHost() {
    const old = document.getElementById('view');
    const n = old.cloneNode(false);
    old.replaceWith(n);
    return n;
  }
  V.route = function () {
    if (!acc || !S.uid || !shellBuilt) return;
    params = parseHash();
    view = VIEWS()[params.route];
    OGR.charts._specs = {};
    const host = freshHost();
    host.innerHTML = String(view.render(params));
    view.mount && view.mount(host, params);
    document.title = (view.title(params) || 'E+') + ' · E+';
    markNav();
    renderSide();
    window.scrollTo(0, 0);
    document.getElementById('main').focus({ preventScroll: true });
  };
  V.refresh = function () {
    if (!acc || !S.uid || !shellBuilt || !view) return;
    const y = window.scrollY;
    const ae = document.activeElement;
    const keep = ae && ae.dataset && (ae.dataset.q !== undefined) ? { sel: '[data-q]', s: ae.selectionStart } : null;
    const host = freshHost();
    OGR.charts._specs = {};
    host.innerHTML = String(view.render(params));
    view.mount && view.mount(host, params);
    document.title = (view.title(params) || 'E+') + ' · E+';
    renderSide();
    window.scrollTo(0, y);
    if (keep) { const e = host.querySelector(keep.sel); if (e) { e.focus(); try { e.setSelectionRange(keep.s, keep.s); } catch (x) { /* yoksay */ } } }
  };
  window.addEventListener('hashchange', () => { ui.closeMenu(); if (acc && S.uid) V.route(); });

  /* ---------- Depo olayları ---------- */
  let pending = false;
  function onStore(ev) {
    if (ev.kind === 'save') {
      updateSave();
      if (ev.state.status === 'saved') bc && S.uid && bc.postMessage({ uid: S.uid, tab });
      return;
    }
    if (ev.kind === 'cfg') {
      applyTheme(S.cfg.theme);
      SS.set('lock', String(S.cfg.autoLockMin));
      SS.set('out', String(S.cfg.autoLogoutMin));
    }
    if (ev.kind === 'events' && view && view.change) {
      try { if (view.change(ev, document.getElementById('view'), params)) return; } catch (e) { if (OGR.debug) console.error(e); }
    }
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; V.refresh(); });
  }
  function bindStore() { unbind(); unsub = S.on(onStore); }
  function unbind() { if (unsub) { unsub(); unsub = null; } }

  /* ---------- Sekmeler arası eşitleme ---------- */
  const tab = Math.random().toString(36).slice(2);
  let bc = null, reloadT = null;
  try {
    bc = new BroadcastChannel('eplus-sync');
    bc.onmessage = (e) => {
      const d = e.data;
      if (!d || d.tab === tab || !S.uid || d.uid !== S.uid) return;
      clearTimeout(reloadT);
      reloadT = setTimeout(async () => { if (S.uid && !ui.hasModal()) { await S.open(acc); V.refresh(); } }, 600);
    };
  } catch (e) { bc = null; }

  /* ---------- Klavye ---------- */
  document.addEventListener('keydown', (e) => {
    if (!acc || !S.uid) return;
    const t = e.target;
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if (((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) && !ui.hasModal()) { e.preventDefault(); V.searchModal(); }
  });

  /* ---------- Kurulum / çevrimdışı ---------- */
  standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; if (acc) V.refresh(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; ui.toast('E+ cihaza yüklendi'); });
  app.canInstall = () => !!deferredInstall;
  app.install = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) { /* yoksay */ } deferredInstall = null; V.refresh(); };
  app.installNote = () => {
    if (standalone) return 'Uygulama zaten cihaza yüklü.';
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return 'Yükleme ve çevrimdışı kullanım için uygulama paketini bir web adresinde (https) yayınlayın.';
    if (/iphone|ipad/i.test(navigator.userAgent)) return 'Safari’de Paylaş düğmesi → “Ana Ekrana Ekle”.';
    return 'Tarayıcı menüsünden “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini kullanın.';
  };
  function registerSW() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol) || OGR.noSW) return;
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) ui.toast('E+’nın yeni sürümü hazır', { action: { label: 'Yenile', fn: () => nw.postMessage('SKIP_WAITING') }, ms: 15000 });
        });
      });
    }).catch(() => { /* çevrimdışı önbellek olmadan da çalışır */ });
    const had = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || reloading) return; reloading = true; location.reload(); });
  }

  /* ---------- Açılış ---------- */
  app.boot = async function () {
    registerSW();
    try { await OGR.db.open(); } catch (e) { /* bellek yedeği */ }
    if (OGR.db.volatile) ui.toast('Bu tarayıcı kalıcı depolamaya izin vermiyor; veriler sekme kapanınca kaybolur.', { kind: 'error', ms: 9000 });
    const accounts = await A.list();
    const sid = SS.get('session');
    // Kullanılmayan örnek hesapları temizle
    for (const a of accounts) if (a.demo && a.id !== sid) { try { await A.remove(a.id); } catch (e) { /* yoksay */ } }
    const cur = accounts.find((a) => a.id === sid && (!a.demo || true));
    if (cur) {
      const idle = Date.now() - (+SS.get('active') || 0);
      const out = (+SS.get('out') || 0) * 60000, lock = (+SS.get('lock') || 0) * 60000;
      if (out && idle > out) { SS.del('session'); return V.login(ctx, { notice: 'Oturum süresi doldu. Lütfen yeniden giriş yapın.' }); }
      if (SS.get('locked') || (lock && idle > lock)) { acc = cur; return V.lock(ctx, cur, { reason: 'Oturum kilitli' }); }
      return app.enter(cur, { unlocked: true });
    }
    // Soğuk açılış: parola (ya da süresi dolmamış hızlı kilit açma) gerekir
    const last = LS.get('lastEmail');
    const known = last ? accounts.find((a) => a.email === last) : null;
    if (known && A.quickAllowed(known)) { acc = known; SS.set('lock', '5'); return V.lock(ctx, known, { reason: 'Hoş geldiniz', autoBio: !!known.bio }); }
    V.login(ctx);
  };
})();


(function(){
  OGR.export.canPrint = false;
  OGR.export.saver = async function (bytes, name) {
    let d = null;
    try { d = window.claude && (await window.claude.use('downloads')); } catch (e) { d = null; }
    if (!d) throw new Error('Bu görünümde dosya indirme kullanılamıyor. Uygulamayı kendi web adresinizde yayınlayarak kullanın.');
    try { await d.save({ filename: name, data: bytes }); }
    catch (e) { if (e && e.code === 'declined') return; throw new Error('Dosya kaydedilemedi' + (e && e.code ? ' (' + e.code + ')' : '') + '.'); }
  };
  OGR.app.boot();
})();
</script>
